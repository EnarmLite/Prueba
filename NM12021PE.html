    <script>
        const questionsData = [


    // BLOQUE 1: Diagnóstico y Tratamiento de la Neumonía Bacteriana Adquirida en la Comunidad en Población Menor a 18 Años (1-20)
    {
        id: 1, 
        question: "¿Cuál es el tiempo máximo de aparición de los síntomas tras un egreso hospitalario para clasificar a la infección respiratoria como Neumonía Bacteriana Adquirida en la Comunidad?", 
        options: ["Menor a 24 horas", "Menor a 48 horas", "Menor a 96 horas", "Menor a 72 horas"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, el corte cronológico es indispensable para diferenciar una etiología comunitaria de una colonización patógena de origen nosocomial, orientando directamente el esquema antibiótico inicial empírico.<br><br>Perla ENARM: \"Neumonía bacteriana adquirida en la comunidad: Infección aguda del parénquima pulmonar adquirida por la exposición a un microorganismo bacteriano presente en la comunidad o que se manifieste antes de las 72 horas del egreso hospitalario\".<br><br>Análisis de Distractores: Las opciones de 24 y 48 horas son incorrectas, ya que el periodo de incubación intrahospitalario puede prolongarse más allá de este margen. El corte de 96 horas excede la ventana epidemiológica aceptada mundialmente para descartar el origen nosocomial post-alta.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Glosario, Página 80." 
    },
    {
        id: 2, 
        question: "¿Cuál es el factor de riesgo ambiental con mayor porcentaje de asociación epidemiológica documentado para el desarrollo de Neumonía Bacteriana Adquirida en la Comunidad?", 
        options: ["Tabaquismo pasivo", "Hacinamiento familiar", "Asistencia a guarderías", "Desnutrición leve"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, la convivencia estrecha en espacios cerrados promueve una alta carga de inóculo bacteriano compartido a través de las gotas de Flügge, superando en peso porcentual a otros determinantes del entorno en la población pediátrica.<br><br>Perla ENARM: \"Entre los factores de riesgo relacionados con el ambiente están: estacionalidad, bajo nivel socioeconómico, madre adolescente... tabaquismo pasivo y/o la exposición a contaminantes ambientales y hacinamiento (77%)\".<br><br>Análisis de Distractores: El tabaquismo pasivo y la asistencia a guarderías son factores de riesgo reales citados en el documento, pero poseen una carga estadística menor en comparación directa con el hacinamiento. La desnutrición leve es un factor del huésped, no un determinante ambiental primario para adquirir la infección.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Introducción, Página 9." 
    },
    {
        id: 3, 
        question: "¿Cuál es la medida preventiva de tipo nutricional sugerida normativamente hasta los 6 meses de edad para evitar la Neumonía Bacteriana Adquirida en la Comunidad?", 
        options: ["Ablactación temprana", "Suplementación con vitamina C", "Uso de fórmulas hidrolizadas", "Lactancia materna exclusiva"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, la transferencia pasiva de inmunidad celular y humoral, específicamente mediante la inmunoglobulina A secretora, protege la mucosa del tracto respiratorio de agentes patógenos comunitarios circulantes.<br><br>Perla ENARM: \"Se recomienda la lactancia materna exclusiva mínimo hasta los seis meses de edad como factor de protección contra la NBAC\".<br><br>Análisis de Distractores: La vitamina C no figura como estrategia profiláctica universal en este documento oficial. Las modificaciones a las fórmulas lácteas o la ablactación carecen del efecto inmunoprotector activo que provee la leche humana de manera natural.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Prevención, Página 15." 
    },
    {
        id: 4, 
        question: "¿Cuál es el signo clínico aislado que ha demostrado una especificidad del 95 % para establecer el diagnóstico presuntivo de Neumonía Bacteriana Adquirida en la Comunidad?", 
        options: ["Taquipnea", "Tos productiva", "Fiebre de alto grado", "Estertores crepitantes"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, el aumento en la frecuencia respiratoria es el mecanismo compensatorio temprano ante la pérdida de la distensibilidad alveolar secundaria a la consolidación, convirtiéndose en el indicador objetivo más preciso.<br><br>Perla ENARM: \"La taquipnea ha demostrado una mayor especificidad (95%) y a su vez un mayor factor predictor negativo individual (VPN = 84.7% en menores de 2 años y 97.4% en menores de 5 años)\".<br><br>Análisis de Distractores: La tos es altamente sensible pero inespecífica para afección alveolar (común en vías altas). La fiebre y los crepitantes complementan el diagnóstico clínico integral, pero por sí solos no superan la especificidad estadística de la medición de la frecuencia respiratoria alterada.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Introducción, Página 8." 
    },
    {
        id: 5, 
        question: "¿Cuál es el agente bacteriano aislado con mayor frecuencia a nivel mundial como causante etiológico de consolidaciones alveolares en pediatría?", 
        options: ["Haemophilus influenzae", "Mycoplasma pneumoniae", "Streptococcus pneumoniae", "Staphylococcus aureus"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, el neumococo coloniza habitualmente la nasofaringe y es el principal patógeno responsable de los cuadros pulmonares típicos, definiendo la dirección empírica del protocolo terapéutico con betalactámicos.<br><br>Perla ENARM: \"Los microorganismos más comúnmente aislados fueron Streptococcus pneumoniae (76.7%) seguido de Haemophilus influenzae (3.1%) y Staphylococcus aureus (2.1%)\".<br><br>Análisis de Distractores: Las bacterias Haemophilus influenzae y Staphylococcus aureus son causas confirmadas de Neumonía Bacteriana Adquirida en la Comunidad, pero sus porcentajes de aislamiento son considerablemente inferiores. Mycoplasma pneumoniae causa cuadros atípicos, no siendo el principal agente de la clásica consolidación alveolar purulenta.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Diagnóstico, Página 17." 
    },
    {
        id: 6, 
        question: "Utilizando los criterios clínicos de gravedad, ¿cuál es el valor de oximetría de pulso estandarizado que clasifica inmediatamente a la patología como Neumonía Bacteriana Adquirida en la Comunidad severa?", 
        options: ["Menor a 95 %", "Menor a 92 %", "Menor a 90 %", "Menor a 88 %"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, la hipoxemia refractaria es el desencadenante principal de la cascada de disfunción tisular, estableciendo el criterio absoluto para iniciar oxigenoterapia e ingreso a manejo intrahospitalario.<br><br>Perla ENARM: \"Características de la NAC severa en niños y jóvenes: Dificultad para respirar, Tiraje intercostal, Saturación de oxígeno < 90%\".<br><br>Análisis de Distractores: Si bien valores de 92 % o 95 % son anormales en una gasometría de población pediátrica, el algoritmo dicta estrictamente el umbral menor a 90 % para cambiar la definición operativa del caso a enfermedad severa grave.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Cuadros o Figuras (Cuadro 1), Página 33." 
    },
    {
        id: 7, 
        question: "En el abordaje inicial de un paciente con Neumonía Bacteriana Adquirida en la Comunidad clasificada como no severa, ¿cuál estudio de laboratorio se encuentra indicado no solicitar rutinariamente?", 
        options: ["Procalcitonina cuantitativa sérica", "Velocidad de sedimentación globular", "Biometría hemática", "Hemocultivo periférico"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, en un cuadro clínico de presentación leve y pronóstico favorable sin hipoxemia, las alteraciones leucocitarias no modifican el uso del antibiótico vía oral, evitando dolor y gastos innecesarios.<br><br>Perla ENARM: \"No se sugiere realizar una biometría hemática en pacientes con sospecha de NBAC no severa\".<br><br>Análisis de Distractores: El hemocultivo, procalcitonina y velocidad de sedimentación globular no se piden de manera inicial ni en cuadros leves, pero la guía emite una recomendación y perla específica explícita sobre la omisión sistemática de la biometría hemática en el ámbito ambulatorio.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Diagnóstico, Página 18." 
    },
    {
        id: 8, 
        question: "¿Cuál es la eventualidad clínica o el dato de alarma sistémico que justifica la indicación precisa de un hemocultivo periférico en la Neumonía Bacteriana Adquirida en la Comunidad severa?", 
        options: ["Datos de sepsis", "Fiebre persistente", "Derrame pleural asintomático", "Uso previo de cefalosporinas"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, en pacientes con choque o hipoperfusión tisular, el rendimiento de recuperación microbiana en sangre periférica aumenta exponencialmente, lo que es vital para la tipificación y ajuste guiado del antibiótico parenteral.<br><br>Perla ENARM: \"Se sugiere realizar hemocultivo (en caso de estar disponible) en pacientes con NBAC severa con datos de sepsis\".<br><br>Análisis de Distractores: La fiebre persistente requiere reevaluación al tercer día, pero no obliga al cultivo sanguíneo directo sin disfunción de órganos. El uso de antibióticos previos advierte resistencia, mas no asegura bacteriemia. En los derrames pleurales se sugiere punción para obtener líquido, no necesariamente hemocultivo primario.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Diagnóstico, Página 17." 
    },
    {
        id: 9, 
        question: "¿Cuál es el tratamiento antimicrobiano administrado por vía oral establecido como primera elección empírica en Neumonía Bacteriana Adquirida en la Comunidad no severa sin alergias?", 
        options: ["Cefuroxima", "Amoxicilina", "Claritromicina", "Trimetoprima-sulfametoxazol"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, la monoterapia con un betalactámico base garantiza la cobertura efectiva sobre las cepas sensibles circulantes de neumococo en el entorno comunitario, respetando las normas de control antimicrobiano.<br><br>Perla ENARM: \"Se sugiere el tratamiento con amoxicilina VO en pacientes con NBAC no severa (no alérgicos a la penicilina)\".<br><br>Análisis de Distractores: Los macrólidos como la claritromicina son segunda opción para alergias o sospecha de patógenos atípicos. Las cefalosporinas (cefuroxima) son fármacos intrahospitalarios de segunda generación. Trimetoprima-sulfametoxazol no supera el perfil terapéutico de la amoxicilina contra microorganismos grampositivos alveolares.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Tratamiento, Página 22." 
    },
    {
        id: 10, 
        question: "¿Cuál es el esquema antibiótico endovenoso indicado como estándar de oro inicial para un paciente hospitalizado por Neumonía Bacteriana Adquirida en la Comunidad severa sin alergias ni factores de resistencia?", 
        options: ["Ceftriaxona", "Penicilina G", "Azitromicina", "Cefotaxima"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, en ausencia de exposición reciente a antibióticos y con una presentación clásica bacteriana grave, el espectro reducido preserva a las cefalosporinas superiores y controla rápidamente el inóculo pulmonar.<br><br>Perla ENARM: \"Se sugiere el tratamiento endovenoso con penicilina G en pacientes con NBAC severa (no alérgicos a la penicilina)\".<br><br>Análisis de Distractores: Las cefalosporinas de tercera generación (ceftriaxona o cefotaxima) no deben usarse indiscriminadamente al ingreso si no se identifican riesgos de neumococo resistente. La azitromicina es para pacientes con choque anafiláctico previo.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Tratamiento, Página 26." 
    },
    {
        id: 11, 
        question: "En el manejo intrahospitalario de un paciente con Neumonía Bacteriana Adquirida en la Comunidad severa, ¿qué familia de antibióticos se sugiere utilizar ante el antecedente documentado de choque anafiláctico o alergia grave a penicilina?", 
        options: ["Cefalosporinas de segunda generación", "Cefalosporinas de tercera generación", "Macrólidos o doxiciclina", "Aminoglucósidos o vancomicina"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Neumonía en menores, la reacción inmediata mediada por IgE contra el anillo betalactámico obliga a descartar todas las generaciones de cefalosporinas debido al riesgo mortal de reactividad cruzada, optando por inhibidores de la síntesis proteica.<br><br>Perla ENARM: \"Se sugiere que en el caso de antecedente de alergia grave, inmediata o documentada a la penicilina los pacientes con NBAC severa se traten con azitromicina, claritromicina o eritromicina\".<br><br>Análisis de Distractores: Cefalosporinas de cualquier generación están formalmente contraindicadas en anafilaxia. Vancomicina o aminoglucósidos no forman parte del algoritmo primario de rescate por alergia a penicilina para infecciones alveolares típicas comunitarias.", 
        source: "GPC-SS-120-21, Diagnóstico y tratamiento de la neumonía bacteriana adquirida en la comunidad en población menor a 18 años, 2021, Tratamiento, Página 26." 
    },
    {
        id: 12, 
        question: "¿Cuál es la indicación de modificación terapéutica para Neumonía Bacteriana Adquirida en la Comunidad severa si existe el antecedente de una alergia catalogada como leve o no demostrada a la penicilina?",

                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('12021Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('12021LastQId', currentQuestionId);
                else localStorage.removeItem('12021LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('12021Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

</body>
</html>
