    <script>
        const questionsData = [
    {
        id: 1,
        question: "En el tamizaje de Sobrepeso y Obesidad Exógena en adultos, ¿cada cuánto tiempo se debe realizar la medición de peso y cálculo del Índice de Masa Corporal?",
        options: [
            "Cada seis meses",
            "Cada dos años",
            "De forma anual",
            "En cada consulta"
        ],
        answer: 2,
        justification: "Justificación: El tamizaje universal busca la detección oportuna de alteraciones en el peso corporal para intervenir de forma oportuna. De acuerdo GPC de Obesidad Exógena, es indispensable llevar un registro constante del Índice de Masa Corporal para identificar variaciones ponderales y actuar preventivamente de forma anual.<br><br>Perla ENARM: Se recomienda medir peso y calcular IMC de forma anual.<br><br>Análisis de Distractores: La opción A (cada seis meses) o D (cada consulta) pueden ser útiles en pacientes en control activo, pero no es la recomendación de tamizaje universal. La opción B (cada dos años) prolonga demasiado el tiempo de detección de ganancia de peso acelerada.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Diagnóstico, p. 16."
    },
    {
        id: 2,
        question: "En la evaluación del Sobrepeso y Obesidad Exógena, ¿en qué grupo de pacientes se encuentra contraindicado el uso del Índice de Masa Corporal para clasificar el estado de peso?",
        options: [
            "Pacientes adultos mayores",
            "Mujeres embarazadas",
            "Pacientes de baja estatura",
            "Pacientes diabéticos tipo 2"
        ],
        answer: 1,
        justification: "Justificación: El uso de esta métrica en estados con retención de líquidos o expansión de volumen fisiológico distorsiona la relación peso/talla corporal. De acuerdo GPC de Obesidad Exógena, las embarazadas y lactantes no deben evaluarse con el Índice de Masa Corporal porque sobreestima el estado graso real.<br><br>Perla ENARM: No se recomienda utilizar el IMC en mujeres embarazadas y en periodo de lactancia.<br><br>Análisis de Distractores: Las opciones A, C y D pueden requerir ajustes interpretativos (ej. sarcopenia en ancianos o talla baja), pero el Índice de Masa Corporal no está contraindicado de forma absoluta en ellos como en el embarazo.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Diagnóstico, p. 16."
    },
    {
        id: 3,
        question: "En el diagnóstico de Sobrepeso y Obesidad Exógena, ¿en qué rango de Índice de Masa Corporal es obligatorio medir la circunferencia de cintura para evaluar el riesgo cardiovascular?",
        options: [
            "18.5 a 24.9 kg/m2",
            "20.0 a 29.9 kg/m2",
            "30.0 a 39.9 kg/m2",
            "25.0 a 35.0 kg/m2"
        ],
        answer: 3,
        justification: "Justificación: La adiposidad visceral puede estar aumentada sin que el peso total se eleve de forma proporcional en este espectro intermedio de peso. De acuerdo GPC de Obesidad Exógena, medir la cintura en este grupo revela el riesgo metabólico real oculto bajo el cálculo de masa corporal simple de 25.0 a 35.0 kg/m2.<br><br>Perla ENARM: Se recomienda medir además la circunferencia de cintura en aquellos pacientes con un IMC entre 25 y 35 kg/m2 porque la adiposidad abdominal y sus riesgos asociados podrían no ser capturados en este rango de IMC.<br><br>Análisis de Distractores: En la opción A, el peso es normal. Las opciones B y C abarcan rangos donde la medición o no es obligatoria o ya se asume un riesgo cardiovascular intrínsecamente muy elevado que la hace innecesaria.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Diagnóstico, p. 16."
    },
    {
        id: 4,
        question: "En pacientes adultos con Sobrepeso y Obesidad Exógena, ¿a partir de qué valor de Índice de Masa Corporal se considera clínicamente innecesaria la medición de la circunferencia de cintura?",
        options: [
            "> 35 kg/m2",
            "> 30 kg/m2",
            "> 40 kg/m2",
            "> 27 kg/m2"
        ],
        answer: 0,
        justification: "Justificación: Cuando el paciente ya tiene un grado de obesidad severo, el riesgo cardiovascular e inflamatorio por exceso graso se encuentra en su nivel más alto por definición. De acuerdo GPC de Obesidad Exógena, si el Índice de Masa Corporal supera este umbral, el riesgo metabólico se asume máximo y la medición de la circunferencia abdominal ya no añade valor diagnóstico.<br><br>Perla ENARM: La medición de la circunferencia de cintura es innecesaria en pacientes con un IMC > 35 kg/m2.<br><br>Análisis de Distractores: Las opciones B y D representan obesidad grado 1 o sobrepeso con comorbilidades donde la cintura sí aporta información pronóstica crucial. La opción C representa obesidad mórbida, donde ya es evidentemente tardía la medición.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Diagnóstico, p. 16."
    },
    {
        id: 5,
        question: "En pacientes masculinos adultos con Sobrepeso y Obesidad Exógena, ¿a partir de qué circunferencia de cintura se establece un incremento documentado en el riesgo de padecer enfermedades crónicas no transmisibles?",
        options: [
            "> 80 cm",
            "> 90 cm",
            "> 102 cm",
            "> 94 cm"
        ],
        answer: 1,
        justification: "Justificación: La acumulación de grasa visceral en el varón tiene un impacto metabólico directo. De acuerdo GPC de Obesidad Exógena, una medición por encima de esta cifra en hombres denota el inicio de la elevación en la probabilidad de desarrollar diabetes mellitus tipo 2 y enfermedad coronaria.<br><br>Perla ENARM: El riesgo aumenta si la circunferencia de cintura mide más de 80 centímetros en mujeres y más de 90 centímetros en el caso de los hombres.<br><br>Análisis de Distractores: La opción A es el punto de corte de riesgo para mujeres (> 80 cm). Las opciones C y D marcan umbrales de riesgo cardiovascular \"alto\" (> 94 cm) y \"muy alto\" (> 102 cm) en hombres, pero el incremento inicial de riesgo parte desde los 90 cm.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Diagnóstico, p. 17."
    },
    {
        id: 6,
        question: "En el tratamiento de Sobrepeso y Obesidad Exógena, ¿cuál es el rango de Índice de Masa Corporal para iniciar farmacoterapia en un paciente con comorbilidades metabólicas si fallaron los cambios en el estilo de vida?",
        options: [
            "25.0 a 26.9 kg/m2",
            "35.0 a 39.9 kg/m2",
            "27.0 a 29.9 kg/m2",
            "> 40.0 kg/m2"
        ],
        answer: 2,
        justification: "Justificación: El manejo farmacológico requiere de indicaciones precisas para evitar riesgos innecesarios. De acuerdo GPC de Obesidad Exógena, los pacientes con sobrepeso grado II y comorbilidades asociadas que no logren reducir el 5% de peso corporal basal en 3 a 6 meses son candidatos idóneos para iniciar tratamiento con medicamentos.<br><br>Perla ENARM: Los candidatos para iniciar farmacoterapia son aquellos pacientes con un IMC > 30 kg/m2, o un IMC de 27 a 29.9 kg/m2 con comorbilidades, que no han alcanzado las metas de pérdida de peso...<br><br>Análisis de Distractores: La opción A es sobrepeso grado I sin criterio de fármacos. Las opciones B y D corresponden a obesidad grado 2 y grado 3 (mórbida), donde la terapia de elección inicial o de rescate respectivamente suele enfocarse en intervenciones más intensivas o quirúrgicas directas.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Tratamiento Farmacológico, p. 18."
    },
    {
        id: 7,
        question: "En el tratamiento farmacológico de Sobrepeso y Obesidad Exógena, ¿cuál es el medicamento considerado de primera elección debido a sus beneficios metabólicos y tensionales asociados?",
        options: [
            "Orlistat",
            "Fentermina",
            "Liraglutida",
            "Lorcaserina"
        ],
        answer: 0,
        justification: "Justificación: El perfil de seguridad a largo plazo de este inhibidor reversible de las lipasas pancreáticas es amplio. De acuerdo GPC de Obesidad Exógena, se prefiere esta molécula de manera inicial porque además de la pérdida ponderal, ha demostrado reducir de forma concomitante la presión arterial y optimizar el perfil de lípidos y glucosa.<br><br>Perla ENARM: Se recomienda el orlistat como medicamento de primera elección por los beneficios reportados en cuanto a reducción de la presión arterial, niveles de glucosa y de lípidos.<br><br>Análisis de Distractores: La liraglutida (C) se indica si coexiste diabetes mellitus tipo 2 mal controlada. La fentermina (B) se reserva para uso a corto plazo y lorcaserina (D) es un agente de segunda línea por otras consideraciones.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Tratamiento Farmacológico, p. 19."
    },
    {
        id: 8,
        question: "En pacientes con Sobrepeso y Obesidad Exógena que además presentan Diabetes Mellitus tipo 2, ¿cuál es la dosis de mantenimiento diaria recomendada de liraglutide?",
        options: [
            "1.2 mg",
            "1.8 mg",
            "0.6 mg",
            "3.0 mg"
        ],
        answer: 3,
        justification: "Justificación: Liraglutide ejerce efectos reguladores sobre el apetito a nivel central. De acuerdo GPC de Obesidad Exógena, mientras que las dosis de 1.2 mg o 1.8 mg se emplean para el control glucémico de la diabetes mellitus tipo 2, la pérdida óptima de grasa corporal exige escalar de forma semanal hasta la dosis diana de 3.0 mg al día.<br><br>Perla ENARM: Se puede incrementar la dosis en intervalos semanales de 1.2, 1.8 o 2.4 mg hasta llegar a la dosis recomendada de 3 mg.<br><br>Análisis de Distractores: Las opciones A y B son dosis aprobadas únicamente para control glucémico en diabetes mellitus tipo 2. La opción C es la dosis de inicio para la fase de titulación y tolerancia gastrointestinal.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Tratamiento Farmacológico, p. 21."
    },
    {
        id: 9,
        question: "En el tratamiento farmacológico de Sobrepeso y Obesidad Exógena con lorcaserina, ¿en qué semana se debe realizar de manera obligatoria la evaluación de la respuesta terapéutica?",
        options: [
            "Semana 4",
            "Semana 12",
            "Semana 24",
            "Semana 8"
        ],
        answer: 1,
        justification: "Justificación: El uso de moduladores del receptor de serotonina requiere de una monitorización estrecha de eficacia y tolerancia. De acuerdo GPC de Obesidad Exógena, a los 3 meses se debe valorar si el paciente ha respondido de forma adecuada al fármaco; de lo contrario, se asume futilidad clínica y debe suspenderse.<br><br>Perla ENARM: Se recomienda una dosis de 10 mg de lorcaserina en pacientes adultos con obesidad, dos veces al día, tomada con o sin alimentos, sin necesidad de un periodo de titulación. Se debe evaluar la respuesta al tratamiento a la semana 12.<br><br>Análisis de Distractores: La semana 4 (A) u 8 (D) son periodos muy cortos para consolidar el efecto ponderal estable. La semana 24 (C) prolonga innecesariamente la exposición a un tratamiento ineficaz en pacientes no respondedores.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Tratamiento Farmacológico, p. 21."
    },
    {
        id: 10,
        question: "En pacientes con Sobrepeso y Obesidad Exógena, ¿cuál es el límite de depuración de creatinina que contraindica el uso de lorcaserina?",
        options: [
            "< 50 mL/min",
            "< 15 mL/min",
            "< 30 mL/min",
            "< 60 mL/min"
        ],
        answer: 2,
        justification: "Justificación: La eliminación de los metabolitos de este fármaco serotoninérgico puede alterarse severamente ante disfunción renal significativa. De acuerdo GPC de Obesidad Exógena, la insuficiencia renal moderada-grave a partir de este umbral genera acumulación y riesgo incrementado de reacciones adversas, por lo que su uso queda prohibido.<br><br>Perla ENARM: No se debe utilizar lorcaserina en pacientes con una depuración de creatinina menor de 30 mL/min ni durante el embarazo.<br><br>Análisis de Distractores: Las opciones A y D representan reducciones leves a moderadas de la tasa de filtración glomerular que permiten el uso con precaución de otras moléculas. La opción B corresponde a falla renal terminal, donde prácticamente la totalidad de los fármacos antiobesidad están contraindicados.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Tratamiento Farmacológico, p. 21."
    },
    {
        id: 11,
        question: "En el tratamiento farmacológico de Sobrepeso y Obesidad Exógena con la combinación fentermina/topiramato, ¿qué porcentaje de pérdida de peso respecto al basal a las 12 semanas obliga a considerar un escalamiento de dosis?",
        options: [
            "< 3%",
            "< 5%",
            "< 10%",
            "< 1%"
        ],
        answer: 0,
        justification: "Justificación: El tratamiento con fentermina/topiramato requiere un esquema progresivo condicionado a la respuesta. De acuerdo GPC de Obesidad Exógena, si tras 12 semanas con la dosis inicial la pérdida ponderal es inferior a este porcentaje, el algoritmo médico faculta al clínico para elevar la dosis terapéutica de manera escalonada hasta el nivel máximo.<br><br>Perla ENARM: Se puede incrementar la dosis a 11.25/69 mg por 14 días y después a 15 mg/92 mg diarios si después de 12 semanas de tratamiento no se ha logrado alcanzar una pérdida de peso del 3% del peso corporal basal.<br><br>Análisis de Distractores: La opción B (5%) es la meta estándar de pérdida de peso a largo plazo. Las opciones C y D no corresponden con el punto de corte establecido en el algoritmo para la titulación de esta combinación específica de dosis fija.",
        source: "GPC-IMSS-046-18, Diagnóstico y Tratamiento del Sobrepeso y Obesidad Exógena, 2018, Sección: Evidencias y Recomendaciones, Tratamiento Farmacológico, p. 23."
    },

                    <div class="relative bg-slate-900 dark:bg-slate-950 rounded-[2rem] p-8 md:p-12 shadow-xl text-white overflow-hidden border border-slate-800 transition-colors duration-500 ${isAllCompleted ? 'ring-2 ring-emerald-500/50' : ''}">
                        <div class="absolute top-0 right-0 w-64 h-64 ${blur1} rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none transition-colors duration-500"></div>
                        <div class="absolute bottom-0 left-0 w-48 h-48 ${blur2} rounded-full blur-3xl -ml-10 -mb-10 pointer-events-none transition-colors duration-500"></div>
                        
                        <div class="relative z-10 flex flex-col lg:flex-row justify-between items-center gap-8">
                            <div class="text-center lg:text-left">
                                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4 border ${badgeClass} transition-colors duration-500">
                                    ${badgeText}
                                </span>
                                <h1 class="text-3xl md:text-4xl lg:text-4xl font-extrabold tracking-tight mb-3 transition-colors duration-500 ${isAllCompleted ? 'text-emerald-400 drop-shadow-md' : ''}">${titleText}</h1>
                                <p class="text-slate-300 text-base md:text-lg font-medium max-w-lg mx-auto lg:mx-0 transition-colors duration-500">${descText}</p>
                                
                                <div class="mt-8 flex justify-center lg:justify-start">
                                    ${actionBtn}
                                </div>
                            </div>
                            
                            <!-- Tarjeta de Estadísticas Modificada -->
                            <div class="flex-shrink-0 bg-slate-800/50 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 flex flex-col sm:flex-row items-center shadow-2xl w-full lg:max-w-md">
                                <div class="grid grid-cols-3 gap-2 sm:gap-4 divide-x divide-white/20 w-full text-center">
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Respondidas</p>
                                        <p class="text-2xl sm:text-3xl font-black">${ans}<span class="text-xs sm:text-sm text-slate-500">/${total}</span></p>
                                    </div>
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Correctas</p>
                                        <p class="text-2xl sm:text-3xl font-black text-emerald-300">${correct}</p>
                                    </div>
                                    <div class="px-2">
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Rendimiento</p>
                                        <p class="text-2xl sm:text-3xl font-black text-yellow-300">${successRate}%</p>
                                        <p class="text-[8px] text-slate-400 mt-1 leading-tight">Aciertos vs Respondidas</p>

                            </div>
                        </div>
                    </div>

                    <!-- TABLERO VISIBLE Y SCROLLABLE -->
                    <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-slate-800 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <svg class="w-5 h-5 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-purple-100 dark:border-purple-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-purple-50 has-[:checked]:border-purple-400 dark:has-[:checked]:bg-purple-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-purple-600 focus:ring-purple-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-purple-600 dark:hover:bg-purple-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-fuchsia-600 hover:to-purple-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('04618Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('04618LastQId', currentQuestionId);
                else localStorage.removeItem('04618LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('04618Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

    const app = initializeApp(firebaseConfig);
