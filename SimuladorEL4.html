<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador ENARM Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }

        .logo-enarm {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            color: #004c8c;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        .logo-Lite {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            color: #70b93d;
        }
        .logo-Lite sup { font-size: 0.6em; top: -0.4em; position: relative; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300 h-[100dvh] overflow-hidden">

    <div id="app-container" class="relative h-full lg:flex">
        
        <!-- SIDEBAR: MAPA DE PREGUNTAS -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 w-80 p-5 flex flex-col transform -translate-x-full transition-transform duration-300 ease-in-out z-30 shadow-[4px_0_24px_rgba(0,0,0,0.05)] border-r border-slate-200 dark:border-slate-800">
            
            <div class="flex justify-center mb-6 pt-2">
                <div class="flex items-baseline gap-1 bg-slate-50 dark:bg-slate-800 px-4 py-1.5 rounded-full border border-slate-200 dark:border-slate-700">
                    <span class="logo-enarm text-base">ENARM</span>
                    <span class="logo-Lite text-sm">Lite<sup>®</sup></span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto min-h-0 custom-scrollbar pr-1">
                <div class="mb-4 relative">
                    <input type="text" id="module-search" placeholder="Buscar en casos o preguntas..." class="w-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-lg py-2 pl-3 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute right-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>

                <!-- Rejilla de 280 preguntas continuas -->
                <div id="sidebar-q-grid" class="grid grid-cols-[repeat(auto-fill,minmax(38px,1fr))] gap-1.5 p-1"></div>
            </div>
            
            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 mt-2 space-y-3">
                <button id="dark-mode-toggle" class="w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 font-semibold py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg id="sun-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="moon-icon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                    Alternar Tema
                </button>

                <button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full bg-white dark:bg-slate-800 text-red-500 border border-red-200 dark:border-red-900/50 font-semibold py-2.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reiniciar Simulador
                </button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content" class="flex-1 h-[100dvh] overflow-y-auto overscroll-y-contain p-4 sm:p-6 lg:p-8 transition-all duration-300 relative bg-slate-50 dark:bg-slate-950">
            
            <button id="dashboard-button" onclick="displayQuestion(null)" class="hidden fixed top-4 left-4 lg:left-[22rem] bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-300" title="Ver Tablero General">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
            </button>

            <button id="menu-toggle" class="hidden fixed top-4 right-4 lg:right-8 bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
            </button>

            <!-- Barra de Progreso General -->
            <div id="progress-container" class="hidden w-full max-w-5xl mx-auto bg-slate-200 dark:bg-slate-800 rounded-full mb-6 mt-0 h-5 shadow-inner overflow-hidden relative">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full transition-all duration-500 flex items-center justify-center text-[10px] font-bold text-white leading-none relative z-10" style="width:0%">0%</div>
            </div>
            
            <div id="module-display" class="transition-opacity duration-300 pb-12"></div>
        </main>
        
        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-slate-900/40 z-20 backdrop-blur-sm"></div>
    </div>
    
    <!-- MODALES -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Reiniciar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">Se borrará todo tu progreso y respuestas de los casos. ¿Deseas empezar desde cero?</p>
            <div class="flex gap-3">
                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>
        </div>
    </div>

    <div id="finish-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Finalizar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">¿Estás seguro de que deseas terminar? Se evaluarán todas tus respuestas y se liberará la justificación médica.</p>
            <div class="flex gap-3">
                <button id="cancel-finish" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Seguir contestando</button>
                <button id="confirm-finish" class="flex-1 py-2 bg-emerald-500 text-white rounded-lg text-sm font-bold hover:bg-emerald-600 transition-colors">Sí, Calificar</button>
            </div>
        </div>
    </div>

    <script>

        const casesData = [
{
                id: 1,
                caseText: "Primigesta de 22 años acude a urgencias por contracciones uterinas regulares y dolorosas. Embarazo de 39 semanas normoevolutivo. Signos vitales: TA 110/70 mmHg, FC 82 lpm, FR 18 rpm, Temp 36.5 °C. Exploración física: abdomen globoso, feto único vivo, presentación cefálica, frecuencia cardiaca fetal 145 lpm. Tacto vaginal: cérvix central, reblandecido, borramiento del 80%, dilatación de 6 cm, membranas íntegras. Pelvis ginecoide.",
                source: "GPC IMSS-052-19, Vigilancia y atención amigable en el trabajo de parto en embarazo de bajo riesgo.",
                questions: [
                    {
                        question: "Durante la valoración inicial en admisión hospitalaria de esta paciente, ¿cuál es el método de tamizaje de primera elección para establecer el bienestar fetal?",
                        options: [
                            "Registro cardiotocográfico continuo",
                            "Perfil biofísico por ultrasonido",
                            "Auscultación intermitente fetal",
                            "Prueba de tolerancia a la oxitocina"
                        ],
                        answer: 2,
                        justification: "La auscultación intermitente con Doppler o estetoscopio de Pinard es el estándar de oro para el tamizaje de ingreso en pacientes sanas, ya que certifica la vitalidad sin inducir sobrediagnósticos de estrés.<br><br><b>Perla ENARM:</b> Se recomienda auscultar la frecuencia cardiaca fetal, ya sea con Pinard o con monitor fetal Doppler, para establecer el bienestar fetal en el momento del ingreso de la mujer a sala de labor.<br><br><b>Análisis de Distractores:</b> El registro cardiotocográfico continuo (A) aumenta las tasas de cesárea sin mejorar resultados perinatales en embarazos de bajo riesgo. El perfil biofísico (B) y la prueba de tolerancia a la oxitocina (D) evalúan condiciones de alto riesgo, sin ser herramientas del triaje inicial."
                    },
                    {
                        question: "De acuerdo con los hallazgos de la exploración física, ¿cuál es el diagnóstico clínico preciso del estadio del trabajo de parto en el que se encuentra la paciente?",
                        options: [
                            "Fase activa del primer periodo",
                            "Fase latente del primer periodo",
                            "Segundo periodo del trabajo de parto",
                            "Falso trabajo de parto"
                        ],
                        answer: 0,
                        justification: "La paciente documenta contracciones rítmicas asociadas a una dilatación de 6 cm, rebasando el umbral estricto que marca la pauta para la hospitalización y vigilancia continua.<br><br><b>Perla ENARM:</b> La fase activa del trabajo de parto es un periodo de tiempo que se caracteriza por actividad uterina regular y dolorosa, asociado a modificaciones cervicales. Inicia a los 5 centímetros de dilatación y culmina con la dilatación cervical completa.<br><br><b>Análisis de Distractores:</b> La fase latente (B) cursa con dilataciones menores a 5 cm. El segundo periodo (C) corresponde a la dilatación y borramiento completos listos para el expulsivo. El falso trabajo de parto (D) presenta contracciones sin modificaciones cervicales mecánicas."
                    },
                    {
                        question: "Durante la vigilancia de esta paciente en sala de labor, ¿cuál es la indicación de primera línea respecto al manejo no farmacológico y soporte hídrico?",
                        options: [
                            "Ayuno absoluto estricto",
                            "Infusión de solución glucosada",
                            "Dieta blanda fraccionada",
                            "Ingesta de líquidos claros"
                        ],
                        answer: 3,
                        justification: "Prohibir el aporte hídrico genera cetoacidosis por agotamiento. Administrar líquidos claros garantiza energía miometrial basal sin incrementar la morbimortalidad ante la necesidad emergente de anestesia.<br><br><b>Perla ENARM:</b> En mujeres con trabajo de parto no complicado, se recomienda la ingesta de líquidos claros.<br><br><b>Análisis de Distractores:</b> El ayuno estricto (A) perpetúa el estrés metabólico materno. La canalización de solución glucosada rutinaria (B) incrementa la medicalización irracional. La dieta blanda (C) eleva el riesgo de broncoaspiración si requiere anestesia general."
                    },
                    {
                        question: "Una vez que ocurra el nacimiento, se inicia el manejo activo del tercer periodo para cumplir la meta de prevención de hemorragia. ¿Cuál es el fármaco de elección?",
                        options: [
                            "Ergometrina 0.2 mg",
                            "Oxitocina 10 UI",
                            "Carbetocina 100 mg",
                            "Misoprostol 600 mg"
                        ],
                        answer: 1,
                        justification: "Lograr una hipertonía miometrial profiláctica tras la expulsión del feto interrumpe las redes vasculares del lecho placentario, logrando la máxima protección contra la atonía uterina.<br><br><b>Perla ENARM:</b> Se recomienda administrar 10 UI de oxitocina, ya sea por vía intravenosa o intramuscular, como uterotónico de elección para el manejo activo del tercer periodo del trabajo de parto.<br><br><b>Análisis de Distractores:</b> La ergometrina (A), carbetocina (C) y el misoprostol (D) son agentes uterotónicos eficaces que conforman alternativas directas ante refractariedad, pero bajo normatividad no desplazan a la oxitocina como la primera indicación profiláctica."
                    },
                    {
                        question: "Tras el alumbramiento, ¿cuál intervención rutinaria debe evitarse estrictamente por ser el principal factor asociado al desarrollo de endometritis posparto?",
                        options: [
                            "Exploración vaginal seriada",
                            "Pinzamiento tardío del cordón",
                            "Revisión manual de cavidad uterina",
                            "Acompañamiento continuo materno"
                        ],
                        answer: 2,
                        justification: "Insertar la extremidad del clínico a través de la vagina introduce inóculos masivos de bacterias hacia la decidua altamente vascularizada, desencadenando cuadros sépticos puerperales severos.<br><br><b>Perla ENARM:</b> Evidencia de un estudio observacional retrospectivo muestra que los principales factores asociados a endometritis posparto fueron la revisión manual de cavidad uterina... No se aconseja realizar revisión manual de cavidad uterina rutinaria, pues puede predisponer a endometritis.<br><br><b>Análisis de Distractores:</b> La exploración vaginal (A) incrementa el riesgo de corioamnionitis intraparto. El pinzamiento tardío (B) y el acompañamiento continuo (D) no implican contaminación y son medidas exigidas por el modelo amigable."
                    }
                ]
            },

{
    id: 2,
    caseText: "Hombre de 22 años acude a urgencias por presentar dolor abdominal agudo de 12 horas de evolución. Refiere que inició de forma cólica en región periumbilical y hace 4 horas migró a cuadrante inferior derecho, acompañándose de náusea en 2 ocasiones y pico febril no cuantificado. Exploración física: TA 110/70 mmHg, FC 98 lpm, FR 20 rpm, Temp 38.2°C. Abdomen plano, peristalsis disminuida. Presenta marcada hiperestesia y resistencia muscular involuntaria. A la palpación profunda destacan signos positivos de McBurney, Rovsing y rebote evidente en la fosa iliaca derecha.",
    source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda.",
    questions: [
        {
            question: "De acuerdo con la guía de práctica clínica, ¿cuáles son las manifestaciones cardinales que presentan mayor sensibilidad para establecer el diagnóstico de sospecha en este paciente?",
            options: [
                "Dolor cólico, anorexia persistente y elevación de la proteína C reactiva.",
                "Fiebre mayor a 38 grados centígrados, vómito gastrobiliar y resistencia muscular.",
                "Dolor característico, manifestaciones de irritación peritoneal y datos de respuesta inflamatoria.",
                "Dolor periumbilical, hiperestesia abdominal y signos vitales inestables."
            ],
            answer: 2,
            justification: "Fisiopatológicamente, la obstrucción del lumen apendicular desencadena isquemia y proliferación bacteriana, lo que se traduce en un patrón secuencial de síntomas viscerales y somáticos altamente reproducibles. Identificar la triada sindromática evita la dependencia innecesaria a pruebas de gabinete iniciales.<br><br><b>Perla ENARM:</b> De las manifestaciones clínicas y de laboratorio, las que tienen mayor sensibilidad para el diagnóstico de apendicitis (manifestaciones cardinales) son: 1. Dolor característico (migración de la región periumbilical al cuadrante inferior derecho o localización inicial en cuadrante inferior derecho), 2. Manifestaciones de irritación peritoneal (hipersensibilidad, rebote positivo, defensa y rigidez de músculos abdominales), 3. Datos de respuesta inflamatoria (leucocitosis con mayor predominio de neutrófilos).<br><br><b>Análisis de Distractores:</b> Las demás opciones agrupan síntomas o signos que, si bien pueden estar presentes durante la cascada inflamatoria apendicular, no conforman los pilares de alta sensibilidad dictados por la normatividad. La anorexia y fiebre son muy inespecíficas, y la inestabilidad de signos vitales habla de peritonitis generalizada o choque séptico, no de hallazgos cardinales tempranos para el diagnóstico primario."
        },
        {
            question: "Ante el cuadro clínico clásico de este paciente, ¿cuál es la conducta diagnóstica de primera elección a seguir en el primer nivel de atención?",
            options: [
                "Solicitar ultrasonido abdominal en la unidad médica.",
                "Realizar biometría hemática y examen general de orina urgentes.",
                "Solicitar tomografía axial computarizada helicoidal simple.",
                "Derivar a cirugía general inmediatamente sin solicitar exámenes."
            ],
            answer: 3,
            justification: "El diagnóstico de apendicitis es fundamentalmente clínico. En un adulto joven masculino con semiología típica, la probabilidad preprueba es tan alta que los estudios complementarios solo retrasan el tratamiento quirúrgico definitivo y aumentan el riesgo de perforación y sepsis intraabdominal.<br><br><b>Perla ENARM:</b> Todo paciente con cuadro clínico clásico (dolor abdominal agudo, cólico, localizado en región periumbilical, con incremento rápido de intensidad antes de 24 horas, irradiado a cuadrante inferior derecho, con o sin náusea, vómito, fiebre de 38 C o más, hipersensibilidad en cuadrante inferior derecho, defensa y rigidez muscular involuntaria, McBurney), independientemente de su sexo, edad o si existe gestación debe ser referido de medicina familiar a urgencias para valoración por cirugía general en forma inmediata (no es necesario solicitar exámenes de laboratorio ni de gabinete).<br><br><b>Análisis de Distractores:</b> Solicitar estudios de imagen (ultrasonido o tomografía) o biomarcadores en sangre y orina está estrictamente reservado para casos dudosos (presentación de solo 1 de las 2 primeras manifestaciones cardinales). Su indicación rutinaria en presentaciones obvias constituye mala práctica por el retraso evitable en el tratamiento resolutivo."
        },
        {
            question: "Si este caso fuera evaluado por un médico de primer ingreso, ¿qué escala clínica recomienda la literatura para mejorar la exactitud diagnóstica en profesionales inexpertos?",
            options: [
                "Escala de Alvarado.",
                "Escala de Ranson.",
                "Escala de APACHE.",
                "Escala de Child-Pugh."
            ],
            answer: 0,
            justification: "Existen herramientas estructuradas de apoyo para discriminar la probabilidad clínica de inflamación apendicular, estandarizando los hallazgos interrogados y explorados. Estas escalas minimizan el margen de error dependiente del examinador.<br><br><b>Perla ENARM:</b> De las escalas clínicas para diagnóstico de apendicitis las más conocidas son: la de Alvarado, Solís-Mena, Teicher, Ramírez y Lilndberg. Aunque los resultados de la utilización de estos instrumentos son variados parecen tener mayor utilidad para los profesionales jóvenes inexpertos en esta área ya que mejoran su exactitud diagnóstica de 58 a 71%.<br><br><b>Análisis de Distractores:</b> La escala de Ranson es pronóstica para pancreatitis aguda. La puntuación APACHE predice mortalidad en unidades de cuidados intensivos, y la escala de Child-Pugh se emplea en la estadificación clínica de la cirrosis hepática. Ninguna tiene utilidad diagnóstica en síndrome doloroso en fosa iliaca derecha."
        },
        {
            question: "En caso de que la intervención quirúrgica de este paciente se retrasara por falta de infraestructura, ¿en qué lapso de tiempo es estadísticamente más frecuente que ocurra la perforación apendicular?",
            options: [
                "En las primeras 12 a 24 horas del inicio del dolor.",
                "Entre las 24 y 72 horas del inicio del dolor.",
                "Entre las 72 y 96 horas del inicio de la respuesta inflamatoria.",
                "Después de 120 horas de evolución clínica ininterrumpida."
            ],
            answer: 1,
            justification: "El aumento sostenido de la presión intraluminal debido al moco, sumado a la nula distensibilidad de la serosa, compromete el flujo venoso y luego el arterial, llevando inexorablemente a isquemia transmural, gangrena y perforación parietal en una ventana de tiempo predecible.<br><br><b>Perla ENARM:</b> La perforación del apéndice es mas frecuente entre las 24 y 72 horas de iniciado el dolor en adultos jóvenes y mujeres no embarazadas en edad reproductiva.<br><br><b>Análisis de Distractores:</b> Antes de las 24 horas predominan las fases edematosa y supurativa, con perforación muy infrecuente en adultos jóvenes. Después de 72 horas, la patología ya evolucionó a perforación libre franca o a la contención focal por epiplón y asas intestinales adyacentes (plastrón periapendicular)."
        },
        {
            question: "Si el cuadro de este varón fuera atípico y procediera a solicitarse un análisis urinario para abordaje diferencial, ¿qué sedimento indicaría fuertemente patología urológica y no inflamación por vecindad?",
            options: [
                "Recuento microscópico de 5 a 10 eritrocitos o trazas de albúmina.",
                "Hallazgo aislado de piuria estéril en orina de chorro medio.",
                "Conteo mayor a 20 leucocitos o mayor a 30 eritrocitos por campo.",
                "Presencia de cristales hialinos granulosos de forma abundante."

        {

        {

        },
        {
            question: "Dado el compromiso hemodinámico actual, ¿qué estudios paraclínicos son obligatorios para monitorizar complicaciones agudas inminentes?",
            options: [

                        {

                    {

                            "Resonancia magnética",
                            "Tomosíntesis de mama"
                        ],

                        justification: "En mujeres menores de 30 años y en pacientes gestantes, el tejido glandular es sumamente denso debido al estímulo hormonal, lo que disminuye la sensibilidad de la mastografía. El ultrasonido permite diferenciar con precisión entre lesiones sólidas y quísticas sin radiación.<br><br><b>Perla ENARM:</b> El ultrasonido es un método de imagen efectivo, bien establecido que utiliza transductores de alta frecuencia para la valoración sonográfica. Indicaciones: [...] Estudio inicial en la evaluación de anormalidades clínicas en mujeres menores de 30 años de edad, así como las que están lactando o embarazadas.<br><br><b>Análisis de Distractores:</b> La mastografía diagnóstica (B) es el estudio inicial exclusivo para mujeres sintomáticas mayores de 40 años. La resonancia magnética (C) se reserva como tamizaje en pacientes de muy alto riesgo genético. La tomosíntesis (D) es un estudio avanzado complementario."

                    {
                        question: "Como parte del manejo preventivo primario integral aplicable a esta paciente, ¿qué intervención en el estilo de vida tiene nivel de evidencia comprobado para reducir el riesgo de desarrollar esta neoplasia?",

                    {
                        question: "Si el reporte de imagen definitivo clasificara la lesión de la paciente como categoría BI-RADS 4, ¿cuál es la conducta clínica definitiva indicada por la normativa?",

                    },
                    {
                        question: "En caso de que, durante su seguimiento gestacional, la masa presentara características físicas altamente sugestivas de malignidad, ¿cuál es la indicación respecto al uso de la mastografía?",

{
    id: 43,
    caseText: "Hombre de 32 años ingresa a sala de choque por herida de proyectil de arma de fuego en región periumbilical. Se encuentra estuporoso, pálido y con diaforesis profusa. Signos vitales: TA 75/40 mmHg, FC 130 lpm, FR 26 rpm, Temp 33.5 °C. A la exploración física destaca abdomen en madera, doloroso a la palpación superficial, sin orificio de salida. Se indica traslado inmediato a quirófano para laparotomía exploradora. Durante la intervención, el cirujano reporta incapacidad técnica para lograr la hemostasia efectiva en la vasculatura retroperitoneal, sangrado difuso en capa y edema intestinal masivo. La gasometría arterial transoperatoria reporta pH 7.18, bicarbonato sérico de 13 mEq/L y lactato sérico de 3.2 mEq/L.",
    source: "GPC-SEDENA-445-18, Indicadores e institución de la cirugía de control de daños en pacientes con herida por proyectil de arma de fuego en abdomen.",
    questions: [
        {
            question: "Previo a su ingreso a quirófano, ¿cuál de las siguientes situaciones constituye un indicador objetivo técnico preoperatorio para instituir obligatoriamente la cirugía de control de daños en este paciente?",
            options: [
                "Plan preoperatorio de toracotomía",
                "Escala de coma de Glasgow de 8 puntos",
                "Sospecha clínica de perforación gástrica",
                "Necesidad de nutrición parenteral total"
            ],
            answer: 0,
            justification: "La necesidad de intervenir múltiples cavidades mayores simultáneamente agota rápidamente la reserva fisiológica del paciente politraumatizado. La directriz establece que el abordaje simultáneo del tórax es un criterio estricto para no prolongar el tiempo quirúrgico abdominal y optar por un empaquetamiento rápido.<br><br><b>Perla ENARM:</b> Los indicadores objetivos técnicos preoperatorios para instituir la CCD son: Arribo masivo de víctimas, Diagnóstico preoperatorio de lesión abdominal mayor por PAF con trauma multisistémico asociado... Plan preoperatorio de toracotomía.<br><br><b>Análisis de Distractores:</b> Un puntaje bajo en la escala de coma de Glasgow amerita intubación temprana pero no es un indicador técnico per se para el abordaje abdominal abreviado. La sospecha de perforación gástrica requiere reparación primaria, no necesariamente control de daños. La nutrición parenteral es un manejo posoperatorio de soporte, no un gatillo de decisión transoperatoria aguda."
        },
        {
            question: "Según los hallazgos transoperatorios descritos, el paciente cumple indicadores fisiológicos de agotamiento metabólico. ¿Qué parámetro gasométrico específico confirma esta indicación según la guía de práctica clínica?",
            options: [
                "Lactato sérico mayor a 1.5 mEq/L",
                "Bicarbonato sérico menor a 15 mEq/L",
                "Déficit de base menor a -5.0 mEq/L",
                "Presión parcial de oxígeno menor a 60 mmHg"
            ],
            answer: 1,
            justification: "La acidosis metabólica profunda es un pilar de la \"tríada de la muerte\". La guía establece valores de corte estrictos para evitar el subjetivismo del cirujano al momento de abortar la cirugía reconstructiva; un nivel bajo de bicarbonato refleja deuda de oxígeno severa y metabolismo anaerobio.<br><br><b>Perla ENARM:</b> Aparición de acidosis significativa, definida como bicarbonato sérico <15 mEq/l o pH <7.2.<br><br><b>Análisis de Distractores:</b> El lactato sérico es un indicador válido, pero el punto de corte normado es >2.5 mEq/L, no >1.5 mEq/L. El déficit de base también es un criterio transoperatorio, pero su valor definitorio es <-7.5 mEq/L. La hipoxemia (presión parcial de oxígeno menor a 60 mmHg) no forma parte de los indicadores metabólicos directos para instituir la cirugía de control de daños abdominal."
        },
        {
            question: "Ante la inestabilidad refractaria y el edema intestinal severo, se decide interrumpir la reconstrucción. ¿Cuál es el recurso técnico de primera línea preferible para efectuar el cierre temporal del abdomen en un hospital de tercer nivel?",
            options: [
                "Afrontamiento continuo con pinzas de campo",
                "Bolsa plástica protésica de Bogotá",
                "Dispositivos comerciales de terapia de presión negativa",
                "Cierre cutáneo y fascial primario a tensión"
            ],
            answer: 2,
            justification: "El aislamiento del contenido abdominal mediante vacío controlado es el estándar de oro actual, ya que cuantifica el tercer espacio, reduce la retracción de los bordes aponeuróticos y minimiza la tasa de evisceración frente a métodos pasivos.<br><br><b>Perla ENARM:</b> Para el CTA, es preferible emplear dispositivos comerciales de sistema de TPNH, y si es posible con sistema adjunto de instilación.<br><br><b>Análisis de Distractores:</b> La bolsa de Bogotá es una alternativa correcta pero se relega a hospitales con pocos recursos o ambientes austeros. El afrontamiento con pinzas de campo es una medida de rescate transitoria subóptima. El cierre fascial primario a tensión está absolutamente contraindicado ante la presencia de edema intestinal, ya que precipitará un síndrome compartimental abdominal fatal."
        },
        {
            question: "Tras estabilizar al paciente en la unidad de cuidados intensivos y lograr la normalización de la oxidinamia y coagulación, ¿en qué intervalo de tiempo debe efectuarse la intervención quirúrgica planeada para su reconstrucción?",
            options: [
                "Antes de las primeras 12 horas",

                "Al momento del egreso de la terapia intensiva",
                "De 24 a 96 horas después de la laparotomía inicial"
            ],
            answer: 3,
            justification: "El periodo de reanimación metabólica secuencial en cuidados intensivos requiere tiempo suficiente para que los cristaloides y hemoderivados restauren el microambiente celular (habitualmente más de 24 horas), pero no debe excederse para evitar la colonización bacteriana severa y el \"abdomen congelado\".<br><br><b>Perla ENARM:</b> La intervención planeada debe efectuarse 24 a 96 horas después de la laparotomía inicial en el paciente con trauma abdominal por PAF bajo CCD.<br><br><b>Análisis de Distractores:</b> Intervenir antes de 12 horas suele fracasar por coagulopatía residual (excepto en jóvenes con respuesta ultra rápida a las 4 a 6 horas). Diferir el procedimiento de 7 a 14 días asegura la formación de adherencias firmes que imposibilitan la exploración. Esperar al egreso de cuidados intensivos es inviable en un paciente que se mantiene con el abdomen abierto."
        },
        {
            question: "Si durante la evolución posoperatoria el paciente desarrolla peritonitis grave y una fístula enteroatmosférica que imposibilitan la clausura de la pared, ¿cuál es la conducta quirúrgica definitiva a largo plazo?",
            options: [
                "Planear el desarrollo de una hernia ventral y cerrar 6 a 12 meses después",
                "Interponer una malla sintética de polipropileno de forma inmediata",
                "Efectuar cierre cutáneo primario dejando la fascia muscular abierta",

            justification: "Cuando el abdomen resulta hostil por sepsis grave o fístulas, los intentos precoces de cierre anatómico condicionan perforaciones iatrogénicas o recurrencias infecciosas. La estrategia más segura es guiar la cicatrización por segunda intención, cubriendo el defecto con piel, para restituir la anatomía muscular de forma electiva meses más tarde.<br><br><b>Perla ENARM:</b> En pacientes con contaminación grave o persistente de la cavidad, portadores de fístula enteroatmosférica... debe planearse el desarrollo de una HVP y llevar a cabo el CDA 6 a 12 meses después de haberse resuelto la condición aguda.<br><br><b>Análisis de Distractores:</b> Las mallas sintéticas (polipropileno) están formalmente contraindicadas en presencia de contaminación bacteriana activa. El cierre cutáneo sobre una fístula activa generará un absceso cerrado. La separación de componentes es una técnica útil para cierre primario en defectos limpios menores a 20 cm, pero es inútil e insegura frente a una infección profunda instaurada."

{
                id: 44,
                caseText: "Hombre de 62 años con diabetes tipo 2 de 15 años de evolución, acude por presentar úlcera plantar en el pie derecho de 10 días de evolución. Signos vitales: TA 130/80 mmHg, FC 88 lpm, FR 16 rpm, Temp 37.8 °C. A la exploración física: presencia de hiperqueratosis periférica plantar. Se observa úlcera en la cabeza del primer metatarsiano que penetra directamente hasta el hueso, con exudado purulento moderado y eritema perilesional. Los pulsos pedio y tibial posterior son palpables y simétricos. Sensibilidad táctil severamente disminuida. Resto de la extremidad sin datos clínicos sugestivos de isquemia tisular.",

                questions: [

                            "Diapasón de 128 Hertz",
                            "Pletismografía de volumen segmentario",

                    {
                        question: "De acuerdo con la clasificación pronóstica validada por la guía clínica, ¿en qué grado y estadio de la Universidad de Texas se clasifica la herida actual?",
                        options: [
                            "Grado 2 y Estadio B",
                            "Grado 3 y Estadio B",
                            "Grado 3 y Estadio C",
                            "Grado 2 y Estadio D"
                        ],
                        answer: 1,
                        justification: "La clasificación de Texas evalúa la profundidad de la herida mediante Grados (0 a 3) y la etiología o complicación mediante Estadios (A a D). Una herida que penetra hasta el hueso es automáticamente Grado 3, y la presencia de secreción purulenta con eritema determina una herida infectada, correspondiendo al Estadio B. Al palpar pulsos de forma normal, se descarta el estadio C (isquemia) o D (infección más isquemia).<br><br><b>Perla ENARM:</b> Clasificación pie diabético de la Universidad de Texas. Grado 3: Herida penetrante a hueso o articulación. Estadio B: Infección.<br><br><b>Análisis de Distractores:</b> Un Grado 2 (A y D) representaría una herida penetrante solo a tendón o cápsula, lo cual subestima la lesión descrita que llega al hueso. Los Estadios C y D (C) incluirían compromiso isquémico severo, el cual está ausente en este paciente por presentar pulsos pedios y tibiales normales."
                    },
                    {
                        question: "Considerando la profundidad e infección de la herida, ¿cuál es la intervención de primera línea indicada de forma inmediata para limitar la progresión del daño tisular?",
                        options: [
                            "Desbridamiento quirúrgico",
                            "Oxigenoterapia hiperbárica",
                            "Aplicación de apósitos hidrocoloides",
                            "Cierre con injerto cutáneo"
                        ],

{

    source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis.",

        {

            justification: "La litiasis biliar y la colecistitis aguda tienen factores de riesgo bien definidos, entre los cuales destacan la edad mayor de 40 años, sexo femenino, obesidad, embarazo y pérdida rápida de peso. Farmacológicamente, el uso de terapia hormonal sustitutiva con estrógenos, fibratos y ceftriaxona favorecen el desarrollo de litos y lodo biliar por alteración en la composición o estasis de la bilis.<br><br><b>Perla ENARM:</b> Anticonceptivos orales y terapia hormonal sustitutiva con estrógenos, en este caso con mayor riesgo en mujeres menores de 40 años y las que reciben una dosis mayor de 50 microgramos de estrógenos. Otros fármacos como los fibratos y la ceftriaxona.<br><br><b>Análisis de Distractores:</b> El omeprazol, metformina y paracetamol no intervienen en la alteración de la saturación del colesterol biliar ni causan precipitación de barro biliar, por lo tanto, no se describen como factores de riesgo litogénico en las guías de práctica clínica de esta enfermedad. La ceftriaxona es conocida por causar pseudolitiasis biliar debido a su precipitación con calcio en la vesícula."

        {

            justification: "El ultrasonido abdominal es la prueba no invasiva de primera elección ante la sospecha de colecistitis o colelitiasis, con una sensibilidad del 98%. Los datos inflamatorios directos incluyen el engrosamiento de la pared vesicular, la presencia de líquido perivesicular y el signo de Murphy ultrasonográfico positivo.<br><br><b>Perla ENARM:</b> Los hallazgos que reporta el ultrasonido ante la presencia de Colecistitis y/o Colelitiasis son: Engrosamiento de la pared vesicular mayor de 5 mm.<br><br><b>Análisis de Distractores:</b> El diámetro axial normal o sugerente de inflamación es el alargamiento vesicular de 8 cm axial y 4 cm diametral (no 5 cm). La ausencia de líquido perivesicular o el adelgazamiento de la pared son hallazgos de una vesícula sana o no inflamada, lo cual contradice el cuadro de colecistitis aguda."

        {

            answer: 2,
            justification: "En pacientes con cólico biliar agudo, la administración de antinflamatorios no esteroideos (AINEs) previene la progresión hacia colecistitis aguda al inhibir la síntesis de prostaglandinas, las cuales median la inflamación y la contracción vesicular.<br><br><b>Perla ENARM:</b> En presencia de cólicos biliares y para evitar el progreso de la colecistitis aguda se recomienda una dosis de 75 mg de diclofenaco (intra-múscular).<br><br><b>Análisis de Distractores:</b> La meperidina es el narcótico de elección, pero se reserva únicamente para el manejo del dolor intenso, no para evitar la progresión de la enfermedad. La butilhioscina y el tramadol no cuentan con la evidencia recomendada en la guía de práctica clínica como primera línea para detener la fisiopatología inflamatoria del cólico biliar."

        {

            answer: 3,
            justification: "La colecistectomía laparoscópica es el estándar de oro (Grado I de Tokyo). Realizarla de forma temprana asegura una recuperación rápida, menor estancia hospitalaria y reduce los costos del tratamiento.<br><br><b>Perla ENARM:</b> La Colecistectomía laparoscópica temprana es el tratamiento de elección en la mayoría de pacientes. Se considera temprana cuando se realiza de 1 a 7 días después del ataque inicial.<br><br><b>Análisis de Distractores:</b> La colecistectomía abierta es una alternativa únicamente si la vía laparoscópica es técnicamente difícil o si el cirujano carece de experiencia. La colecistostomía percutánea se reserva para pacientes con inflamación moderada-grave (Grado II-III) no aptos para cirugía inmediata. La litotricia extracorpórea se limita a pacientes con alto riesgo quirúrgico, lito único no calcificado de 20 a 30 mm y vía biliar permeable."
        },
        {
            question: "Según los criterios de Tokio, ¿cuál de los siguientes hallazgos reclasificaría a esta paciente a un grado III (grave) de colecistitis aguda?",
            options: [
                "Hipotensión que requiere tratamiento con dopamina",

            justification: "El grado III de Tokio se define estrictamente por la presencia de disfunción orgánica múltiple o choque. La hipotensión refractaria que amerita aminas vasoactivas documenta disfunción cardiovascular, indicando un manejo urgente del daño orgánico antes de pensar en una intervención quirúrgica directa.<br><br><b>Perla ENARM:</b> Colecistitis aguda acompañada por disfunción de cualquiera de los siguientes órganos/sistemas: Disfunción cardiovascular (hipotensión que requiere tratamiento con dopamina > 5 ug/kg/min. o cualquier dosis de dobutamina).<br><br><b>Análisis de Distractores:</b> La duración mayor de 72 horas, la masa palpable en el cuadrante superior derecho y la presencia de absceso perivesicular son todos criterios exactos que definen una colecistitis aguda grado II (moderada), la cual involucra inflamación local severa pero sin llegar a la falla de órganos diana."

{
                id: 53,

                source: "IMSS-058-08, Detección, Diagnóstico y Tratamiento de las Enfermedades Hipertensivas del Embarazo.",

                    {

{

        {

                    <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-2">Avance Global del Examen</p>
                    <p class="text-4xl sm:text-5xl font-black text-white">${ans}<span class="text-xl sm:text-2xl text-slate-500">/${totalQuestions}</span></p>
                    <div class="w-full bg-slate-700/50 rounded-full h-2 mt-4 overflow-hidden">
                        <div class="bg-blue-400 h-2 rounded-full shadow-md transition-all duration-300" style="width: ${(ans/totalQuestions)*100}%"></div>
                    </div>
                </div>
            `;

            let legendHTML = examState.isFinished ? `
                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
            ` : `
                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-50 border border-slate-200 dark:bg-slate-800/50 dark:border-slate-700/50"></div> Pendiente</div>
                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-600 border border-slate-700"></div> Respondida</div>
            `;

            displayArea.innerHTML = `
                <div class="flex flex-col gap-6 max-w-7xl mx-auto lg:mt-0">
                    <div class="flex justify-center sm:justify-start items-center mb-1 mt-4 lg:mt-0">
                        <span class="inline-flex items-center gap-2 text-slate-400 font-semibold text-sm select-none">
                            
                        </span>
                    </div>

                    <div class="relative bg-slate-900 dark:bg-slate-950 rounded-[2rem] p-8 md:p-12 shadow-xl text-white overflow-hidden border border-slate-800 transition-colors duration-500">
                        <div class="relative z-10 flex flex-col lg:flex-row justify-between items-center gap-8">
                            <div class="text-center lg:text-left w-full lg:w-3/5">
                                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4 border ${badgeClass}">
                                    ${badgeText}
                                </span>
                                <h1 class="text-3xl md:text-4xl lg:text-4xl font-extrabold tracking-tight mb-3 ${examState.isFinished ? 'text-emerald-400' : ''}">${titleText}</h1>
                                <p class="text-slate-300 text-base md:text-lg font-medium mx-auto lg:mx-0">${descText}</p>
                                <div class="mt-8 flex justify-center lg:justify-start flex-wrap gap-4">
                                    ${actionBtn}
                                </div>
                            </div>
                            
                            <div class="flex-shrink-0 bg-slate-800/50 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 flex flex-col items-center shadow-2xl w-full lg:w-2/5">
                                ${statsHTML}
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-slate-800 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                Tablero del Examen (280 Preguntas)
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                ${legendHTML}
                            </div>
                        </div>
                        <div class="grid gap-2 grid-cols-[repeat(auto-fill,minmax(40px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>
                </div>
            `;
        }

        function displayQuestion(globalId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = globalId ? parseInt(globalId) : null;
                
                if (currentQuestionId) {
                    localStorage.setItem('simuladorEL4LastQId', currentQuestionId);
                } else {
                    localStorage.removeItem('simuladorEL4LastQId');
                }

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                if (window.innerWidth >= 1024) {
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');
                    dashboardBtn.classList.add('lg:left-[22rem]');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const caseIdx = Math.floor((currentQuestionId - 1) / QUESTIONS_PER_CASE);
                const cData = casesData[caseIdx];
                
                if (!cData) return displayQuestion(null);
                
                renderCaseLayout(cData, currentQuestionId);
                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                setTimeout(() => {
                    const targetCard = document.getElementById(`q-card-${currentQuestionId}`);
                    if (targetCard) {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    }
                }, 50);

            }, 150); 
        }

        function renderCaseLayout(cData, activeGlobalId) {
            let html = `
                <div class="flex flex-col gap-6 max-w-5xl mx-auto items-center">
                    
                    <!-- COLUMNA: TEXTO DEL CASO CLÍNICO -->
                    <div class="w-full bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-md border border-slate-200 dark:border-slate-800 transition-all duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-block bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-900/30">
                                Caso Clínico Seriado
                            </span>
                            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                                Bloque #${cData.id}
                            </span>
                        </div>
                        <p class="text-slate-800 dark:text-slate-200 text-sm sm:text-base leading-relaxed font-medium">
                            ${cData.caseText}
                        </p>
                        ${examState.isFinished ? `
                            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                <span class="text-slate-500">Bibliografía:</span> ${cData.source}
                            </div>
                        ` : ''}
                    </div>

                    <!-- COLUMNA: BLOQUE DE LAS 5 PREGUNTAS ASOCIADAS -->
                    <div class="w-full space-y-5">
            `;

            cData.questions.forEach((q, idx) => {
                const globalQId = (cData.id - 1) * QUESTIONS_PER_CASE + idx + 1;
                const qState = userProgress[globalQId];
                const hasAnswered = qState && qState.answered;
                const userAnswer = hasAnswered ? qState.selectedOption : null;
                
                let cardStyle = "border-slate-200 dark:border-slate-800/80";
                if (globalQId === activeGlobalId) {
                    cardStyle = "border-blue-500 dark:border-blue-500 ring-2 ring-blue-500/10";
                }
                if (examState.isFinished && hasAnswered) {
                    cardStyle = (userAnswer === q.answer) ? "border-l-4 border-emerald-500" : "border-l-4 border-rose-500";
                }

                html += `
                    <div id="q-card-${globalQId}" class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-2xl shadow-sm border ${cardStyle} transition-all">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[9px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">
                                PREGUNTA ${globalQId}
                            </span>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 mb-4 leading-snug">${q.question}</h3>
                        <form id="q-form-${globalQId}" class="space-y-2.5">
                `;

                q.options.forEach((opt, i) => {
                    if (examState.isFinished) {
                        let optClasses = "flex items-start p-3 border rounded-xl text-xs sm:text-sm ";
                        let icon = "";
                        
                        if (i === q.answer) {
                            optClasses += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 font-semibold";
                            icon = `<svg class="w-4 h-4 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                        } else if (i === userAnswer) {
                            optClasses += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                            icon = `<svg class="w-4 h-4 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                        } else {
                            optClasses += "bg-slate-50 border-slate-100 dark:bg-slate-800/30 dark:border-slate-800/50 opacity-50 text-slate-400";
                        }

                        html += `
                            <div class="${optClasses}">
                                <span class="leading-snug pr-3">${opt}</span>
                                ${icon}
                            </div>
                        `;
                    } else {
                        const checkedStr = (hasAnswered && userAnswer === i) ? 'checked' : '';
                        html += `
                            <label class="flex items-start p-3 border border-slate-200 dark:border-slate-800 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/40 has-[:checked]:bg-blue-50/80 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/20 text-xs sm:text-sm shadow-sm" onclick="autoSaveAnswer(${globalQId})">
                                <input type="radio" name="option" value="${i}" ${checkedStr} class="mt-0.5 h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-700 cursor-pointer">
                                <span class="ml-2.5 text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `;
                    }
                });

                html += `</form>`;

                if (examState.isFinished) {
                    html += `
                        <div class="bg-blue-50/60 dark:bg-slate-800/50 border border-blue-100/50 dark:border-slate-800 rounded-xl p-4 text-xs sm:text-sm mt-4">
                            <h4 class="font-bold text-blue-800 dark:text-blue-400 mb-1 flex items-center gap-1 uppercase tracking-wider text-[10px]">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Justificación Médica
                            </h4>
                            <p class="text-slate-600 dark:text-slate-300 leading-relaxed">${q.justification}</p>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            const isLastCase = cData.id === casesData.length;

            html += `
                        <!-- CONTROLES DE FLUJO EN CASOS -->
                        <div class="flex justify-between items-center pt-4 mt-6 border-t border-slate-200 dark:border-slate-800">
                            <button onclick="navigateCase(${cData.id}, 'prev')" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                                Caso Anterior
                            </button>
                            
                            ${examState.isFinished ? `
                                ${!isLastCase ? `
                                    <button onclick="navigateCase(${cData.id}, 'next')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
                                        Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                    </button>
                                ` : `
                                    <button onclick="displayQuestion(null)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider shadow-sm">
                                        Ver Calificaciones
                                    </button>
                                `}
                            ` : `
                                <button onclick="navigateCase(${cData.id}, 'next')" class="bg-blue-600 dark:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-md hover:bg-blue-700 dark:hover:bg-blue-400 transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5">
                                    Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('module-display').innerHTML = html;
        }

        function autoSaveAnswer(globalId) {
            if(examState.isFinished) return;
            const form = document.getElementById(`q-form-${globalId}`);
            if (!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (selected) {
                userProgress[globalId] = { answered: true, selectedOption: parseInt(selected.value) };
                saveState();
                updateProgressBar();
                renderSidebarGrid();
            }
        }

        function updateProgressBar() {
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = totalQuestions > 0 ? Math.round((ans / totalQuestions) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; 
            }
        }

        function saveState() {
            try { localStorage.setItem('simuladorEL4Progress', JSON.stringify(userProgress)); } catch(e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('simuladorEL4Progress');
                userProgress = saved ? JSON.parse(saved) : {};
                const savedState = localStorage.getItem('simuladorEL4ExamState');
                if (savedState) examState = JSON.parse(savedState);
            } catch(e) { userProgress = {}; examState = { isFinished: false }; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    const firebaseConfig = {apiKey: "AIzaSyB26PT8kuB-0fxyUYgGk51yC1rAsW0dYj0", authDomain: "enarm-lite.firebaseapp.com", projectId: "enarm-lite", storageBucket: "enarm-lite.firebasestorage.app", messagingSenderId: "767032952477", appId: "1:767032952477:web:84347320ed3d376f7e7674", measurementId: "G-PVR3RBVNSV"};
