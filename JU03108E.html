    <script>
        const questionsData = [
    {
        id: 1,
        question: "En Apendicitis Aguda, ¿cuál es el factor fisiopatológico inicial que desencadena el incremento de la presión intraluminal?",
        options: ["Acumulación de moco y escasa elasticidad serosa", "Hiperplasia linfoide difusa y edema submucoso", "Obstrucción por fecalito y estasis venosa", "Proliferación bacteriana y exudado purulento"],
        answer: 0,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, el evento patogénico cardinal es la obstrucción de la luz apendicular, que impide el drenaje normal de las secreciones, elevando rápidamente la presión interna debido a las características anatómicas de la pared apendicular.<br><br>Perla Quirúrgica: Apendicitis aguda.- es la inflamación del apéndice cecal o vermiforme, que inicia con obstrucción de la luz apendicular, lo que trae como consecuencia un incremento de la presión intraluminal por el acumulo de moco asociado con poca elasticidad de la serosa.<br><br>Análisis de Distractores: Las otras opciones son fases subsecuentes en la fisiopatología como la isquemia o proliferación, o etiologías mecánicas como el fecalito (C), pero la interacción exacta que causa el incremento inicial de presión es la acumulación mucosa contra una serosa inextensible.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Aspectos Generales, Página 10."
    },
    {
        id: 2,
        question: "¿Cuál es la prevalencia estimada de Apendicitis Aguda que obliga a mantener un alto índice de sospecha durante el embarazo?",
        options: ["1 por cada 500 embarazos", "1 por cada 1,500 embarazos", "1 por cada 5,000 embarazos", "1 por cada 10,000 embarazos"],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, esta entidad representa la emergencia quirúrgica no obstétrica de mayor frecuencia durante el periodo gestacional, alcanzando su pico de incidencia durante el segundo trimestre.<br><br>Perla Quirúrgica: La apendicitis aguda es el padecimiento quirúrgico no obstétrico, más común durante el embarazo. Se estima en 1 por cada 1500 embarazos, aunque hay reportes que refieren hasta 1 por cada 6,600 lo que representa 0.05% a 0.07%.<br><br>Análisis de Distractores: Las cifras de 1:500 (A) o 1:10,000 (D) escapan por completo al margen epidemiológico validado por la guía (1:1,500 a 1:6,600). Conocer la incidencia real evita infraestimar el diagnóstico diferencial en urgencias obstétricas.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Diagnóstico Clínico durante el Embarazo, Página 23."
    },
    {
        id: 3,
        question: "En el cuadro clínico clásico de Apendicitis Aguda, ¿en qué margen de tiempo máximo se espera que ocurra la migración del dolor periumbilical hacia el cuadrante inferior derecho?",
        options: ["Antes de 12 horas", "Antes de 24 horas", "Antes de 48 horas", "Antes de 72 horas"],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, la secuencia de somatización del estímulo visceral mediado por las fibras aferentes hacia la irritación peritoneal parietal directa tiene una progresión cronológica altamente reproducible.<br><br>Perla Quirúrgica: El cuadro clínico clásico de apendicitis inicia con dolor abdominal agudo, tipo cólico, localizado en región periumbilical, con incremento rápido de intensidad, antes de 24 horas migra a cuadrante inferior derecho (CID).<br><br>Análisis de Distractores: Tiempos más prolongados como mayores a 48 o 72 horas (C, D) corresponden estadísticamente al margen donde predomina el riesgo de perforación franca, no a la ventana temprana de migración somática característica del dolor.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Diagnóstico Clínico en el Adulto Joven, Página 13."
    },
    {
        id: 4,
        question: "En casos de duda diagnóstica severa de Apendicitis Aguda, ¿cuál es el estudio de imagen catalogado formalmente como el patrón de oro?",
        options: ["Tomografía axial computarizada", "Resonancia magnética nuclear", "Ultrasonografía abdominal", "Radiografía simple de abdomen"],
        answer: 0,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, cuando la probabilidad preprueba es intermedia, el escáner helicoidal otorga la más alta sensibilidad anatómica para visualizar inflamación apendicular, abscesos y plastrones pericecales.<br><br>Perla Quirúrgica: La tomografía axial computarizada (TAC) es considerada el patrón de oro en los casos de duda diagnóstica. Puede detectar y localizar masas inflamatorias periapendiculares (plastrones) abscesos y con gran precisión la apendicitis aguda.<br><br>Análisis de Distractores: La ultrasonografía (C) es el estudio de abordaje primario en mujeres, embarazadas y niños, pero posee un alto porcentaje de incapacidad para visualizar directamente el apéndice. La radiografía simple (D) es anormal en menos del 10% de los casos.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Pruebas Diagnósticas, Página 28."
    },
    {
        id: 5,
        question: "En la evaluación de pacientes pediátricos con sospecha de Apendicitis Aguda, ¿cuál es la sensibilidad diagnóstica reportada para la ultrasonografía abdominal?",
        options: ["75%", "86%", "91%", "97%"],
        answer: 2,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, los estudios prospectivos pediátricos avalan la alta capacidad discriminatoria del ultrasonido en manos expertas, erigiéndose como la prueba de primera elección libre de radiación.<br><br>Perla Quirúrgica: Se identificaron 8 estudios prospectivos en año 2004, de ultrasonografía en edad pediátrica reportando sensibilidad promedio de 91 (IC95% 89-93%) y especificidad de 97% (IC95% 95-99%).<br><br>Análisis de Distractores: El 86% (B) corresponde a la sensibilidad del USG descrita específicamente en la mujer embarazada. El 97% (D) corresponde a su valor de especificidad, no a su sensibilidad diagnóstica primaria en el grupo pediátrico.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Diagnóstico Clínico en Edad Pediátrica, Página 23."
    },
    {
        id: 6,
        question: "En la valoración de mujeres en edad fértil con dolor abdominal inespecífico, ¿en qué porcentaje aproximado la laparoscopia diagnóstica logra clarificar etiologías ginecológicas subyacentes?",
        options: ["5 a 10%", "10 a 20%", "25 a 35%", "40 a 50%"],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, la proximidad del tracto reproductivo femenino y la superposición de síntomas pélvicos justifican el uso de la endoscopia para evitar apendicectomías blancas e incidentales.<br><br>Perla Quirúrgica: La laparoscopia es útil en casos de difícil diagnóstico como ocurre en el género femenino, ya que clarifica las causas ginecológicas de síndrome doloroso abdominal en aproximadamente 10 a 20% de las pacientes.<br><br>Análisis de Distractores: Porcentajes menores como 5% (A) corresponden en realidad a su tasa de complicaciones reportada. Porcentajes excesivos mayores al 30% (C, D) contradicen el hecho de que gran parte del dolor pélvico es resoluble por otras vías clínicas o ecográficas.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Pruebas Diagnósticas, Página 29."
    },
    {
        id: 7,
        question: "Al utilizar escalas de escrutinio clínico (Alvarado, Solís-Mena, Teicher) en casos de Apendicitis Aguda, ¿hasta qué porcentaje logran mejorar la exactitud diagnóstica en los profesionales de la salud inexpertos?",
        options: ["40 a 55%", "58 a 71%", "75 a 86%", "89 a 93%"],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, el uso de herramientas estructuradas estandariza la recolección de los datos clínicos y paraclínicos, minimizando la variabilidad interobservador.<br><br>Perla Quirúrgica: Aunque los resultados de la utilización de estos instrumentos son variados parecen tener mayor utilidad para los profesionales jóvenes inexpertos en esta área ya que mejoran su exactitud diagnóstica de 58 a 71%.<br><br>Análisis de Distractores: Valores superiores al 75% (C, D) equipararían estas escalas predictivas con el poder de un estudio de tomografía computarizada, lo cual metodológicamente no está sustentado por el nivel de evidencia actual.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Pruebas Diagnósticas, Página 27."
    },
    {
        id: 8,
        question: "En la población geriátrica con Apendicitis Aguda, ¿qué factor fisiopatológico y evolutivo condiciona principalmente que acudan de manera tardía a recibir atención médica hospitalaria?",
        options: ["La evolución subaguda y el dolor de menor intensidad", "La distensión abdominal y el vómito fecaloide precoz", "La fiebre de alto grado y leucocitosis reactiva inmediata", "La hiperplasia linfoide que enmascara los síntomas parietales"],
        answer: 0,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, los cambios anatómicos por el envejecimiento, como la disminución de inervación y de tejido linfoide apendicular, atenúan drásticamente la clásica respuesta neuro-inflamatoria de esta entidad.<br><br>Perla Quirúrgica: En los adultos mayores la perforación puede ocurrir antes, y como la evolución es subaguda y el dolor puede ser de menor intensidad, generalmente acuden a atención médica en forma más tardía.<br><br>Análisis de Distractores: Las opciones C y D describen un cuadro florido ausente en la inmunosenescencia anciana. El vómito fecaloide (B) es sugerente de un síndrome oclusivo distal ajeno al diagnóstico primario de inflamación apendicular subaguda.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Diagnóstico Clínico en el Adulto Mayor, Página 17."
    },
    {
        id: 9,
        question: "En la evaluación del paciente lactante menor de 1 año con diagnóstico de Apendicitis Aguda, ¿cuál es el porcentaje de perforación apendicular esperado secundario a un desarrollo ineficiente del epiplón?",
        options: ["30 a 45%", "50 a 65%", "69 a 100%", "Menor a 20%"],
        answer: 2,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, la incapacidad de un epiplón inmaduro para formar un 'plastrón' protector, combinado con una semiología inespecífica y falta de verbalización, desemboca en una ruptura peritoneal.<br><br>Perla Quirúrgica: La incidencia de perforación suele ser alta mientras menor sea la edad; va de 69 a 100%, esta última cifra vista en niños menores de 1 año y la primera en pacientes de 5 años.<br><br>Análisis de Distractores: Valores menores al 65% (A, B, D) corresponden al riesgo general en adultos con demora en atención u otros grupos pediátricos mayores (como escolares), pero la cifra para lactantes documentada estadísticamente es la máxima.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Diagnóstico Clínico en Edad Pediátrica, Página 20."
    },
    {
        id: 10,
        question: "Debido a la alteración anatómica secundaria al crecimiento uterino en gestantes, ¿cuál se considera estadísticamente el signo clínico más confiable de Apendicitis Aguda?",
        options: ["Náusea y vómito persistente", "Dolor en el cuadrante derecho", "Fiebre mayor a 38°C", "Leucocitosis con neutrofilia"],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, la separación del peritoneo parietal del apéndice migrado altera el rebote y la resistencia muscular clásica. Los síntomas sistémicos y leucocitarios se traslapan con el embarazo fisiológico.<br><br>Perla Quirúrgica: La fiebre y la taquicardia, se presentan en cuadros apendiculares complicados... Por lo anterior, el dolor del cuadrante derecho es el signo más confiable en el diagnóstico de apendicitis y embarazo sin embargo está presente solo en 57% de los casos.<br><br>Análisis de Distractores: Las náuseas (A), la fiebre (C) y la leucocitosis (D) (que basal puede llegar hasta 16,000 de forma normal en el embarazo) ofrecen demasiados falsos positivos como para considerarse los signos más seguros sin el apoyo del dolor focalizado.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Diagnóstico Clínico durante el Embarazo, Página 24."
    },
    {
        id: 11,
        question: "En infantes con sospecha de Apendicitis Aguda, ¿cuáles son los tres parámetros y valores de corte exactos que conforman la 'prueba triple' de alta sospecha sugestiva?",
        options: ["PCR >8 mcg/ml, leucocitos >11,000 y neutrofilia >75%", "PCR >10 mcg/ml, leucocitos >15,000 y neutrofilia >80%", "PCR >5 mcg/ml, leucocitos >12,000 y neutrofilia >60%", "PCR >15 mcg/ml, leucocitos >20,000 y neutrofilia >90%"],
        answer: 0,
        justification: "Justificación: De acuerdo a la GPC de Diagnóstico de Apendicitis Aguda, la correlación de estos tres biomarcadores inflamatorios en los umbrales precisos eleva el valor predictivo de padecer una inflamación transmural apendicular, diferenciándola de otras causas pediátricas comunes.<br><br>Perla Quirúrgica: Existe la llamada prueba triple que sugiere altamente la presencia de apendicitis ante un cuadro clínico sugestivo, una PCR por arriba de 8 mcg/ml, leucocitosis superior a 11,000 y neutrofilia por arriba de 75%.<br><br>Análisis de Distractores: Alterar los valores hacia un corte mayor (B, D) apuntaría hacia apendicitis francamente perforada o sepsis avanzada, un estadio que esta prueba clínica busca predecir y evitar precozmente mediante diagnóstico temprano.",
        source: "IMSS-031-08, Diagnóstico de Apendicitis Aguda, 2009, Diagnóstico Clínico en Edad Pediátrica, Página 22."
    },
    {
        id: 12,
        question: "En el abordaje diferencial de un paciente con sospecha de abdomen agudo, ¿qué cuantificación de sedimento en el examen general de orina descarta inflamación reactiva y apoya sólidamente la infección de vías urinarias?",

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-teal-50 dark:bg-teal-900/20 text-teal-600 dark:text-teal-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-teal-100 dark:border-teal-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-teal-50 has-[:checked]:border-teal-400 dark:has-[:checked]:bg-teal-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-teal-600 focus:ring-teal-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-teal-600 dark:hover:bg-teal-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('03108Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('03108LastQId', currentQuestionId);
                else localStorage.removeItem('03108LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('03108Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

            if(userDocSnap.exists()) {document.body.style.opacity = '1';} else {window.location.href = "index.html";}} else {window.location.href = "index.html";}
