    <script>
        const questionsData = [
    {
        id: 1, 
        question: "En Pancreatitis Aguda, ¿cuál es el porcentaje máximo recomendado de casos que deben ser clasificados como idiopáticos tras una evaluación diagnóstica inicial completa de acuerdo con los estándares de control de calidad de la GPC?", 
        options: ["10%", "20%", "30%", "50%"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, se establece un límite de control de calidad institucional para determinar el origen del cuadro inflamatorio agudo en la gran mayoría de la población. La etiología debe investigarse con exactitud por el impacto clínico directo en el pronóstico y el tratamiento posterior.<br><br>Perla ENARM: \"Se debe determinar la etiología de la pancreatitis aguda en al menos 80% de los casos, de forma que no deben clasificarse como idiopática más del 20% de los casos\".<br><br>Análisis de Distractores: La opción A representa un umbral demasiado exigente que suele estar fuera del alcance en evaluaciones diagnósticas iniciales convencionales. Las opciones C y D representan porcentajes de clasificación idiopática elevados que se consideran una desviación de la calidad de atención especificada por la GPC.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Diagnóstico, pág. 11." 
    },
    {
        id: 2, 
        question: "En Pancreatitis Aguda, ¿cuántas horas posteriores al inicio del cuadro clínico se requiere de forma típica para la aparición física de los signos de Grey Turner, Cullen o Fox?", 
        options: ["12 a 24 horas", "24 a 48 horas", "48 a 72 horas", "72 a 96 horas"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, la extravasación sanguínea retroperitoneal hacia la pared abdominal o el ligamento inguinal es un proceso lento que se asocia con pancreatitis necrosante o hemorrágica. Al disecar de forma tardía las fascias anatómicas abdominales, estos signos no se observan de forma inmediata.<br><br>Perla ENARM: \"Los signos de Grey Turner´s (equimosis en la pared lateral del abdomen), Cullen´s (equimosis alrededor de la pared abdominal) y Fox´s (cambio de coloración sobre la porción inferior del ligamento inguinal) aparecen únicamente en el 3% de los pacientes. Se observan 48 a 72 horas después de la presentación de pancreatitis\".<br><br>Análisis de Distractores: Las opciones A y B representan períodos evolutivos precoces de la respuesta inflamatoria donde la disección hemorrágica del tejido subcutáneo aún no es visible. La opción D es incorrecta porque estos signos típicamente comienzan su expresión en la piel antes del cuarto día de evolución.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Diagnóstico, pág. 13." 
    },
    {
        id: 3, 
        question: "En Pancreatitis Aguda, ¿cuál es el parámetro bioquímico que debe preferirse para establecer el diagnóstico debido a su mayor especificidad y persistencia temporal en sangre?", 
        options: ["Amilasa sérica total", "Amilasa pancreática", "Lipasa sérica", "Fosfolipasa A2"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, las enzimas pancreáticas son esenciales en el diagnóstico del proceso inflamatorio agudo del páncreas. No obstante, la lipasa sérica posee una especificidad diagnóstica superior debido a que la amilasa total se eleva de forma concomitante en enfermedades extrapancreáticas.<br><br>Perla ENARM: \"La sensibilidad (90-100%) y especificidad (99%) de la enzima pancreática lipasa para el diagnóstico de pancreatitis aguda es superior a la de la amilasa total\".<br><br>Análisis de Distractores: La opción A (amilasa sérica) es incorrecta porque se asocia a elevaciones secundarias en otras afecciones agudas abdominales, además de decaer rápidamente en sangre. Las opciones B y D son marcadores útiles que, sin embargo, no son preferidos para el diagnóstico sistemático inicial debido a su menor disponibilidad o rendimiento diagnóstico documentado en comparación con la lipasa.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Diagnóstico, pág. 16." 
    },
    {
        id: 4, 
        question: "En Pancreatitis Aguda, ¿cuál es el punto de corte de la proteína C reactiva medido a las 48 horas de evolución que discrimina de forma óptima la gravedad del cuadro clínico?", 
        options: ["120 mg/l", "150 mg/l", "250 mg/l", "300 mg/l"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, la cuantificación de este reactante de fase aguda se utiliza como el estándar de oro de laboratorio en la evaluación pronóstica temprana de la gravedad.<br><br>Perla ENARM: \"La proteína C reactiva es útil para diferenciar las formas leves y graves de pancreatitis aguda con un punto de corte de 150 mg/ l a las 48 h con sensibilidad de 80% y especificidad de 75%, valor predictivo positivo de 86% así como factor pronóstico de gravedad\".<br><br>Análisis de Distractores: La opción A representa el punto de corte en mg/l que se asocia con el mantenimiento de la profilaxis antimicrobiana por sospecha de necrosis con datos locales o sistémicos no sépticos persistentes. Las opciones C y D representan niveles que no se corresponden con el umbral discriminante de gravedad de la proteína C reactiva a las 48 horas establecido en la GPC.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Diagnóstico, pág. 17." 
    },
    {
        id: 5, 
        question: "En Pancreatitis Aguda, ¿cuál es el valor de corte discriminante para clasificar el cuadro como grave al cabo de 24 horas del ingreso cuando se utiliza la elastasa polimorfonuclear?", 
        options: ["> 150 µg/dl", "> 200 µg/dl", "> 250 µg/dl", "> 300 µg/dl"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, la elastasa de los polimorfonucleares es un marcador temprano de la respuesta inflamatoria sistémica y de la activación de neutrófilos, útil para la predicción de severidad diagnóstica.<br><br>Perla ENARM: \"El corte discriminante de pancreatitis aguda grave con elastasa polimorfonuclear es 250 µg/dl en el momento del ingreso y > 300 µg/dl al cabo de 24 horas\".<br><br>Análisis de Distractores: La opción C es incorrecta debido a que 250 µg/dl es el punto de corte establecido por la GPC exclusivamente para el momento de la admisión del paciente. Las opciones A y B representan umbrales que no coinciden con la predicción cuantitativa de severidad definida en el texto.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Diagnóstico, pág. 17." 
    },
    {
        id: 6, 
        question: "En Pancreatitis Aguda, ¿cuál es el punto de corte en orina del péptido de activación de tripsinógeno en el primer día tras la aparición de los síntomas para reflejar de forma precoz la activación de proenzimas?", 
        options: ["15 nmol/l", "30 nmol/l", "50 nmol/l", "150 nmol/l"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, la detección de la activación de las proenzimas pancreáticas es considerada el fenómeno fisiopatológico más temprano en el desarrollo de la enfermedad.<br><br>Perla ENARM: \"Los valores en el primer día tras la aparición de síntomas del péptido de activación de tripsinógeno (punto de corte de 50 nmol/l) y del péptido de la activación de la carboxipeptidasa β (punto de corte de 50 nmol/l) en orina reflejan el grado de activación de proenzimas, lo que se considera el fenómeno más precoz en el desarrollo de la pancreatitis aguda\".<br><br>Análisis de Distractores: Las opciones A y B son incorrectas por representar valores numéricos que subestiman el punto de corte crítico en orina fijado en la GPC. La opción D es un distractor que se confunde con el valor de corte de la proteína C reactiva a las 48 horas expresado en mg/l (150 mg/l).", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Diagnóstico, pág. 17." 
    },
    {
        id: 7, 
        question: "En Pancreatitis Aguda, ¿a partir de qué nivel de creatinina sérica se contraindica la realización de una tomografía computarizada con medio de contraste?", 
        options: ["> 1.2 mg/dl", "> 1.4 mg/dl", "> 1.5 mg/dl", "> 2.0 mg/dl"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, la administración intravenosa de contraste yodado dinámico requiere de una adecuada tasa de filtración glomerular basal para prevenir el desarrollo de nefropatía por contraste en el paciente deshidratado.<br><br>Perla ENARM: \"Las contraindicaciones para la realización de la tomografía computada incluyen: alergia al medio de contraste e insuficiencia renal (Creatinina sérica > 1.5 mg/dL\".<br><br>Análisis de Distractores: Las opciones A y B corresponden a umbrales altos de la normalidad laboratorial pero no representan la contraindicación diagnóstica formal de la GPC. La opción D es incorrecta por corresponder al límite de definición de insuficiencia renal aguda establecido en las definiciones operativas de la GPC tras una adecuada rehidratación.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Diagnóstico, pág. 19." 
    },
    {
        id: 8, 
        question: "En Pancreatitis Aguda de origen biliar asociada a colangitis aguda, ¿en cuántas horas como máximo se debe realizar de forma urgente la colangiopancreatografía retrógrada endoscópica?", 
        options: ["12 horas", "24 horas", "48 horas", "72 horas"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, ante toda pancreatitis de etiología litiásica asociada con infección de la vía biliar principal, se requiere una intervención de descompresión urgente para resolver la sepsis biliar y evitar complicaciones graves.<br><br>Perla ENARM: \"La CPRE se debe realizar de forma urgente dentro de las primeras 24 horas en los pacientes con colangitis aguda\".<br><br>Análisis de Distractores: La opción A representa una meta deseable pero no constituye la recomendación estándar descrita en la GPC. Las opciones C y D corresponden a la ventana de realización de colangiopancreatografía retrógrada endoscópica en pancreatitis biliar grave pero en ausencia de colangitis aguda (primeras 72 horas).", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Tratamiento, pág. 35." 
    },
    {
        id: 9, 
        question: "En Pancreatitis Aguda grave, ¿con qué nivel de proteína C reactiva persistente se justifica prolongar el uso de profilaxis antimicrobiana más allá del esquema estándar de 14 días?", 
        options: ["> 85 mg/l", "> 100 mg/l", "> 110 mg/l", "> 120 mg/l"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, el mantenimiento de la profilaxis con antibióticos de amplio espectro en la necrosis demostrada se puede prolongar cuando persisten las complicaciones locales o marcadores de inflamación activos elevados.<br><br>Perla ENARM: \"En el caso de administrar antibiótico profiláctico la duración puede ser hasta de 14 días o más si persisten las complicaciones locales o sistémicas no sépticas p sí los niveles de proteína C reactiva se mantienen > 120 mg/dl\".<br><br>Análisis de Distractores: La opción A es incorrecta porque representa el punto de corte en mg/dl útil para el diagnóstico de sepsis pancreática al ingreso. Las opciones B y C representan valores numéricos incorrectos que no coinciden con los lineamientos de la GPC.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Tratamiento, pág. 26." 
    },
    {
        id: 10, 
        question: "En Pancreatitis Aguda grave con necrosis demostrada por tomografía computarizada, ¿cuál es el esquema de dosificación de imipenem recomendado para la profilaxis de infección de la necrosis pancreática?", 
        options: ["500-1,000 mg cada 6-8 horas", "500 mg cada 12 horas", "1,000 mg cada 12 horas", "1,500 mg cada 8 horas"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, ante necrosis pancreática extensa demostrada se prefiere el uso de carbapenémicos debido a su excelente penetración y biodisponibilidad en el magma necrótico de la glándula.<br><br>Perla ENARM: \"Sí se emplea antibiótico profiláctico se recomienda imipenem 500-1,000 mg cada 6-8 horas o meropenem 1,000 mg cada 8 horas durante dos semanas\".<br><br>Análisis de Distractores: Las opciones B y C son incorrectas debido a que representan esquemas de dosificación subóptimos que no garantizan concentraciones inhibitorias tisulares estables contra microorganismos diana. La opción D es incorrecta porque excede las dosis terapéuticas estipuladas en el anexo de medicamentos de la GPC.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Tratamiento, pág. 27." 
    },
    {
        id: 11, 
        question: "En Pancreatitis Aguda grave, ¿en cuántas horas como máximo tras el ingreso hospitalario se debe iniciar la nutrición enteral para reducir la translocación bacteriana?", 
        options: ["24 horas", "36 horas", "48 horas", "72 horas"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Pancreatitis Aguda, el reposo intestinal absoluto prolongado se asocia con atrofia de la barrera de enterocitos y aumento del riesgo de translocación, por lo que el soporte enteral es de primera elección en pancreatitis grave.<br><br>Perla ENARM: \"La nutrición enteral debe iniciarse dentro de las 48 horas desde el ingreso hospitalario\".<br><br>Análisis de Distractores: Las opciones A y B representan metas iniciales ideales de resucitación y de cuidados intensivos pero no constituyen el límite temporal estandarizado por la GPC. La opción D es incorrecta porque postergar la nutrición enteral hasta el tercer día incrementa sustancialmente la incidencia de sepsis.", 
        source: "IMSS-239-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Pancreatitis Aguda, 2009, Tratamiento, pág. 29." 
    },
    {
        id: 12, 
        question: "En Pancreatitis Aguda, ¿cuál es el aporte calórico diario recomendado por kilogramo de peso para la formulación del soporte nutricional del paciente?", 
        options: ["15 a 20 kcal/kg/día", "25 a 35 kcal/kg/día", "35 a 45 kcal/kg/día", "45 a 55 kcal/kg/día"], 
        answer: 1,

                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-teal-50 dark:bg-teal-900/20 text-teal-600 dark:text-teal-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-teal-100 dark:border-teal-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-teal-50 has-[:checked]:border-teal-400 dark:has-[:checked]:bg-teal-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-teal-600 focus:ring-teal-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-teal-600 dark:hover:bg-teal-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('23909Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('23909LastQId', currentQuestionId);
                else localStorage.removeItem('23909LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('23909Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

            if(userDocSnap.exists()) {document.body.style.opacity = '1';} else {window.location.href = "index.html";}} else {window.location.href = "index.html";}
