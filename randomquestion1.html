<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }

        .logo-enarm {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            color: #004c8c;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        .logo-Lite {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            color: #70b93d;
        }
        .logo-Lite sup { font-size: 0.6em; top: -0.4em; position: relative; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300 h-[100dvh] overflow-hidden">

    <div id="app-container" class="relative h-full lg:flex">
        
        <!-- SIDEBAR NAVEGADOR -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 w-80 p-5 flex flex-col transform -translate-x-full transition-transform duration-300 ease-in-out z-30 shadow-[4px_0_24px_rgba(0,0,0,0.05)] border-r border-slate-200 dark:border-slate-800">
            
            <div class="flex justify-center mb-6 pt-2">
                <div class="flex items-baseline gap-1 bg-slate-50 dark:bg-slate-800 px-4 py-1.5 rounded-full border border-slate-200 dark:border-slate-700">
                    <span class="logo-enarm text-base">ENARM</span>
                    <span class="logo-Lite text-sm">Lite<sup>®</sup></span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto min-h-0 custom-scrollbar pr-1">
                <div class="mb-4 relative">
                    <input type="text" id="module-search" placeholder="Buscar número o texto..." class="w-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-lg py-2 pl-3 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute right-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>

                <!-- GRID LATERAL -->
                <div id="sidebar-q-grid" class="grid grid-cols-[repeat(auto-fill,minmax(40px,1fr))] gap-2 p-2"></div>
            </div>
            
            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 mt-2 space-y-3">
                <button id="dark-mode-toggle" class="w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 font-semibold py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg id="sun-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="moon-icon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                    Alternar Tema
                </button>

                <button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full bg-white dark:bg-slate-800 text-red-500 border border-red-200 dark:border-red-900/50 font-semibold py-2.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reiniciar Examen
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT (Scrollable) -->
        <main id="main-content" class="flex-1 h-[100dvh] overflow-y-auto overscroll-y-contain p-4 sm:p-6 lg:p-8 transition-all duration-300 relative bg-slate-50 dark:bg-slate-950">
            
            <!-- Botón Grid (Tablero) a la Izquierda (Oculto en Inicio) -->
            <button id="dashboard-button" onclick="displayQuestion(null)" class="hidden fixed top-4 left-4 lg:left-[22rem] bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-300" title="Ver Tablero de Preguntas">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
            </button>

            <!-- Botón Menú a la Derecha (Oculto en Inicio, visible en desktop y móvil) -->
            <button id="menu-toggle" class="hidden fixed top-4 right-4 lg:right-8 bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
            </button>

            <!-- Barra de Progreso Limpia (Gruesa y sin marca de agua de fondo) -->
            <div id="progress-container" class="hidden w-full max-w-4xl mx-auto bg-slate-200 dark:bg-slate-700 rounded-full mb-4 mt-0 h-6 shadow-inner overflow-hidden relative">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-cyan-500 h-full transition-all duration-500 flex items-center justify-center text-[11px] font-bold text-white leading-none relative z-10" style="width:0%">0%</div>
            </div>
            
            <div id="module-display" class="transition-opacity duration-300 pb-12"></div>
        </main>
        
        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-slate-900/40 z-20 backdrop-blur-sm"></div>
    </div>
    
    <!-- MODAL REINICIAR -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Reiniciar Examen</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">Se borrará tu progreso actual. ¿Deseas continuar?</p>
            <div class="flex gap-3">
                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>
        </div>
    </div>

    <script>
        const questionsData = [


    {
        id: 1, 
        question: "De acuerdo a la GPC, ¿cuál es el rango de temperatura recomendado en la habitación o quirófano donde nacerá el recién nacido prematuro para evitar la pérdida de calor?", 
        options: ["18 a 20 °C", "21 a 22 °C", "23 a 25 °C", "26 a 28 °C"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Recién Nacido Prematuro, la prevención de la hipotermia inmediata al nacimiento es crítica para disminuir el consumo de oxígeno y el estrés metabólico celular. El enfriamiento rápido al nacer se contrarresta al adecuar el ambiente físico de la sala con un gradiente térmico reducido.<br><br>Perla ENARM: \"Las siguientes acciones favorecen que el RNP no pierda calor: Temperatura de la habitación donde nacerá entre 23 y 25°C.\"<br><br>Análisis de Distractores: Las opciones A y B representan las temperaturas operativas estándar en quirófanos convencionales para adultos, las cuales inducen hipotermia severa en el prematuro por su inmadurez vasomotora. La opción D describe un ambiente excesivamente cálido que puede generar sobrecalentamiento e inestabilidad respiratoria por incapacidad de disipación de calor.", 
        source: "GPC-IMSS-362-18, Cuidados del Recién Nacido Prematuro Sano Hospitalizado, 2018, Sección: Evaluación inicial del Recién Nacido Prematuro, Página 14." 
    },

    {
        id: 2, 
        question: "De acuerdo a la GPC, ¿cuáles son los valores de sensibilidad y especificidad de la Escala Clínica de Deshidratación para clasificar un déficit de peso corporal del 5% al 9%?", 
        options: ["Sensibilidad de 82% y especificidad de 90%", "Sensibilidad de 87% y especificidad de 82%", "Sensibilidad de 90% y especificidad de 85%", "Sensibilidad de 75% y especificidad de 80%"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Diarrea Aguda Infantil, la validez diagnóstica de las escalas clínicas para predecir la pérdida ponderal aguda ha sido evaluada mediante pruebas de rendimiento psicométrico.<br><br>Perla ENARM: \"Deshidratación con déficit de peso del 5 al 9%: Toma en cuenta tres o más signos y síntomas. Tiene sensibilidad del 87% y especificidad del 82%.\"<br><br>Análisis de Distractores: La opción A es el rendimiento de la misma escala pero para clasificar una deshidratación grave con déficit ≥ 10%. Las opciones C y D son distractores con valores numéricos ajenos a la guía.", 
        source: "GPC-S-156-18, Prevención, diagnóstico y tratamiento de diarrea aguda en pacientes de 2 meses a 5 años de edad, en el primer y segundo nivel de atención, 2018, Diagnóstico, Página 15." 
    },
        {
        id: 3, 
        question: "En la valoración previa al ejercicio del paciente diabético, ¿a partir de qué edad en un familiar directo con cardiopatía se considera criterio absoluto para solicitar una prueba de esfuerzo?", 
        options: ["Menor a 45 años", "Menor a 50 años", "Menor a 60 años", "Menor a 65 años"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de prescripción de ejercicio en diabetes, el antecedente familiar de isquemia coronaria prematura incrementa exponencialmente la probabilidad de que el paciente diabético curse con enfermedad arterial coronaria silente, exigiendo una prueba de esfuerzo bajo estrés para garantizar la seguridad del entrenamiento.<br><br>Perla ENARM: \"La prueba de esfuerzo está indicada en pacientes con uno o más de los criterios siguientes: ... Familiar < 60 años de edad con cardiopatía\".<br><br>Análisis de Distractores: Las opciones A, B y D son límites de edad utilizados en escalas generales de riesgo cardiovascular (como Framingham), pero no son los cortes numéricos exactos establecidos para el tamizaje coronario en esta GPC.", 
        source: "GPC SS-804-17, Prescripción de ejercicio físico en pacientes con diabetes mellitus en los tres niveles de atención, 2017, Evaluación previa al ejercicio, Página 24." 
    },
    {
        id: 4, 
        question: "¿A partir de qué distancia mínima del nacimiento del cabello hacia la periferia se considera que una liendre observada clínicamente es no viable?", 
        options: [">0.5 cm", ">0.7 cm", ">1 cm", ">2 cm"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Pediculosis Capitis en Escolares, debido al crecimiento del cabello, una distancia mayor a un centímetro indica que el huevo ya ha eclosionado o se ha deshidratado, descartando la presencia de una de una infestación activa.<br><br>Perla ENARM: \"El hallazgo de una ninfa o liendre a más de 1cm de la piel cabelluda es generalmente no viable, por lo que disminuye la sospecha de de infestación activa\"<br><br>Análisis de Distractores: Las opciones A y B son las distancias promedio (en centímetros) a las que se localizan las liendres activas y viables durante la exploración. La opción D es una cifra distractora superior que no define la viabilidad clínica inicial de la liendre.", 
        source: "IMSS-602-13, Diagnóstico y tratamiento de Pediculosis capitis en escolares y adolescentes, 2013, Sección 4.2, Página 16." 
    },

        {
        id: 5, 
        question: "En el conteo de equivalencias de carbohidratos para frutas de la GPC, ¿qué cantidad de \"pasas\" equivale exactamente a una ración de 15 gramos de carbohidratos?", 
        options: ["1 cucharada", "2 cucharadas", "3 cucharadas", "4 cucharadas"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de diabetes mellitus pediátrica, debido a su deshidratación, las pasas concentran una densidad de azúcares elevada, requiriéndose una porción física muy pequeña para constituir una ración de fruta estándar equivalente a 15 gramos de carbohidratos.<br><br>Perla ENARM: \"FRUTAS. 15 gramos de carbohidratos por ración... Pasas 2 cdas.\".<br><br>Análisis de Distractores: Las cucharadas especificadas en A, C y D no se corresponden con el volumen estandarizado en la guía para la ración equivalente de pasas.", 
        source: "GPC-SS-302-21, Diagnóstico y tratamiento de la diabetes mellitus tipo 1 y tipo 2 en paciente pediátrico en los tres niveles de atención, 2021, Sección: Cuadros o figuras, Página 36." 
    },
        {
        id: 6, 
        question: "¿Cuál es la proporción recomendada de sal y azúcar por litro de agua para preparar de forma casera una solución de rehidratación oral de osmolaridad reducida de acuerdo a la GPC?", 
        options: ["1/2 cucharadita de sal y 6 cucharaditas de azúcar", "1 cucharadita de sal y 8 cucharaditas de azúcar", "1/4 cucharadita de sal y 4 cucharaditas de azúcar", "1/2 cucharadita de sal y 8 cucharaditas de azúcar"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de diarrea aguda en adultos, en escenarios donde no se cuente de manera inmediata con los sobres de sales de rehidratación oral comerciales o distribuidos por el sector salud, se puede sustituir su composición utilizando ingredientes domésticos comunes para evitar un retraso peligroso en la corrección hídrica.<br><br>Perla ENARM: \"Utilice la nueva solución de rehidratación oral de osmolaridad reducida de la Organización Mundial de la Salud o un sustituto. Se puede duplicar aproximadamente mezclando 1/2 cucharadita de sal, 6 cucharaditas de azúcar y 1 litro de agua.\"<br><br>Análisis de Distractores: Las opciones B, C y D corresponden a proporciones incorrectas no recomendadas por la GPC que alterarían de forma peligrosa la osmolaridad de la solución, lo cual podría deparar desequilibrios hidroelectrolíticos, hipernatremia o el empeoramiento severo de una diarrea osmótica en el paciente adulto.", 
        source: "GPC-SS-106-20, Prevención, diagnóstico y tratamiento de diarrea aguda en el paciente adulto en primer nivel de atención, 2020, Sección de Anexos (Diagramas de flujo), Página 25." 
    },
        {
        id: 7, 
        question: "¿Cuál es el valor reportado de sensibilidad para la fracción exhalada de óxido nítrico en el diagnóstico de asma en niños de 5 a 16 años de edad?", 
        options: ["49 %", "57 %", "87 %", "90 %"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Asma en Edad Pediátrica, la sensibilidad de este biomarcador para evidenciar inflamación eosinofílica es moderada, lo que significa que una prueba negativa no excluye el diagnóstico, requiriendo siempre correlación clínica y espirométrica.<br><br>Perla ENARM: \"En niños de 5 a 16 años de edad, para el diagnóstico de asma, la FeNO tiene sensibilidad de 57% y especificidad de 87%; con valor predictivo positivo de 90% y valor predictivo negativo de 49%.\"<br><br>Análisis de Distractores: El 49% (A) es el valor predictivo negativo de la prueba. El 87% (C) es la especificidad del biomarcador. El 90% (D) es el valor predictivo positivo reportado para este rango de edad.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Diagnóstico, Página 17." 
    },
        {
        id: 8, 
        question: "¿Cuál es la concentración recomendada de flúor en el agua de consumo humano considerada como la intervención más costo-beneficio para reducir la caries dental?", 
        options: ["0.5 a 0.8 ppm", "0.7 a 1 ppm", "1 a 1.5 ppm", "2 a 4 ppm"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Prevención de Caries Dental, la adición de flúor en el agua de consumo humano representa la medida preventiva más costo-efectiva a nivel comunitario.<br><br>Perla ENARM: \"La intervención más efectiva en costo beneficio para reducir caries dental en pacientes de 6 a 16 años de edad es adicionar flúor en una concentración de 0.7 a 1 ppm en el agua de consumo humano.\"<br><br>Análisis de Distractores: Las opciones A, C y D representan concentraciones incorrectas que no se contemplan en las recomendaciones de abasto público de la GPC.", 
        source: "SS-024-08, Prevención y Diagnóstico de la Caries Dental en Pacientes de 6 a 16 Años de Edad, 2013, Sección 4.1.1.1, Página 14." 
    },
    {
        id: 9, 
        question: "De acuerdo a la GPC, ¿qué número de evacuaciones diarreicas en las últimas 24 horas representa un factor que aumenta el riesgo de hospitalización?", 
        options: ["Tres o más evacuaciones", "Cinco o más evacuaciones", "Diez o más evacuaciones", "Quince o más evacuaciones"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Diarrea Aguda Infantil, el número absoluto de evacuaciones refleja el gasto fecal potencial del lactante. Superar este umbral de frecuencia en un solo día predice un desequilibrio hidroelectrolítico de difícil manejo ambulatorio.<br><br>Perla ENARM: \"Factores que aumentan el riesgo de hospitalización por diarrea: ... Diez o más evacuaciones diarreicas en las últimas 24 horas.\"<br><br>Análisis de Distractores: La opción A representa evacuaciones dentro del rango definitorio basal. La opción B (cinco o más evacuaciones) es un criterio de deshidratación en urgencias, pero no representa el factor de riesgo específico para hospitalización. La opción D no está descrita en el cuadro de riesgo.", 
        source: "GPC-S-156-18, Prevención, diagnóstico y tratamiento de diarrea aguda en pacientes de 2 meses a 5 años de edad, en el primer y segundo nivel de atención, 2018, Anexos (Cuadro 6), Página 35." 
    },
    {
        id: 10, 
        question: "¿A qué distancia en metros se recomienda calibrar y aplicar la cartilla de símbolos de LEA o la cartilla HOTV en preescolares de 36 a 72 meses?", 
        options: ["3 m", "6 m", "4.5 m", "1 m"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Alteraciones Visuales en el Preescolar, las pruebas a escalas abreviadas logarítmicas (logMAR) son las de mejor rendimiento para mantener el enfoque cognitivo de los niños pequeños, recomendando una distancia de tamizaje estandarizada de 3 metros.<br><br>Perla ENARM: \"Es aconsejable que los optotipos elegidos estén estandarizados y validados... Es aceptable en la práctica utilizar las pruebas o cartillas HOTV o la de símbolos de LEA calibrados para 3 m. de distancia entre el optotipo y el evaluado\".<br><br>Análisis de Distractores: El distractor B (6 m) representa la distancia estándar requerida para evaluar a niños mayores verbales que ya interpretan y comunican símbolos. El distractor C (4.5 m) es una cifra derivada de la distancia en centímetros (45 cm) aconsejada para realizar el reflejo rojo de Brückner. El distractor D (1 m) es la distancia para la toma de agudeza visual cercana.", 
        source: "IMSS-230-16, Detección oportuna de alteraciones visuales en el preescolar en el primer nivel de atención, 2016, Sección 4.3.1 Exploración en el niño verbal o preescolar, página 30." 
    },

        ];

        
        let userProgress = {};
        let currentQuestionId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadProgress();
            
            let lastQId = null;
            try { lastQId = localStorage.getItem('random1LastQId'); } catch (e) {}
            displayQuestion(lastQId ? parseInt(lastQId) : null);
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('module-search').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.q-box-item').forEach(box => {
                    const id = parseInt(box.dataset.id);
                    const qObj = questionsData.find(q => q.id === id);
                    if(!qObj) return;
                    const matchText = qObj.question.toLowerCase().includes(term);
                    box.style.display = (term === '' || matchText || id.toString() === term) ? 'flex' : 'none';
                });
            });

            document.getElementById('cancel-reset').addEventListener('click', () => {
                const m = document.getElementById('reset-modal'); m.querySelector('div').classList.add('scale-95');
                setTimeout(()=>m.classList.add('hidden'),300);
            });
            document.getElementById('confirm-reset').addEventListener('click', () => {
                localStorage.removeItem('random1Progress');
                localStorage.removeItem('random1LastQId');
                window.location.reload();
            });
            
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const overlay = document.getElementById('sidebar-overlay');
            const dashboardBtn = document.getElementById('dashboard-button');
            
            menuToggle.addEventListener('click', () => {
                if (window.innerWidth >= 1024) {
                    sidebar.classList.toggle('lg:translate-x-0');
                    mainContent.classList.toggle('lg:ml-80');
                    
                    // Reposicionar el botón del tablero dependiendo de si el sidebar está abierto
                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {

        // Navegar a pregunta anterior
        function goToPreviousQuestion(currentId) {
            const currentIndex = questionsData.findIndex(q => q.id === currentId);
            if (currentIndex > 0) {

            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-sm cursor-pointer transition-all select-none border ";

            const state = userProgress[qId];
            if (!state || !state.answered) {
                return base + "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700 dark:hover:bg-slate-700";
            } else if (state.isCorrect) {
                return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
            } else {
                return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
            }
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {

                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {

            const userAnswer = qState.selectedOption;

            let html = `

                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";

                            return `

                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">

                        </h4>

                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>

                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}

            document.getElementById('module-display').innerHTML = html;

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('random1Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('random1LastQId', currentQuestionId);
                else localStorage.removeItem('random1LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('random1Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
