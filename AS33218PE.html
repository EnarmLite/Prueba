    <script>
        const questionsData = [

    {
        id: 1, 
        question: "En Parálisis Cerebral, ¿cuál es el límite de edad máxima para que una lesión cerebral posnatal sea considerada etiológicamente dentro de esta patología?", 
        options: ["12 meses", "18 meses", "24 meses", "36 meses"], 
        answer: 2, 
        justification: "Justificación: Las lesiones ocurridas en un cerebro en desarrollo tardío pueden causar secuelas permanentes pero no encajan en el concepto de parálisis cerebral si se presentan de forma muy tardía. De acuerdo GPC de Parálisis Cerebral en Lactantes, el daño neurológico sobrevenido después de nacer se considera causa de parálisis cerebral si ocurre antes del cumplimiento de los dos años de edad.<br><br>Perla ENARM: \"Posnatales: infecciones, complicaciones transquirúrgicas, lesión cerebral antes de los 24 meses de edad.\"<br><br>Análisis de Distractores: Las opciones A y B representan edades lactantes típicas pero la GPC extiende el límite hasta los dos años. La opción D representa una edad en la que cualquier daño sobrevenido se categoriza clínicamente como daño cerebral adquirido y no propiamente como parálisis cerebral.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 13." 
    },
    {
        id: 2, 
        question: "En Parálisis Cerebral, ¿cuántas veces es mayor el riesgo de presentar esta patología en lactantes nacidos antes de las 28 semanas de gestación en comparación con los nacidos a término?", 
        options: ["10 veces", "25 veces", "50 veces", "100 veces"], 
        answer: 2, 
        justification: "Justificación: La extrema inmadurez cerebral y vascular expone al prematuro a hemorragias intraventriculares y leucomalacia. De acuerdo GPC de Parálisis Cerebral en Lactantes, nacer con menos de 28 semanas de gestación incrementa drásticamente la probabilidad de desarrollar esta condición en comparación con los nacidos a término.<br><br>Perla ENARM: \"El riesgo de parálisis cerebral en pacientes nacidos antes de las 28sdg es 50 veces mayor a los nacidos a término.\"<br><br>Análisis de Distractores: Las opciones A y B subestiman el riesgo exponencial del prematuro extremo. La opción D sobreestima el factor epidemiológico reportado en los estudios de cohorte que sustentan la GPC.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 13." 
    },
    {
        id: 3, 
        question: "De acuerdo a la clasificación de factores de riesgo para Parálisis Cerebral, ¿cuál de los siguientes se clasifica como un factor de riesgo preconcepcional?", 
        options: ["Hipertiroidismo materno", "Antecedente de mortinato", "Preeclampsia materna", "Restricción del crecimiento intrauterino"], 
        answer: 1, 
        justification: "Justificación: Es vital agrupar adecuadamente los factores según su temporalidad. De acuerdo GPC de Parálisis Cerebral en Lactantes, los antecedentes ginecobstétricos previos a la concepción del actual embarazo (como la muerte fetal previa) influyen de manera independiente.<br><br>Perla ENARM: \"Preconcepción: antececente de mortinato, aborto(s) espontáneo(s), bajo nivel socioeconómico, uso de técnicas de reproducción asistida y variaciones en el número de copias genéticas.\"<br><br>Análisis de Distractores: Las opciones A, C y D corresponden a factores de riesgo prenatales, ya que se desarrollan o se identifican durante el curso del embarazo actual y no antes de este.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 13." 
    },
    {
        id: 4, 
        question: "En Parálisis Cerebral, ¿qué porcentaje de pacientes diagnosticados no presentan factores de riesgo prenatales ni perinatales identificables?", 
        options: ["10%", "30%", "50%", "70%"], 
        answer: 2, 
        justification: "Justificación: Un error diagnóstico común es descartar la patología ante una historia clínica sin antecedentes de asfixia o prematurez. De acuerdo GPC de Parálisis Cerebral en Lactantes, la mitad de los casos se manifiesta de manera idiopática sin antecedentes de riesgo obvios durante el embarazo o nacimiento.<br><br>Perla ENARM: \"El 50% de los pacientes con parálisis cerebral pueden no presentan factores de riesgo prenatal y perinatal.\"<br><br>Análisis de Distractores: Las opciones A y B subestiman la proporción de casos idiopáticos. La opción D sobreestima la cantidad de pacientes que no tienen antecedentes, ya que el otro 50% de la población clínica sí asocia factores reconocibles en la anamnesis.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 14." 
    },
    {
        id: 5, 
        question: "En Parálisis Cerebral, ¿cuál es la meta de edad corregida establecida actualmente por la GPC para asentar el diagnóstico definitivo en lactantes?", 
        options: ["Menor de 3 meses", "Menor de 6 meses", "Menor de 12 meses", "Menor de 24 meses"], 
        answer: 1, 
        justification: "Justificación: El paradigma de retrasar el diagnóstico definitivo por temor a etiquetar tempranamente ha cambiado para favorecer la neurorrecuperación. De acuerdo GPC de Parálisis Cerebral en Lactantes, la meta actual es integrar el diagnóstico de forma muy temprana aplicando edad corregida en prematuros.<br><br>Perla ENARM: \"Anteriormente se establecía el diagnóstico de parálisis cerebral entre los 12 y 24 meses de edad, actualmente se establece antes de los 6 meses de edad (se debe establecer edad corregida).\"<br><br>Análisis de Distractores: La opción A representa una edad muy temprana donde la maduración motora limita evaluaciones definitivas de hitos. Las opciones C y D reflejan las conductas antiguas que retrasaban el tratamiento rehabilitador oportuno.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 14." 
    },
    {
        id: 6, 
        question: "En lactantes prematuros con sospecha de Parálisis Cerebral, ¿a partir de qué edad corregida suelen estructurar clínicamente este riesgo detectable según la GPC?", 
        options: ["Después de los 2 meses", "Después de los 3 meses", "Después de los 5 meses", "Después de los 9 meses"], 
        answer: 2, 
        justification: "Justificación: En el paciente prematuro, los reflejos primitivos pueden persistir de forma fisiológica inicialmente. De acuerdo GPC de Parálisis Cerebral en Lactantes, la persistencia patológica y estructuración de los patrones anormales se vuelve evidente y medible tras cruzar la barrera del quinto mes.<br><br>Perla ENARM: \"Pacientes prematuros con riesgo detectable para parálisis cerebral, la estructuran después de los 5 meses de edad corregida.\"<br><br>Análisis de Distractores: Las opciones A y B corresponden a edades donde las asimetrías transitorias de tono aún son comunes en prematuros. La opción D es tardía, ya que para ese momento la plasticidad neuronal habrá disminuido su potencial inicial.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 15." 
    },
    {
        id: 7, 
        question: "En Parálisis Cerebral, ¿cuál es el diagnóstico provisional que debe asignarse a un lactante con sospecha clínica que no puede confirmarse con exactitud inmediatamente?", 
        options: ["Retraso psicomotor inespecífico", "Alto riesgo para parálisis cerebral", "Encefalopatía hipóxico-isquémica", "Síndrome de neurona motora superior"], 
        answer: 1, 
        justification: "Justificación: Evitar retrasos administrativos en la terapia exige un diagnóstico operativo inmediato. De acuerdo GPC de Parálisis Cerebral en Lactantes, la sospecha firme, aun sin pruebas de gabinete o escalas completas, requiere una clasificación específica para activar la rehabilitación pediátrica.<br><br>Perla ENARM: \"Cuando se sospecha el diagnóstico clínico de parálisis cerebral, pero no puede establecerse con exactitud, deberá establecerse un diagnóstico provisional de 'alto riesgo para parálisis cerebral'.\"<br><br>Análisis de Distractores: Las opciones A, C y D son diagnósticos médicos o síndromes fisiopatológicos que no corresponden al término operativo estandarizado por la GPC para referir de inmediato al niño a terapias de intervención temprana.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 15." 
    },
    {
        id: 8, 
        question: "En el proceso diagnóstico de la Parálisis Cerebral, ¿cuál es la sensibilidad reportada para el Examen Neurológico Infantil de Hammersmith para predecir esta patología?", 
        options: ["74%", "86%", "90%", "98%"], 
        answer: 2, 
        justification: "Justificación: El uso de escalas estandarizadas cuantificables es una recomendación clave. De acuerdo GPC de Parálisis Cerebral en Lactantes, el Examen de Hammersmith ofrece una elevada precisión predictiva diagnóstica en lactantes evaluados en centros especializados.<br><br>Perla ENARM: \"El examen neurológico infantil de Hammersmith tiene una sensibilidad del 90% para predecir parálisis cerebral.\"<br><br>Análisis de Distractores: La opción A es la sensibilidad del ultrasonido transfontanelar. La opción B es el límite inferior de sensibilidad de la resonancia magnética. La opción D corresponde a la sensibilidad diagnóstica de la evaluación cualitativa de los movimientos generales.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 16." 
    },
    {
        id: 9, 
        question: "En la Evaluación Cualitativa de los Movimientos Generales para Parálisis Cerebral, ¿entre qué semanas postérmino la ausencia de movimientos \"fidgety\" se considera un criterio diagnóstico anormal?", 
        options: ["Semana 4 a 8", "Semana 8 a 12", "Semana 12 a 16", "Semana 16 a 20"], 
        answer: 2, 
        justification: "Justificación: Los movimientos \"fidgety\" o de jugueteo son movimientos pequeños, circulares y elegantes que deben presentarse en lactantes sanos. De acuerdo GPC de Parálisis Cerebral en Lactantes, la ausencia de estos movimientos específicos en un periodo de edad muy delimitado es un fuerte predictor de daño motor permanente.<br><br>Perla ENARM: \"-Movimientos Generales anormales: ausencia de Fidgety entre la semana 12 y 16 postérmino.\"<br><br>Análisis de Distractores: Las opciones A y B representan periodos donde los movimientos generales se clasifican aún como de pobre repertorio. La opción D está fuera del periodo de evaluación ideal y estandarizado del comportamiento \"fidgety\".", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 16." 
    },
    {
        id: 10, 
        question: "En Parálisis Cerebral, ¿cuál es la sensibilidad diagnóstica que ofrece la Evaluación Cualitativa de los Movimientos Generales para identificar disfunción motora antes de los 5 meses de edad de acuerdo a la GPC?", 
        options: ["74%", "86%", "90%", "98%"], 
        answer: 3, 
        justification: "Justificación: Esta valoración observacional especializada (basada en el método de Prechtl) es la herramienta no invasiva con mayor rendimiento clínico predictivo en el menor de 5 meses. De acuerdo GPC de Parálisis Cerebral en Lactantes, supera en sensibilidad diagnóstica individual a la exploración física rutinaria y a los estudios de neuroimagen.<br><br>Perla ENARM: \"La evaluación de los movimientos generales presenta una sensibilidad del 98%, predictivo para realizar el diagnóstico clínico de la parálisis cerebral.\"<br><br>Análisis de Distractores: La opción A es la sensibilidad del ultrasonido. La opción B corresponde al límite inferior de la resonancia magnética. La opción C corresponde a la sensibilidad del Examen Neurológico de Hammersmith.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 17." 
    },
    {
        id: 11, 
        question: "En Parálisis Cerebral espástica bilateral o diplejía, ¿cuál es la combinación de patrones observados en la evaluación de movimientos generales antes de los 5 meses?", 
        options: ["Movimientos fidgety y simétricos", "Movimientos circulares y monótonos", "Movimientos cramped-synchronized y ausencia de fidgety", "Movimientos de pobre repertorio y marcha automática"], 
        answer: 2, 
        justification: "Justificación: El patrón de movimientos rígidos, espasmódicos y sincronizados (en bloque), aunado a la falta de movimientos \"fidgety\", es altamente sugestivo de afectación de la vía piramidal de forma bilateral. De acuerdo GPC de Parálisis Cerebral en Lactantes, este hallazgo predice la aparición de rigidez de miembros pélvicos.<br><br>Perla ENARM: \"En la diplejía espástica o bilateral se presenta movimientos generales de cramped-synchronized, ausencia de fidgety y una exploración neurológica anormal.\"<br><br>Análisis de Distractores: La opción A describe un desarrollo motor normal. La opción B es un patrón de movimientos reportado específicamente para la variante disquinética. La opción D menciona reflejos del recién nacido que no definen la diplejía espástica bilateral en esta evaluación.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 18." 
    },
    {
        id: 12, 
        question: "En Parálisis Cerebral hemipléjica unilateral, ¿a partir de qué mes postérmino suele observarse clínicamente la asimetría de los movimientos segmentarios en la evaluación general de movimientos?", 
        options: ["Primer mes", "Segundo a tercer mes", "Quinto mes", "Noveno mes"], 
        answer: 1, 
        justification: "Justificación: En el daño hemisférico unilateral, los movimientos pequeños de dedos y muñecas disminuyen en el lado afectado conforme progresa la mielinización. De acuerdo GPC de Parálisis Cerebral en Lactantes, el primer signo de alerta asimétrico no debe buscarse al nacimiento sino durante la transición del primer trimestre de vida.<br><br>Perla ENARM: \"El primer signo de asimetría, son los movimientos segmentarios, que se ven reducidos o ausentes en el lado contralateral a la lesión. Esta asimetría se encuentra presente a partir del segundo y tercer mes postérmino.\"<br><br>Análisis de Distractores: Las opciones A y C se alejan de la ventana temporal idónea de observación del desarrollo de la motilidad segmentaria fina. La opción D corresponde al hito macro de la falta de sedestación independiente, no a la motilidad segmentaria fina.", 
        source: "GPC-DIF-332-18, Evaluación diagnóstica de parálisis cerebral en lactantes, 2018, Sección Evidencias y Recomendaciones, Página 18." 
    },
    {
        id: 13,

        justification: "Justificación: A diferencia de la diplejía espástica, la cuadriplejía involucra severamente tanto la sustancia blanca periventricular como estructuras de la sustancia gris por injurias globales. De acuerdo GPC de Parálisis Cerebral en Lactantes, este hallazgo estructural de neuroimagen se asocia con un compromiso motor total y mayor discapacidad cognitiva.<br><br>Perla ENARM: \"En cuadriplejia espástica: lesión de la sustancia gris (34%), malformaciones (16%), leucomalacia periventricular quística (GIII) con ausencia de la mielinización y lesión severa de la sustancia blanca con o sin lesión de la sustancia gris nuclear (ganglios basales).\"<br><br>Análisis de Distractores: La opción A es característica de variantes atáxicas puras. La opción C es típica de la hemiplejía espástica unilateral. La opción D no define el hallazgo de daño estructural crónico intraparenquimatoso reportado para la cuadriplejía espástica.",

                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('33218Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('33218LastQId', currentQuestionId);
                else localStorage.removeItem('33218LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('33218Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
