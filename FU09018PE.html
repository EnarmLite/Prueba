    <script>
        const questionsData = [
    {
        id: 1, 
        question: "En un paciente pediátrico con quemaduras, ¿cuál es el instrumento clínico estandarizado de primera elección para calcular con precisión la superficie corporal afectada?", 
        options: ["Fórmula de Parkland", "Regla de los nueves", "Diagrama de Lund y Browder", "Índice de severidad"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, los cambios en la proporción corporal que ocurren durante el crecimiento (como el predominio cefálico en lactantes) inutilizan las reglas anatómicas estáticas diseñadas para adultos. El uso de diagramas dinámicos previene errores masivos en la reanimación hídrica.<br><br>Perla ENARM: \"Se recomienda utilizar escalas de evaluación clínica para valorar la extensión y profundidad de la quemadura (Lund y Browder)\".<br><br>Análisis de Distractores: La regla de los nueves (B) es inexacta en menores de 15 años por la desproporción anatómica. La fórmula de Parkland (A) es un cálculo de volumen de líquidos, no una escala de medición topográfica. El índice de severidad (D) no es el estándar inicial validado para medir extensión corporal.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Diagnóstico, Página 21." 
    },
    {
        id: 2, 
        question: "En la epidemiología de las quemaduras térmicas en pediatría, ¿en qué grupo poblacional es estadísticamente más frecuente la lesión profunda por fuego directo?", 
        options: ["Mujeres adolescentes", "Preescolares masculinos", "Lactantes femeninas", "Varones escolares"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, la incidencia etiológica está fragmentada por género y roles sociodemográficos; mientras que la electricidad afecta predominantemente a los varones y la escaldadura a los preescolares, el fuego directo incide con mayor prevalencia y letalidad en el género femenino a partir de la pubertad.<br><br>Perla ENARM: \"Se ha visto que en hombres es más frecuente la lesión por electricidad y en mujeres por fuego sobretodo en adolescentes\".<br><br>Análisis de Distractores: Los preescolares masculinos (B) y lactantes (C) sufren mayoritariamente quemaduras por escaldadura (líquidos calientes en la cocina). Los varones escolares (D) tienen picos de incidencia relacionados a trauma eléctrico por exposición a exteriores o cohetes, no predominantemente por fuego directo en comparación con el género femenino.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Justificación, Página 13." 
    },
    {
        id: 3, 
        question: "En un paciente con quemaduras térmicas extensas, ¿cuál es la indicación clínica absoluta para iniciar monitoreo hemodinámico invasivo en lugar del control no invasivo de uresis?", 
        options: ["Superficie quemada >20%", "Extremos anatómicos afectados", "Quemadura por lesión eléctrica", "Escaldadura de tercer grado"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, la evaluación del estado de choque habitualmente se guía con la uresis horaria. Sin embargo, en escenarios donde el daño vascular sistémico, la mioglobinuria masiva o la falla multiorgánica alteran las presiones de llenado, se requiere invasión directa (ej. catéter venoso central o línea arterial).<br><br>Perla ENARM: \"Se recomienda considerar el monitoreo invasivo en niños y adolescentes quemados que presenten quemadura por inhalación, eléctricas o con comorbilidades o en condición crítica\".<br><br>Análisis de Distractores: Una superficie quemada >20% (A) o las escaldaduras severas (D) justifican la reanimación con cristaloides guiada por uresis, pero no obligan por sí solas al monitoreo invasivo de inicio. La afectación de extremos anatómicos (B) dicta la referencia a tercer nivel, no la colocación de un catéter intracardíaco o arterial.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 23." 
    },
    {
        id: 4, 
        question: "Durante la fase aguda de reanimación hídrica por quemaduras mayores, ¿cuál es el escenario específico que justifica añadir albúmina intravenosa a los cristaloides?", 
        options: ["Sospecha de traslocación bacteriana", "Falla de respuesta a cristaloides", "Prevención de nefrotoxicidad", "Quemaduras de primer grado"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, el uso rutinario inicial de coloides incrementa complicaciones pulmonares (fuga capilar de proteínas). Su uso se reserva estrictamente como estrategia de rescate (fluid creep) cuando el volumen masivo de cristaloides no logra perfundir adecuadamente el lecho esplácnico y renal.<br><br>Perla ENARM: \"Se sugiere la utilización de soluciones cristaloides con albúmina en niños y adolescentes que no responden a la restitución hídrica solo con cristaloides medida por la uresis/kg/hora\".<br><br>Análisis de Distractores: La traslocación bacteriana (A) se previene con nutrición enteral temprana, no con albúmina. La nefrotoxicidad (C) se previene manteniendo una uresis meta y evitando fármacos nefrotóxicos. Las quemaduras de primer grado (D) ni siquiera ameritan restitución intravenosa agresiva con fórmulas estandarizadas.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 26." 
    },
    {
        id: 5, 
        question: "En el tratamiento farmacológico inicial de quemaduras superficiales, ¿cuál es el analgésico de primera línea recomendado para controlar un puntaje de dolor leve?", 
        options: ["Ketorolaco intravenoso", "Tramadol en gotas", "Paracetamol sistémico", "Ibuprofeno oral"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, el manejo del dolor debe ser escalonado según las escalas pediátricas, asegurando un control basal sin precipitar falla renal o daño gástrico en un paciente fisiológicamente estresado y con hipovolemia relativa.<br><br>Perla ENARM: \"Se recomienda utilizar para dolor leve paracetamol\".<br><br>Análisis de Distractores: El tramadol (B) es un opioide débil reservado para escalones de dolor moderado a severo. El ketorolaco (A) y el ibuprofeno (D) pertenecen a la familia de los AINEs, los cuales están estrictamente contraindicados como primera línea en pacientes con quemaduras por su toxicidad.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 27." 
    },
    {
        id: 6, 
        question: "En el abordaje quirúrgico de quemaduras de espesor total masivas, ¿a partir de qué porcentaje de superficie corporal afectada se indica emplear injertos con técnica de Meek?", 
        options: [">20%", ">40%", ">60%", ">80%"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, la técnica de Meek permite una expansión exponencial del escaso tejido autólogo disponible, logrando mallas de microinjertos con tasas de crecimiento de 1:9, reservándose para los grandes quemados sin suficientes zonas donadoras intactas.<br><br>Perla ENARM: \"Se sugiere utilizar injertos con expansión tisular con técnica de Meek en niños y adolescentes con extensiones de quemaduras de espesor total mayor al 60% de superficie corporal\".<br><br>Análisis de Distractores: El punto de corte del >20% (A) rige el inicio de reanimación hídrica. El corte >40% (B) justifica el uso de piel de cadáver como cobertura biológica temporal. Esperar a un >80% (D) es un límite inventado que excluye a pacientes con el 65% o 70% que se benefician vitalmente de este procedimiento.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 40." 
    },
    {
        id: 7, 
        question: "Durante la escisión quirúrgica tangencial de quemaduras en la edad pediátrica, ¿qué agente farmacológico se sugiere utilizar activamente para el control del sangrado transoperatorio?", 
        options: ["Trombina en spray", "Ácido tranexámico sistémico", "Sulfato de protamina", "Infusión de crioprecipitados"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, la remoción mecánica de la escara genera una hemorragia capilar y venosa difusa severa. El control hemostático tópico maximiza la visualización del lecho viable y previene el choque hemorrágico sin alterar sistémicamente la cascada de coagulación.<br><br>Perla ENARM: \"Se sugiere utilizar los diversos métodos para control del sangrado transoperatorio, tales como hidrodisección selectiva, trombina en spray\".<br><br>Análisis de Distractores: El ácido tranexámico (B), los crioprecipitados (D) y el sulfato de protamina (C) son medidas sistémicas hemostáticas o reversores de heparina, sin indicación normativa para la aplicación tópica local durante el desbridamiento de quemaduras.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 44." 
    },
    {
        id: 8, 
        question: "En el manejo integral del paciente pediátrico con quemaduras, ¿en qué etapa de la evolución clínica se debe instaurar el programa de rehabilitación física?", 
        options: ["Posterior al alta hospitalaria", "En la fase aguda temprana", "Hasta lograr epitelización total", "Después del injerto definitivo"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, el riesgo de contracturas articulares limitantes inicia desde el primer día por el edema intersticial y el dolor posicional. Posponer la fisioterapia condena al paciente a secuelas funcionales irreversibles.<br><br>Perla ENARM: \"Se recomienda iniciar rehabilitación física temprana e individualizada en los pacientes quemados\".<br><br>Análisis de Distractores: Esperar al alta (A), a la epitelización (C) o después del injerto (D) retrasa semanas la movilización articular, promoviendo rigidez severa, anquilosis y cicatrización retráctil que posteriormente requerirán liberaciones quirúrgicas complejas.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 47." 
    },
    {
        id: 9, 
        question: "En el postoperatorio de un paciente con quemaduras severas tratadas con microinjertos autólogos, ¿en qué intervalo de tiempo debe realizarse obligatoriamente la primera revisión del lecho?", 
        options: ["A las 24 horas", "Entre los 3 y 4 días", "Entre los 5 y 7 días", "Posterior a los 10 días"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, destapar precozmente un injerto rompe mecánicamente la red inicial de fibrina y neovascularización que lo ancla al lecho, provocando su pérdida total; mientras que abandonarlo sin vigilancia predispone a lisis infecciosa.<br><br>Perla ENARM: \"Se sugiere revisión de los microinjertos en forma inicial a los 5 a 7 días de acuerdo a condiciones clínicas del paciente y posteriormente cada 72 horas\".<br><br>Análisis de Distractores: Intervenir a las 24 horas (A) o los 3-4 días (B) moviliza el injerto inmaduro provocando desprendimiento traumático. Retrasar la revisión a los 10 días (D) oculta complicaciones como hematomas subyacentes o infección purulenta, perdiendo la ventana de rescate.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 40." 
    },
    {
        id: 10, 
        question: "En el manejo local de quemaduras profundas que no son candidatas a injerto cutáneo de forma inmediata, ¿qué insumo se recomienda utilizar para preparar temporalmente el lecho cruento?", 
        options: ["Apósitos biológicos", "Gasas secas estériles", "Pomada de nitrofurazona", "Vendajes elásticos compresivos"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, la exposición prolongada del tejido celular subcutáneo genera desecación, muerte celular y proliferación de biopelículas bacterianas. Colocar una barrera biológica promueve la angiogénesis para optimizar el terreno antes del autoinjerto definitivo.<br><br>Perla ENARM: \"Se recomienda considerar que en las quemaduras profundas o de tercer grado los apósitos son de utilidad para preparar el lecho de la herida, o temporal cuando no se cuente con una cobertura definitiva\".<br><br>Análisis de Distractores: Las gasas secas (B) son altamente citotóxicas, adhiriéndose al lecho y arrancando el tejido de granulación en cada curación. La nitrofurazona (C) no confiere barrera biológica ni cobertura funcional. Los vendajes compresivos (D) son útiles para presoterapia tardía, no como preparación de una úlcera cruenta profunda.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 34." 
    },
    {
        id: 11, 
        question: "Para abatir la elevada morbimortalidad por quemaduras en la población pediátrica, ¿en qué área de atención primaria se debe sistematizar permanentemente la evaluación de factores de riesgo?", 
        options: ["Módulos de vacunación universal", "Triage de urgencias pediátricas", "Consulta médica de niño sano", "Trabajo social intrahospitalario"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, la prevención primaria requiere un escrutinio longitudinal y transversal de los hábitos intrafamiliares. Intervenir rutinariamente en el control del crecimiento impacta el riesgo real del entorno doméstico.<br><br>Perla ENARM: \"En la prevención de quemaduras, el seguimiento en la consulta de niño sano debe establecer un programa individualizado de disminución de factores de riesgo\".<br><br>Análisis de Distractores: El triage de urgencias (B) y trabajo social (D) actúan cuando el paciente ya sufrió el trauma térmico, es decir, fracasó la prevención primaria. Los módulos de vacunación (A) son puntos de contacto fugaces que no permiten el abordaje preventivo completo del binomio madre-hijo delineado en el flujograma de la guía.",

        justification: "Justificación: De acuerdo a la GPC de Prevención de quemaduras pediátricas, bombardear preventivamente con antibióticos destruye la flora simbiótica, predisponiendo a colonizaciones fúngicas letales o sobreinfecciones por gérmenes panresistentes. Solo la comprobación microbiológica o signos francos e inequívocos de infección invasiva autorizan la escalada terapéutica sistémica.<br><br>Perla ENARM: \"Se recomienda instalar terapia antimicrobiana en base a datos clínicos específicos de infección o cultivo positivo\".<br><br>Análisis de Distractores: Los esquemas empíricos (C) o profilácticos (B) sin sustento de cultivo están fuertemente contraindicados (aumentan la morbimortalidad). La sulfadiazina (A) es un antiséptico tópico que jamás se administra vía intravenosa sistémica.",

    {
        id: 29,

        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención de quemaduras pediátricas, el paciente gran quemado es un paciente de trauma mayor (ATLS). No debe priorizarse el manejo local estético si esto implica desestabilizar térmicamente (hipotermia por exposición a líquidos) o hemodinámicamente a un paciente en estado de choque. Primero la reanimación sistémica, luego la curación de la piel.<br><br>Perla ENARM: \"Se recomienda realizar aseo de las lesiones en cuanto las condiciones clínicas lo permitan\".<br><br>Análisis de Distractores: Hacerlo en el sitio del accidente (B) sin insumos estériles promueve contaminación e hipotermia fulminante. Retrasarlo ciegamente 24 horas (A) permite el arraigo de biopelículas bacterianas. Exigir que sea estrictamente en quirófano (D) retrasa la descontaminación de quemaduras leves o moderadas que pueden curarse de forma segura en salas de procedimientos de urgencias.", 
        source: "SS-090-18, Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes, 2018, Tratamiento, Página 30." 
    },
    {
        id: 30,

    {

        options: ["Disminuir la temperatura del calentador a 40°C", "Aislar a los niños de actividades de riesgo como cocinar", "Promover el uso exclusivo del horno de microondas", "Instalar alarmas térmicas en todas las habitaciones"],

        options: ["Evaluar la intensidad del dolor en base a una escala", "Calcular la superficie corporal con Lund y Browder", "Iniciar con paracetamol a dosis máxima ponderal", "Monitorizar el índice de choque prehospitalario"],

        options: ["Suspender temporalmente las movilizaciones", "Limitarse a termoterapia pasiva superficial", "Sustituir ejercicios físicos con prendas elásticas", "Continuar con el programa de rehabilitación en casa"],

        options: ["Alta inmediata tras neutralización tópica", "Referencia oportuna a un centro de quemados", "Ingreso para vigilancia a sala de pediatría general", "Aplicación rutinaria de antídotos sistémicos intralesionales"],

        let userProgress = {};

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadProgress();
            
            let lastQId = null;
            try { lastQId = localStorage.getItem('09018LastQId'); } catch (e) {}
            displayQuestion(lastQId ? parseInt(lastQId) : null);
            setupEventListeners();

        function setupEventListeners() {
            document.getElementById('module-search').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.q-box-item').forEach(box => {
                    const id = parseInt(box.dataset.id);
                    const qObj = questionsData.find(q => q.id === id);
                    if(!qObj) return;
                    const matchText = qObj.question.toLowerCase().includes(term);
                    box.style.display = (term === '' || matchText || id.toString() === term) ? 'flex' : 'none';
                });
            });

            document.getElementById('cancel-reset').addEventListener('click', () => {
                const m = document.getElementById('reset-modal'); m.querySelector('div').classList.add('scale-95');
                setTimeout(()=>m.classList.add('hidden'),300);
            });
            document.getElementById('confirm-reset').addEventListener('click', () => {
                localStorage.removeItem('09018Progress');
                localStorage.removeItem('09018LastQId');
                window.location.reload();
            });
            
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const overlay = document.getElementById('sidebar-overlay');
            const dashboardBtn = document.getElementById('dashboard-button');
            
            menuToggle.addEventListener('click', () => {
                if (window.innerWidth >= 1024) {
                    sidebar.classList.toggle('lg:translate-x-0');
                    mainContent.classList.toggle('lg:ml-80');
                    
                    // Reposicionar el botón del tablero dependiendo de si el sidebar está abierto
                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    sidebar.classList.toggle('-translate-x-full');
                    overlay.classList.toggle('hidden');
                }
            });
            
            overlay.addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            });

            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
        }

        // Navegar a pregunta anterior
        function goToPreviousQuestion(currentId) {
            const currentIndex = questionsData.findIndex(q => q.id === currentId);
            if (currentIndex > 0) {
                displayQuestion(questionsData[currentIndex - 1].id);
            } else {
                displayQuestion(null);
            }
        }

        function getQBoxClass(qId, isActive) {
            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-sm cursor-pointer transition-all select-none border ";
            
            if (isActive) base += "ring-4 ring-blue-500 shadow-md z-10 border-blue-500 dark:border-blue-400 ";

            const state = userProgress[qId];
            if (!state || !state.answered) {
                return base + "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700 dark:hover:bg-slate-700";
            } else if (state.isCorrect) {
                return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
            } else {
                return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
            }
        }

        function renderGridHTML(isActiveIdContext = null) {
            return questionsData.map(q => 
                `<div class="${getQBoxClass(q.id, q.id === isActiveIdContext)}" data-id="${q.id}" onclick="displayQuestion(${q.id})">${q.id}</div>`
            ).join('');
        }

        function renderSidebarGrid() {
            document.getElementById('sidebar-q-grid').innerHTML = renderGridHTML(currentQuestionId);
        }

            const isAllCompleted = ans === total && total > 0;
            
            let firstUncompletedId = questionsData.find(q => !userProgress[q.id]?.answered)?.id;
            
            let actionBtn = isAllCompleted 
                ? `<button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full md:w-auto bg-white/20 hover:bg-white/30 text-white border border-white/30 px-8 py-3 rounded-xl font-bold transition-colors shadow-sm">Reiniciar Examen</button>`
                : `<button onclick="displayQuestion(${firstUncompletedId})" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-blue-600 hover:to-cyan-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-blue-900/30 transition-transform hover:-translate-y-0.5">Continuar Aprendiendo</button>`;

            let blur1 = isAllCompleted ? "bg-emerald-500/30" : "bg-cyan-900/40";
            let blur2 = isAllCompleted ? "bg-teal-500/30" : "bg-cyan-900/30";
            let badgeText = isAllCompleted ? "¡100% Completado! ENARM 2026" : "ENARM 2026";
            let badgeClass = isAllCompleted ? "bg-emerald-500/20 border-emerald-500/30 text-emerald-300" : "bg-white/10 border-white/10 text-white";
            let titleText = isAllCompleted ? "¡Examen Finalizado!" : "PEDIATRÍA";
            let descText = isAllCompleted 
                ? "Has completado con éxito todas las preguntas. Revisa tus respuestas correctas/incorrectas en el tablero." 
                : "SS-090-18 • Prevención, diagnóstico y tratamiento de quemaduras en niños y adolescentes";

            displayArea.innerHTML = `
                <div class="flex flex-col gap-6 max-w-6xl mx-auto lg:mt-0">
                    
                    <!-- BREADCRUMB (Centrado en móvil, no hay botones flotantes interrumpiendo) -->
                    <div class="flex justify-center sm:justify-start items-center mb-1 mt-4 lg:mt-0">
                        <a href="login.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 font-semibold transition-colors text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                            </svg>
                            Regresar al Panel
                        </a>
                    </div>

                    <!-- HERO DYNAMIC -->
                    <div class="relative bg-slate-900 dark:bg-slate-950 rounded-[2rem] p-8 md:p-12 shadow-xl text-white overflow-hidden border border-slate-800 transition-colors duration-500 ${isAllCompleted ? 'ring-2 ring-emerald-500/50' : ''}">
                        <div class="absolute top-0 right-0 w-64 h-64 ${blur1} rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none transition-colors duration-500"></div>
                        <div class="absolute bottom-0 left-0 w-48 h-48 ${blur2} rounded-full blur-3xl -ml-10 -mb-10 pointer-events-none transition-colors duration-500"></div>
                        
                        <div class="relative z-10 flex flex-col lg:flex-row justify-between items-center gap-8">
                            <div class="text-center lg:text-left">
                                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4 border ${badgeClass} transition-colors duration-500">
                                    ${badgeText}
                                </span>
                                <h1 class="text-3xl md:text-4xl lg:text-4xl font-extrabold tracking-tight mb-3 transition-colors duration-500 ${isAllCompleted ? 'text-emerald-400 drop-shadow-md' : ''}">${titleText}</h1>
                                <p class="text-slate-300 text-base md:text-lg font-medium max-w-lg mx-auto lg:mx-0 transition-colors duration-500">${descText}</p>
                                
                                <div class="mt-8 flex justify-center lg:justify-start">
                                    ${actionBtn}
                                </div>
                            </div>
                            
                            <!-- Tarjeta de Estadísticas Modificada -->
                            <div class="flex-shrink-0 bg-slate-800/50 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 flex flex-col sm:flex-row items-center shadow-2xl w-full lg:max-w-md">
                                <div class="grid grid-cols-3 gap-2 sm:gap-4 divide-x divide-white/20 w-full text-center">
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Respondidas</p>
                                        <p class="text-2xl sm:text-3xl font-black">${ans}<span class="text-xs sm:text-sm text-slate-500">/${total}</span></p>
                                    </div>
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Correctas</p>
                                        <p class="text-2xl sm:text-3xl font-black text-emerald-300">${correct}</p>
                                    </div>
                                    <div class="px-2">
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Rendimiento</p>
                                        <p class="text-2xl sm:text-3xl font-black text-yellow-300">${successRate}%</p>
                                        <p class="text-[8px] text-slate-400 mt-1 leading-tight">Aciertos vs Respondidas</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLERO VISIBLE Y SCROLLABLE -->
                    <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-slate-800 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('09018Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('09018LastQId', currentQuestionId);
                else localStorage.removeItem('09018LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('09018Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

</body>
</html>
