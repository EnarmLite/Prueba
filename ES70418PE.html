    <script>
        const questionsData = [
    {
        id: 1, 
        question: "En el recién nacido prematuro, ¿cuál es la dosis inicial recomendada para la alimentación enteral trófica?", 
        options: ["5 a 10 ml/kg/día", "10 a 20 ml/kg/día", "20 a 30 ml/kg/día", "30 a 40 ml/kg/día"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la alimentación trófica con leche materna o calostro favorece la función intestinal, mejora el crecimiento de enterocitos e induce hormonas tróficas que previenen la isquemia de la mucosa.<br><br>Perla ENARM: \"Se recomienda iniciar la alimentación trófica con 10-20 ml/kg día con leche materna o calostro, tan pronto el paciente estabilice su función cardiorrespiratoria y hemodinámica.\"<br><br>Análisis de Distractores: Las dosis de 5 a 10 ml/kg/día son infraterapéuticas para estimular adecuadamente el trofismo de las microvellosidades. Volúmenes de 20 a 40 ml/kg/día exceden el límite de seguridad inicial y aumentan el estrés metabólico antes de comprobar la tolerancia enteral.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Lactancia materna en terapia intensiva, Página 26." 
    },
    {
        id: 2, 
        question: "En el paciente lactante con fenilcetonuria, ¿cuál es la meta sérica de fenilalanina al alimentarlo con leche materna?", 
        options: ["1 a 3 mg/dl", "4 a 8 mg/dl", "2 a 6 mg/dl", "5 a 10 mg/dl"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la leche materna es la fuente primaria obligada de fenilalanina, un aminoácido esegencial indispensable para el neurodesarrollo. La dosificación debe ser estricta para evitar la deficiencia sin llegar al umbral de toxicidad.<br><br>Perla ENARM: \"El objetivo nutricional de la leche materna en los niños con fenilcetonuria es mantener los niveles de fenilalanina entre 2 y 6 mg/dl (120 y 360 umol/L).\"<br><br>Análisis de Distractores: Niveles menores de 2 mg/dl causan catabolismo severo y déficit mielínico. Valores mayores de 6 mg/dl (B y D) sobrepasan el margen de seguridad metabólica, propiciando daño neuronal directo y disminución irreversible del coeficiente intelectual.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Errores innatos del metabolismo, Página 23." 
    },
    {
        id: 3, 
        question: "¿Cuál de los siguientes errores innatos del metabolismo representa una contraindicación absoluta para administrar leche humana?", 
        options: ["Hipotiroidismo congénito", "Fibrosis quística", "Fenilcetonuria", "Galactosemia clásica"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la deficiencia de la enzima galactosa-1-fosfato uridiltransferasa impide metabolizar la galactosa obtenida de la lactosa (carbohidrato principal de la leche humana). La exposición genera toxicidad hepática fulminante, cataratas y sepsis por enterobacterias.<br><br>Perla ENARM: \"No se indica la leche materna ni otra en pacientes con galactosemia clásica. Se necesita una fórmula especial libre de galactosa.\"<br><br>Análisis de Distractores: La fenilcetonuria exige el uso dosificado de leche materna. La fibrosis quística y el hipotiroidismo congénito requieren suplementos enzimáticos u hormonales, pero no contraindican biológicamente la leche humana.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Errores innatos del metabolismo, Página 24." 
    },
    {
        id: 4, 
        question: "En el lactante con alteraciones mecánicas de la succión por anquiloglosia, ¿a qué especialista se debe referir normativamente para el procedimiento correctivo?", 
        options: ["Odontopediatra", "Cirujano maxilofacial", "Otorrinolaringólogo pediatra", "Cirujano pediatra"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la liberación del frenillo lingual expone paquetes vasculares sublinguales de alto riesgo. La norma centraliza esta intervención para evitar hemorragias fatales.<br><br>Perla ENARM: \"Realizar frenotomía, frenuloplastia o frenectomía en niños con anquiloglosia por un otorrinolaringólogo pediatra... No se debe realizar el procedimiento por médicos no entrenados.\"<br><br>Análisis de Distractores: Aunque el maxilofacial y el odontopediatra tienen formación estomatológica, la indicación legal y directa en esta GPC es referir de primera instancia al otorrinolaringólogo pediátrico. El cirujano pediatra general no es el especialista de elección para esta plastia específica.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Alteraciones de la lengua, Página 21." 
    },
    {
        id: 5, 
        question: "Para incrementar el volumen de producción láctea en madres de recién nacidos prematuros, ¿cuál es el fármaco de elección?", 
        options: ["Metoclopramida 10 mg", "Domperidona 10 mg", "Sulpirida 50 mg", "Oxitocina 2 UI"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, ante el estrés de la hospitalización que inhibe la lactogénesis, se utilizan antagonistas dopaminérgicos. La domperidona tiene un perfil de seguridad superior al no atravesar significativamente la barrera hematoencefálica.<br><br>Perla ENARM: \"Para incrementar el volumen de producción láctea en las madres de recién nacidos prematuros después de la primera o segunda semana de vida, se recomienda administrar Domperidona 10 mg vía oral cada 8 hrs por 7 a 14 días.\"<br><br>Análisis de Distractores: La metoclopramida causa efectos extrapiramidales maternos con mayor frecuencia. La sulpirida no es la recomendación normativa de primera línea. La oxitocina intranasal favorece la eyección láctea, pero no induce la hiperprolactinemia sostenida para producir más volumen.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Lactancia materna en el niño prematuro, Página 18." 
    },
    {
        id: 6, 
        question: "¿Cuál es la posición de elección para amamantar a un paciente con labio hendido bilateral?", 
        options: ["Posición de balón", "Posición biológica", "Posición acostada", "Posición sentada a caballo"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la incompetencia anatómica para generar presión negativa se compensa utilizando la gravedad y el contacto frontal, lo que permite a la madre ocluir manualmente el defecto maxilofacial.<br><br>Perla ENARM: \"En el caso de labio hendido bilateral; una posición con el lactante sentado “a caballo” sobre un cojín apoyado en la pierna de la madre, “cara a cara”, puede ser más efectiva que otras posturas.\"<br><br>Análisis de Distractores: La posición de balón (rugby) es útil para niños pretérmino o cesáreas, pero no facilita el taponamiento manual simétrico del labio bilateral. Las posiciones biológica y acostada dificultan el alineamiento y aumentan el riesgo de paso lácteo a la vía aérea.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Labio y paladar hendido, Página 21." 
    },
    {
        id: 7, 
        question: "En el recién nacido con asfixia perinatal o que recibe indometacina, ¿por cuánto tiempo debe diferirse la alimentación enteral?", 
        options: ["12 horas", "24 horas", "48 horas", "72 horas"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, los fármacos vasoconstrictores y la hipoxia sistémica causan isquemia de la mucosa gastrointestinal. Introducir alimento prematuramente eleva dramáticamente el riesgo de enterocolitis.<br><br>Perla ENARM: \"La alimentación enteral debe diferirse por 12 hrs en los recién nacidos con hipoxia intestinal o disminución del flujo intestinal (asfixia, hipotensión, policitemia, exanguinotransfusión o uso de indometacina).\"<br><br>Análisis de Distractores: El tiempo de 24 horas se reserva para el paciente con inestabilidad hemodinámica franca, no solo asfixia aislada. Tiempos de 48 a 72 horas propician atrofia intestinal yatrogénica y retrasan la maduración de las vellosidades.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Paciente de terapia intensiva neonatal, Página 25." 
    },
    {
        id: 8, 
        question: "Para autorizar a una madre como donadora de leche humana, ¿cuál es el panel serológico obligatorio a solicitar?", 
        options: ["Citomegalovirus y Toxoplasma", "Herpes simple y Varicela", "Chagas y Virus linfotrópico", "VIH, Sífilis, Hepatitis B, C"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, estas patologías tienen comprobada transmisión hemática y láctea, siendo letales en receptores prematuros críticamente enfermos. La serología prenatal no es válida por riesgo de seroconversión en el tercer trimestre.<br><br>Perla ENARM: \"Se recomienda un estudio serológico de la donante para descartar infección por VHB, VHC, VIH y sífilis, no siendo suficiente la serología previa al embarazo.\"<br><br>Análisis de Distractores: Citomegalovirus suele inactivarse con la pasteurización y no descarta universalmente a la madre en la fase inicial. Chagas y Virus linfotrópico se solicitan solo en zonas endémicas confirmadas. Herpes simple contraindicación la donación solo si existen lesiones activas visibles en la mama, no por panel serológico.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Criterios de donación de leche humana, Página 29." 
    },
    {
        id: 9, 
        question: "En el recién nacido con displasia broncopulmonar y restricción hídrica, ¿cuál es la densidad energética recomendada al fortificar la leche materna?", 
        options: ["20 a 24 kcal/onza", "26 a 30 kcal/onza", "22 a 26 kcal/onza", "24 a 28 kcal/onza"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, los pacientes neumópatas o cardiópatas tienen requerimientos calóricos incrementados (estado hipercatabólico), pero no toleran volúmenes hídricos convencionales, lo que obliga a hiperconcentrar el alimento.<br><br>Perla ENARM: \"En los recién nacidos con cardiopatía congénita cianógena y displasia broncopulmonar con restricción hídrica, se recomienda incrementar la densidad energética de la leche materna de 26 a 30 kcal/onza.\"<br><br>Análisis de Distractores: Las concentraciones de 20 a 24 kcal/onza son el estándar para el mantenimiento del prematuro no complicado, pero resultan insuficientes calóricamente para un paciente con metabolismo basal elevado y bajo volumen intravascular permitido.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Terapia intensiva neonatal, Página 26." 
    },
    {
        id: 10, 
        question: "En infantes con peso menor a 1500 gramos, ¿qué complicación previene directamente el uso prioritario de leche humana donada pasteurizada?", 
        options: ["Enterocolitis necrotizante", "Retinopatía del prematuro", "Sepsis neonatal temprana", "Displasia broncopulmonar"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, las inmunoglobulinas y la lactoferrina presentes modulan el microbioma, reducen la inflamación local y favorecen el cierre de las uniones intercelulares del enterocito isquémico.<br><br>Perla ENARM: \"Se recomienda el uso de leche humana en infantes con muy bajo peso al nacer para prevenir la enterocolitis necrotizante.\"<br><br>Análisis de Distractores: La retinopatía del prematuro responde al estrés oxidativo por oxígeno suplementario. La sepsis neonatal temprana es por transmisión vertical vaginal, no alimentaria. La displasia broncopulmonar es modulada secundariamente, pero la meta profiláctica principal dictada en Bancos de Leche es la prevención gastrointestinal.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Donación de leche humana, Página 31." 
    },
    {
        id: 11, 
        question: "¿Cuál es el procedimiento normado para el calentamiento de la leche humana extraída en el ámbito intrahospitalario?", 
        options: ["Horno de microondas", "Calentador radiante", "Baño maría 35 °C", "Incubadora a 37 °C"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la desnaturalización de componentes inmunológicos termolábiles exige un incremento térmico suave y uniforme que evite la destrucción proteica.<br><br>Perla ENARM: \"Calentar la leche en los frascos en baño maría a 35 ºC. No realizar el calentamiento de leche en microondas por el peligro de quemaduras.\"<br><br>Análisis de Distractores: El horno de microondas provoca \"islas de calor\" asimétricas con alto riesgo de perforación esofágica. El calentador radiante y la incubadora son equipos biomédicos de control térmico cutáneo, no de preparación alimentaria estéril.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Área de preparación y distribución, Página 35." 
    },
    {
        id: 12, 
        question: "¿Por cuánto tiempo se debe diferir la donación de leche humana tras la administración materna de la vacuna contra rubéola?", 
        options: ["1 semana", "4 semanas", "2 semanas", "6 semanas"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, las vacunas de virus vivos atenuados tienen comprobado el paso y excreción mediante el epitelio mamario hacia la leche, representando un riesgo de infección iatrogénica grave para neonatos críticos inmunodeprimidos.<br><br>Perla ENARM: \"Se recomienda no dar leche humana durante 4 semanas tras la administración de vacunas de virus vivos atenuados.\"<br><br>Análisis de Distractores: Tiempos de 1 a 2 semanas no garantizan el aclaramiento viral sistémico materno. Un margen de 6 semanas excede los tiempos biológicos comprobados y restringe innecesariamente la provisión de alimento en bancos de leche.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Criterios de donación de leche humana, Página 29." 
    },
    {
        id: 13, 
        question: "En el recién nacido que cursó con inestabilidad hemodinámica global, ¿por cuánto tiempo debe diferirse la alimentación tras estabilizarlo?", 
        options: ["6 horas", "12 horas", "48 horas", "24 horas"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, el choque redistribuye dramáticamente el gasto cardíaco sacrificando el lecho mesentérico. Forzar la demanda metabólica absortiva en un intestino recién isquémico sin periodo ventana es catastrófico.<br><br>Perla ENARM: \"La alimentación en el recién nacido con inestabilidad hemodinámica debe diferirse por 24 hrs, después de haber logrado estabilizarlos.\"<br><br>Análisis de Distractores: El diferimiento de 12 horas es específico para hipoxia focal transitoria o por medicamentos, no por choque franco. Esperar 48 horas prolonga el catabolismo y aumenta el riesgo de infecciones asociadas a nutrición parenteral total.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Terapia intensiva neonatal, Página 25." 
    },
    {
        id: 14, 
        question: "En el área de preparación de leche humana, ¿cuál es la temperatura ambiental máxima permitida para evitar proliferación bacteriana?", 
        options: ["20 °C", "25 °C", "30 °C", "15 °C"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la normativa de seguridad e inocuidad alimentaria (HACCP) exige la ralentización estricta del crecimiento de enterobacterias patógenas, exigiendo climatización controlada en la central de mezclas.<br><br>Perla ENARM: \"Controlar la temperatura del área de preparación, la cual debe ser menor o igual a 20 ºC.\"<br><br>Análisis de Distractores: Temperaturas de 25 °C y 30 °C caen en la ventana de crecimiento logarítmico para microorganismos como Cronobacter sakazakii. Una meta de 15 °C es innecesaria y no factible para las condiciones térmicas operativas del personal humano.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Área de preparación y distribución, Página 34." 
    },
    {
        id: 15, 
        question: "En el recién nacido prematuro, ¿cómo se clasifica el patrón caracterizado por 2 a 3 movimientos de succión y reposos prolongados?", 
        options: ["Patrón inmaduro", "Patrón inefectivo", "Patrón en transición", "Patrón maduro"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la madurez de la deglución está íntimamente ligada a la edad gestacional. A partir de la semana 34, el neonato inicia el sellado labial pero se fatiga rápidamente, indicando el inicio seguro de entrenamiento oral.<br><br>Perla ENARM: \"Transición: Mejor coordinación de movimientos... Dos a tres movimientos de succión y periodos prolongados de reposo.\"<br><br>Análisis de Distractores: El patrón inmaduro carece de todo sellado. El patrón maduro se presenta como salvas rítmicas de 6 a 10 movimientos con micropausas. El término \"inefectivo\" no corresponde a la clasificación técnica madurativa de esta patología clínica.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Lactancia materna en el niño prematuro, Página 18." 
    },
    {
        id: 16, 
        question: "¿Cuál es el tiempo máximo que puede almacenarse en el refrigerador clínico la leche humana cruda antes de ser pasteurizada?", 
        options: ["24 horas", "48 horas", "72 horas", "12 horas"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, más allá del primer día a temperatura de refrigerador convencional, el nivel de contaminación inicial logarítmica comienza a acidificar la leche y degradar las lipasas.<br><br>Perla ENARM: \"La leche cruda puede almacenarse en frigorífico, antes de pasteurizar, un máximo de 24 hrs.\"<br><br>Análisis de Distractores: Tiempos de 48 y 72 horas en frigorífico (sin congelar) cruzan el punto crítico de control y alteran la acidez titulable obligando a desechar el alimento. El margen de 12 horas es seguro pero más restrictivo de lo que marca la tolerancia máxima normativa.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad, 2018, Puntos críticos de control en almacenamiento, Página 35."

    {
        id: 17, 
        question: "Para evitar la proliferación de Enterobacterias, ¿cuál es la temperatura máxima a la que se debe mantener el refrigerador de leche humana?", 
        options: ["2 °C", "7 °C", "10 °C", "4 °C"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de lactancia en niño enfermo, la correcta cadena de frío inactiva los patógenos responsables de sepsis yatrógenas intrahospitalarias. Cualquier exceso térmico sostenido activa la fase de replicación bacteriana.<br><br>Perla ENARM: \"Mantener los refrigeradores a 4 ºC, lo que inactiva tanto E. Sakazakii como otras enterobacterias.\"<br><br>Análisis de Distractores: Una temperatura de 7 °C o 10 °C está fuera del protocolo de inhibición de Sakazakii establecido en puntos críticos. 2 °C es una temperatura útil, pero el límite normativo máximo que debes recordar para el estándar nacional de supervisión es 4 °C.",

    {
        id: 18,

    {

        question: "Durante la distribución intrahospitalaria, ¿cuál es el tiempo límite permitido desde que la leche sale del refrigerador hasta su consumo final?", 
        options: ["30 minutos", "1 hora", "2 horas", "4 horas"],

    {
        id: 21, 
        question: "En el recién nacido de muy bajo peso al nacer, ¿cuál es el tiempo recomendado para suministrar la leche por técnica forzada con sonda por gravedad?", 
        options: ["5 a 10 min", "15 a 20 min", "30 a 45 min", "60 min"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC, en prematuros extremos que requieren suplementación enteral obligatoria pero cuyo tracto gastrointestinal no soporta sobrecargas volumétricas rápidas, la infusión debe ser controlada. No se necesita forzosamente equipo electrónico si se respeta el margen de infusión fisiológico.<br><br>Perla ENARM: \"En los recién nacidos de muy bajo peso al nacer se recomienda suministrar la leche por técnica forzada (sonda) por gravedad en un lapso de 15 a 20 min, no es necesario el uso de bomba de infusión.\"<br><br>Análisis de Distractores: Tiempos de 5 a 10 min producen distensión gástrica abrupta, reflujo y riesgo de broncoaspiración. Infusiones de 30 a 45 min o 60 min sin bomba prolongan innecesariamente el evento alimentario, promoviendo separación de la grasa láctea y pérdida de nutrientes en las paredes de la sonda.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Lactancia materna en el niño prematuro, Página 41."

    {
        id: 22, 
        question: "En el recién nacido prematuro, ¿a partir de qué edad gestacional y peso mínimo se recomienda iniciar la alimentación con técnica mixta para alcanzar un patrón maduro?", 
        options: ["32 semanas y 1000 g", "34 semanas y 1500 g", "36 semanas y 2000 g", "30 semanas y 1200 g"],

        justification: "Justificación: De acuerdo a la GPC, la coordinación anatómica fina entre deglución, respiración y movimientos mandibulares se consolida en este umbral del neurodesarrollo intrauterino, marcando el momento seguro para iniciar estímulos orales intermitentes.<br><br>Perla ENARM: \"Cuando el recién nacido tiene más de 34 semanas de gestación, peso mayor a 1500 gr y un patrón de succión en transición, hay que iniciar la alimentación con técnica mixta y comenzar con ejercicios de succión.\"<br><br>Análisis de Distractores: A las 30 o 32 semanas, el neonato cursa con un patrón inmaduro sin coordinación, lo que condiciona alto riesgo de asfixia alimentaria si se fuerza la vía oral. Esperar hasta las 36 semanas retrasa injustificadamente la adaptación oral y fomenta la dependencia a las sondas.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Lactancia materna en el niño prematuro, Página 42." 
    },
    {
        id: 23, 
        question: "¿Cuál es la temperatura máxima permitida para congelar la leche materna en el domicilio antes de enviarla al banco de leche humana?", 
        options: ["-5 °C", "-10 °C", "-15 °C", "-20 °C"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC, para la conservación biológica en un entorno extrahospitalario sin tecnología de ultracongelación, este es el límite térmico requerido para inhibir la lipólisis espontánea y paralizar el crecimiento logarítmico bacteriano en los refrigeradores comerciales de las donantes.<br><br>Perla ENARM: \"Congelar la leche en casa antes de las 24 horas tras la extracción. Temperatura máxima del congelador: -15 °C.\"<br><br>Análisis de Distractores: Congelar a -5 °C o -10 °C no detiene completamente la actividad enzimática, comprometiendo la acidez titulable del producto. La ultracongelación hospitalaria utiliza temperaturas de -20 °C hasta -80 °C, pero el límite de seguridad normativo exigido para la refrigeración casera es puntualmente -15 °C.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Puntos críticos de control en el almacenamiento, Página 96."

    {

        question: "En el recién nacido prematuro, ¿cuántos movimientos de succión continuos caracterizan la fase o patrón maduro?",

        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Lactancia materna en el niño prematuro, Página 42." 
    },
    {
        id: 25, 
        question: "Para evitar la pérdida de la muestra biológica por rotura de envases durante la congelación en un banco, ¿hasta qué nivel máximo deben llenarse los frascos?", 
        options: ["Una cuarta parte", "Media capacidad", "Tres cuartas partes", "Totalidad del envase"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC, los líquidos corporales con alto contenido de agua y grasa sufren expansión de volumen (dilatación térmica anómala) al pasar al estado sólido. Si se elimina el espacio libre en el recipiente, la tensión rompe la pared del vidrio o plástico rígido, contaminando la leche.<br><br>Perla ENARM: \"Los envases deben llenarse hasta las tres cuartas partes de su capacidad para evitar su rotura al ser congelados.\"<br><br>Análisis de Distractores: Llenar a una cuarta parte o a media capacidad representa un desperdicio de los insumos estériles de un banco de recursos limitados. Llenar a la totalidad asegura invariablemente el estallido del contenedor por expansión de hielo.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Puntos críticos de control en la recepción, Página 97."

    {

        question: "¿Cuál es el periodo posparto óptimo recomendado para que las madres inicien como donantes de leche humana y aseguren su propia lactancia?",

        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC, el puerperio temprano es vital para la instauración fisiológica del estímulo prolactínico y para priorizar los requerimientos del hijo propio de la madre. Una vez establecida la curva de producción de leche madura, la donación del excedente es segura.<br><br>Perla ENARM: \"Se recomienda que las madres donantes se encuentren entre la tercera y octava semana después del parto, para que la lactancia esté establecida.\"<br><br>Análisis de Distractores: Extraer grandes volúmenes en la primera o segunda semana puede generar un desequilibrio oferta-demanda, desprotegiendo al propio bebé o predisponiendo a ingurgitación/mastitis severa en la madre no adaptada. Tiempos mayores a la décima semana son funcionales, pero la GPC dicta la \"tercera a octava\" como la ventana de inicio recomendada.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Criterios de donación de leche humana, Página 70."

    {

        question: "En el recién nacido pretérmino de muy bajo peso, ¿cuál es la densidad calórica a la que debe fortificarse de manera estándar la leche humana?", 
        options: ["20 kcal/onza", "24 kcal/onza", "28 kcal/onza", "32 kcal/onza"],

        justification: "Justificación: De acuerdo a la GPC, aunque la leche materna de madres prematuras tiene temporalmente un mayor contenido proteico y de sodio, el volumen gástrico de estos neonatos no permite administrar cantidades suficientes para igualar el ritmo de crecimiento intrauterino de los últimos meses, forzando la suplementación estándar.<br><br>Perla ENARM: \"Para los neonatos pretérmino, con muy bajo peso al nacer, la leche materna debe ser fortificada para lograr que provea 24 kcal/onza.\"<br><br>Análisis de Distractores: 20 kcal/onza es el aporte calórico fisiológico de la leche humana natural no fortificada a término. 28 o 32 kcal/onza son hiperconcentraciones agresivas, reservadas exclusivamente para escenarios especiales de franca restricción hídrica cardiopulmonar (donde la meta es 26-30 kcal/oz).", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Lactancia materna en el niño prematuro, Página 42."

    {

        question: "¿Cuál de los siguientes componentes humorales de la leche humana presenta una destrucción menor al 10% tras el proceso de pasteurización?", 
        options: ["Inmunoglobulina A", "Lactoferrina", "Lisozima", "Inmunoglobulina M"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC, el proceso térmico Holder (62.5 °C por 30 minutos) elimina bacterias y virus pero respeta notablemente el arsenal biológico del fluido. Sin embargo, su perfil de afección térmica es específico y focalizado según el peso molecular.<br><br>Perla ENARM: \"La pasteurización destruye menos del 10% de las IgM.\"<br><br>Análisis de Distractores: Inmunoglobulina A, lactoferrina y lisozima pertenecen al grupo de elementos que tienen una conservación superior y extraordinaria (se preserva más del 90% intacto tras el calor), diferenciándose técnicamente de la cifra específica del 10% listada para las IgM en la GPC.",

    {
        id: 29, 
        question: "¿Cuál es el tiempo máximo recomendado de almacenamiento de leche congelada domiciliaria antes de enviarla a un banco hospitalario?", 
        options: ["1 semana", "2 semanas", "4 semanas", "6 semanas"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC, aunque los congeladores industriales permiten márgenes prolongados de viabilidad lipídica, los congeladores caseros carecen de termostatos herméticos, presentando fluctuaciones diarias al abrir las puertas, lo cual oxida los ácidos grasos si la espera es excesiva.<br><br>Perla ENARM: \"Se recomienda que el tiempo máximo de almacenamiento de leche congelada en casa antes de enviarla al banco de leche no supere las 4 semanas.\"<br><br>Análisis de Distractores: 1 y 2 semanas son periodos seguros pero no alcanzan el límite logístico máximo autorizado que facilita la donación. Un margen de 6 semanas de refrigeración irregular promueve la degradación proteolítica irreversible antes del tratamiento en el banco.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Puntos críticos de control en el almacenamiento, Página 96."

    {
        id: 30, 
        question: "Ante un neonato con diagnóstico de enfermedad de la orina en jarabe de arce, ¿qué aminoácidos deben excluirse de la fórmula especial y contraindican el seno materno?", 
        options: ["Fenilalanina y tirosina", "Metionina y cisteína", "Leucina, isoleucina y valina", "Arginina y glutamina"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC, la falla hereditaria en el complejo deshidrogenasa de cetoácidos de cadena ramificada impide la degradación de leucina, isoleucina y valina. Su acumulación rápida precipita encefalopatía letal y cetoacidosis severa desde las primeras tomas de proteínas humanas.<br><br>Perla ENARM: \"Enfermedad de orina de jarabe de arce. Se necesita una fórmula especial libre de leucina, isoleucina y valina.\"<br><br>Análisis de Distractores: La exclusión de fenilalanina (A) es específica para la fenilcetonuria, que paradójicamente sí requiere leche materna como terapia. Metionina/cisteína y arginina/glutamina son alteraciones de vías de homocisteína o ciclo de la urea, no los aminoácidos neurotóxicos pivote del jarabe de arce.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Errores innatos del metabolismo, Página 59." 
    },
    {
        id: 31, 
        question: "En la normatividad de Banco de Leche, ¿cuál es el límite de tiempo recomendado para que una mujer participe de forma activa donando leche?", 
        options: ["1 a 3 meses", "3 a 6 meses", "6 meses a 1 año", "1 a 2 años"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC, el contenido proteico y los requerimientos madurativos cambian con el desarrollo del niño. La leche producida más allá del primer año se adapta a un infante deambulador y pierde la densidad de macro y micronutrientes crítica necesaria para rescatar a un prematuro en fase de crecimiento exponencial hospitalario.<br><br>Perla ENARM: \"Se recomienda establecer límites de tiempo en la donación de la leche materna de 6 meses a un año.\"<br><br>Análisis de Distractores: Cierres tempranos de 1 a 3 meses y 3 a 6 meses privan al banco de madres con altas reservas biológicas ya entrenadas y tamizadas. Donar de 1 a 2 años entrega un sustrato biológico sin el perfil inmunonutricional que la terapia intensiva neonatal requiere.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Criterios de donación de leche humana, Página 81." 
    },
    {
        id: 32, 
        question: "Durante el tamizaje de estilo de vida materno, ¿a partir de qué volumen de consumo diario de café se establece un criterio de exclusión absoluta como donadora?", 
        options: ["1 onza al día", "2 onzas al día", "3 onzas al día", "4 onzas al día"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC, la cafeína posee una vida media notablemente prolongada en neonatos inmaduros, donde el aclaramiento hepático es incipiente. Concentraciones tóxicas transferidas inducen agitación, taquicardia y compromiso cardiovascular letal en prematuros de terapia intensiva.<br><br>Perla ENARM: \"No pueden ser donantes las madres con las siguientes características: ...madres que ingieren frecuentemente 2 onzas de alcohol al día o bebidas equivalentes o 3 onzas de café al día.\"<br><br>Análisis de Distractores: Consumos menores a 1 o 2 onzas pueden ser tolerados bajo estricto control. La normativa traza el corte biológico de exclusión definitiva y directa a partir de las 3 onzas diarias para no exponer receptores críticos a xantinas vasoactivas.", 
        source: "GPC-IMSS-704-18, Lactancia materna en el niño con enfermedad. Donación de leche humana, 2018, Criterios de donación de leche humana, Página 75." 
    },
    {
        id: 33, 
        question: "De acuerdo al protocolo estricto de control de higiene, ¿hasta qué nivel anatómico debe realizarse el lavado de extremidades previo a la extracción o manipulación de leche?", 
        options: ["Tercio distal de muñeca", "Hasta el codo", "Tercio medio del brazo", "Hasta el hombro"], 
        answer: 1,

    {

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('70418Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('70418LastQId', currentQuestionId);
                else localStorage.removeItem('70418LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('70418Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

            if(userDocSnap.exists()) {document.body.style.opacity = '1';} else {window.location.href = "index.html";}} else {window.location.href = "index.html";}
