    <script>
        const questionsData = [

    {
        id: 1, 
        question: "De acuerdo a los criterios epidemiológicos de definición de caso de la GPC, ¿cuál es el signo patognomónico inicial que confirma clínicamente el diagnóstico de tétanos neonatal?", 
        options: ["Parálisis flácida simétrica", "Incapacidad para succionar (trismo)", "Cianosis central intermitente", "Fontanela anterior abombada"], 
        answer: 1, 
        justification: "Justificación: El trismo maseterino bloquea la capacidad del recién nacido para abrir la boca y alimentarse, presentándose clásicamente a partir del tercer día de vida en un neonato previamente sano de forma súbita. De acuerdo GPC de Prevención de Tétanos Neonatal, el diagnóstico de esta entidad es eminentemente clínico y se confirma mediante la triada establecida por la OMS.<br><br>Perla ENARM: \"Definición de caso confirmado de tétanos neonatal. Es todo recién nacido que presenta las tres características siguientes: Alimentación y llanto normales durante los dos primeros días de vida. Comienzo de la enfermedad entre el tercero y el vigésimo octavo día de vida e Incapacidad para succionar (trismo) seguida de rigidez (muscular generalizada) o convulsiones (espasmos musculares).\"<br><br>Análisis de Distractores: Las opciones A, C y D representan manifestaciones clínicas de botulismo neonatal, cardiopatías congénitas cianógenas o meningitis neonatal, respectivamente; ninguna se asocia a la parálisis espástica y trismo causados por la tetanoespasmina.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Glosario, Página 52." 
    },
    {
        id: 2, 
        question: "En la epidemiología del tétanos neonatal en México, ¿cuál es el factor de riesgo específico que se reporta con la mayor frecuencia?", 
        options: ["Multiparidad materna severa", "Ausencia de vacunación en el adolescente", "Parto domiciliario por vía vaginal", "Corte de cordón con objeto no estéril"], 
        answer: 3, 
        justification: "Justificación: La inoculación directa de las esporas de Clostridium tetani ocurre principalmente por el uso de materiales improvisados y no estériles para seccionar el cordón umbilical. De acuerdo GPC de Prevención de Tétanos Neonatal, aunque existen múltiples factores de riesgo sociodemográficos, las prácticas obstétricas inseguras relacionadas al corte del cordón son el pilar de mayor peso epidemiológico.<br><br>Perla ENARM: \"El factor de riesgo más frecuente fue el corte de cordón umbilical con objeto no estéril siendo un 75.6%.\"<br><br>Análisis de Distractores: Las opciones A, B y C son factores descritos en la GPC como determinantes de riesgo y vulnerabilidad, pero no representan la causa mecánica específica con el mayor porcentaje reportado de ocurrencia en nuestro país.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 15." 
    },
    {
        id: 3, 
        question: "Para la vigilancia epidemiológica del tétanos neonatal, ¿cómo se define operacionalmente una zona de alto riesgo?", 
        options: ["Incidencia anual > 1 caso por 1000 nacidos vivos", "Incidencia anual > 5 casos por 1000 nacidos vivos", "Incidencia anual > 10 casos por 10,000 nacidos vivos", "Presencia de al menos 1 caso confirmado anual"], 
        answer: 0, 
        justification: "Justificación: El establecimiento de este umbral permite focalizar recursos e intervenciones comunitarias intensivas, así como priorizar campañas de barrido vacunal. De acuerdo GPC de Prevención de Tétanos Neonatal, la identificación de estas zonas con bajo nivel de desarrollo humano es crítica para mejorar la vigilancia y control epidemiológico de la enfermedad.<br><br>Perla ENARM: \"Las medidas de vigilancia deben centrarse en las zonas de alto riesgo específicamente para Tétanos neonatal, es decir las áreas del país que tienen una incidencia anual de tétanos neonatal superior a 1 caso por cada 1000 nacidos vivos con vigilancia de nivel bajo de desarrollo de los municipios.\"<br><br>Análisis de Distractores: Las opciones B y C representan valores numéricos incorrectos y no respaldados por la definición operacional de la GPC. La opción D面cribe un criterio de sospecha y notificación obligatoria, pero no el criterio de zona de alto riesgo.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 14." 
    },
    {
        id: 4, 
        question: "Para disminuir de forma óptima el riesgo de tétanos neonatal, ¿cuál es el número mínimo de consultas prenatales que la Organización Mundial de la Salud recomienda que asistan las mujeres embarazadas?", 
        options: ["3 consultas prenatales", "4 consultas prenatales", "5 consultas prenatales", "8 consultas prenatales"], 
        answer: 2, 
        justification: "Justificación: El control prenatal regular garantiza que el personal médico verifique el estado de inmunización, administre los refuerzos vacunales correspondientes y eduque sobre prácticas higiénicas del parto. De acuerdo GPC de Prevención de Tétanos Neonatal, la asistencia prenatal adecuada es un indicador indispensable de equidad en la salud.<br><br>Perla ENARM: \"La OMS recomienda que las mujeres embarazadas asistan como mínimo a 5 consultas de atención prenatal.\"<br><br>Análisis de Distractores: Las opciones A y B representan coberturas de atención prenatal deficientes que la GPC asocia con mayor riesgo de tétanos materno y neonatal. La opción D es la directriz general más reciente de la OMS, pero no el mínimo estricto señalado de forma de forma literal por la evidencia de esta GPC para la erradicación del riesgo.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 21." 
    },
    {
        id: 5, 
        question: "En partos ocurridos fuera del ámbito hospitalario, ¿cuál es el antiséptico recomendado para aplicar en el cordón umbilical del recién nacido para prevenir el tétanos neonatal?", 
        options: ["Solución de clorhexidina", "Alcohol etílico al 70%", "Violeta de genciana", "Tintura de yodo"], 
        answer: 0, 
        justification: "Justificación: La clorhexidina ejerce un efecto bactericida residual de amplio espectro sobre la piel y el muñón umbilical, evitando de forma efectiva la colonización por gérmenes patógenos en ambientes de escasos recursos. De acuerdo GPC de Prevención de Tétanos Neonatal, su uso está sustentado por la OMS en el parto domiciliario o fortuito.<br><br>Perla ENARM: \"La OMS recomienda el uso de clorhexidina en el cordón umbilical por su alta efectividad sobre el uso de otros antisépticos en ámbitos no hospitalarios, a pesar de no existir ninguna diferencia entre el uso o no uso de antisépticos umbilicales en el muñón en el recién nacido que tiene atención hospitalaria.\"<br><br>Análisis de Distractores: Las opciones B, C y D representan compuestos antisépticos tradicionales utilizados de manera histórica; sin embargo, carecen de la recomendación de alta efectividad de la OMS comparada con la clorhexidina en medios extrahospitalarios.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 22." 
    },
    {
        id: 6, 
        question: "En una mujer en edad fértil sin inmunización previa contra el tétanos, ¿de cuántas dosis consta la serie primaria recomendada por la GPC para garantizar protección duradera?", 
        options: ["Una serie de 2 dosis", "Una serie de 3 dosis", "Una serie de 5 dosis", "Una serie de 6 dosis"], 
        answer: 2, 
        justification: "Justificación: Se requiere un esquema completo de 5 dosis espaciadas a intervalos de tiempo correctos para lograr una memoria inmunológica de tipo persistente que brinde protección del 100% durante su vida reproductiva. De acuerdo GPC de Prevención de Tétanos Neonatal, iniciar esta pauta en la mujer en edad fértil es la estrategia de mayor impacto en zonas endémicas.<br><br>Perla ENARM: \"La mujer en edad fértil que no haya sido vacunada previamente, deben iniciar con una serie de 5 dosis de acuerdo a: 2 dosis de toxoide tetánico aplicadas con un intervalo no < de 4 semanas, una 3er dosis entre 6 y 12 meses después, una 4ta dosis al año de la 3er, una 5ta dosis al año de la última aplicación.\"<br><br>Análisis de Distractores: Las opciones A y B son esquemas incompletos que ofrecen una protección temporal e insuficiente de mediano plazo si no hay antecedentes. La opción D describe una dosis en el adulto joven que confiere protección duradera pero no forma parte de la serie básica inicial.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 24." 
    },
    {
        id: 7, 
        question: "Al iniciar la vacunación antitetánica en una mujer en edad fértil sin antecedentes de inmunización, ¿cuál es el intervalo mínimo requerido entre la primera y la segunda dosis?", 
        options: ["Dos semanas", "Cuatro semanas", "Seis meses", "Un año"], 
        answer: 1, 
        justification: "Justificación: Este periodo permite una adecuada maduración de la respuesta inmune primaria de anticuerpos y es el intervalo fisiológico estándar para la posterior dosis de refuerzo. De acuerdo GPC de Prevención de Tétanos Neonatal, asegurar este intervalo es indispensable para alcanzar una respuesta de anticuerpos de tipo protector eficaz.<br><br>Perla ENARM: \"La mujer en edad fértil que no haya sido vacunada previamente, deben iniciar con una serie de 5 dosis de acuerdo a: 2 dosis de toxoide tetánico aplicadas con un intervalo no < de 4 semanas...\"<br><br>Análisis de Distractores: La opción A es un periodo muy corto que interfiere con la cinética de producción de linfocitos de memoria, reduciendo la efectividad final. Las opciones C y D son los intervalos correctos requeridos para la tercera, cuarta y quinta dosis, respectivamente.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 24." 
    },
    {
        id: 8, 
        question: "En la transferencia pasiva de inmunidad para prevenir el tétanos neonatal, ¿cuál es el único isotipo de inmunoglobulina materna capaz de atravesar la barrera placentaria hacia el feto?", 
        options: ["Inmunoglobulina M", "Inmunoglobulina A", "Inmunoglobulina E", "Inmunoglobulina G"], 
        answer: 3, 
        justification: "Justificación: El transporte activo de anticuerpos maternos a través de receptores placentarios específicos se restringe únicamente al isotipo monomérico IgG, incrementándose constantemente a partir del cuarto mes de gestación para brindar protección pasiva transitoria al neonato. De acuerdo GPC de Prevención de Tétanos Neonatal, este paso de anticuerpos es fundamental para proteger al recién nacido durante sus primeros meses de vida.<br><br>Perla ENARM: \"En una madre inmunizada los anticuerpos contra el tétanos se trasmiten vía transparentaría al feto, esta trasferencia se limita únicamente a las inmunoglobulinas IgG.\"<br><br>Análisis de Distractores: Las opciones A y B corresponden a inmunoglobulinas pentaméricas o diméricas que no pueden cruzar la barrera placentaria por su elevado peso molecular. La opción C no participa en la inmunidad humoral pasiva neonatal contra toxinas bacterianas.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 23." 
    },
    {
        id: 9, 
        question: "Durante la gestación, ¿cuál es el periodo ideal en semanas de gestación para administrar la vacuna con componente pertussis acelular (Tdap) para optimizar la protección del recién nacido?", 
        options: ["Entre las semanas 12 y 20", "Entre las semanas 27 y 36", "Entre las semanas 37 y 40", "En el periodo posparto inmediato"], 
        answer: 1, 
        justification: "Justificación: La vacunación materna en este periodo gestacional específico maximiza la concentración sérica de anticuerpos IgG maternos y permite un transporte placentario activo sumamente eficiente hacia el feto. De acuerdo GPC de Prevención de Tétanos Neonatal, esta inmunización previene la tosferina y el tétanos antes de que el lactante inicie su propia vacunación.<br><br>Perla ENARM: \"El momento ideal para la vacunación Tdap durante el embarazo es entre las semanas 27-36 de gestación (de preferencia antes de la semana 34), esto con el objetivo de aumentar la probabilidad de protección óptima para la embarazada y su recién nacido durante los primeros meses de vida.\"<br><br>Análisis de Distractores: La opción A no logra una transferencia óptima debido a que el transporte activo placentario es muy inmaduro. Las opciones C y D representan momentos tardíos o posparto en los que la transferencia transplacentaria ya es ineficaz o nula, dejando desprotegido al recién nacido las primeras semanas.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 27." 
    },
    {
        id: 10, 
        question: "De acuerdo con las especificaciones de seguridad de la vacuna Tdap detalladas en la GPC, ¿cuál es una contraindicación absoluta para su administración?", 
        options: ["Reacción anafiláctica a la neomicina", "Diabetes mellitus materna descompensada", "Fiebre leve menor a 38°C", "Lactancia materna activa exclusiva"], 
        answer: 0, 
        justification: "Justificación: Los componentes traza o antibióticos residuales utilizados en el cultivo y producción del biológico representan un riesgo directo de hipersensibilidad sistémica letal o anafilaxia en pacientes previamente sensibilizados. De acuerdo GPC de Prevención de Tétanos Neonatal, la identificación de estas de tipo alérgico es prioritaria en la evaluación prenatal.<br><br>Perla ENARM: \"Antecedente de una reacción anafiláctica confirmada a neomicina, estreptomicina y polimixina b son contraindicaciones.\"<br><br>Análisis de Distractores: Las opciones B, C y D representan condiciones clínicas que no impiden la inmunización; de hecho, la enfermedad aguda leve con o sin fiebre no es una contraindicación absoluta para la aplicación de la vacuna.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 34." 
    },
    {
        id: 11, 
        question: "En la monitorización de reacciones secundarias graves a vacunas antitetánicas, ¿qué cuadro neurológico ocurrido dentro de los siete días posteriores a la dosis previa contraindica absolutamente su aplicación?", 
        options: ["Neuropatía motora periférica distal", "Neuralgia del trigémino unilateral", "Encefalopatía no atribuible a otra causa", "Parálisis facial periférica de Bell"],

        justification: "Justificación: La presencia de alteración grave del estado de alerta, coma o crisis convulsivas prolongadas en la ventana de una semana post-vacunación contraindica la revacunación con cualquier biológico que contenga componente pertussis o toxoide diftérico/tetánico. De acuerdo GPC de Prevención de Tétanos Neonatal, este evento secundario de tipo grave obliga a suspender la aplicación de dosis subsecuentes.<br><br>Perla ENARM: \"Contraindicaciones absolutas de la vacuna Tdap and Td: ... Antecedente de estado de coma, disminución del nivel de conciencia o convulsiones prolongadas no atribuibles a otra causa dentro de los 7 días de la administración de una dosis previa de la vacuna.\"<br><br>Análisis de Distractores: Las opciones A, B y D son trastornos neurológicos localizados que no se asocian a una disfunción de tipo sistémico del sistema nervioso central secundaria a la vacuna, por lo que no representan contraindicaciones absolutas.", 
        source: "GPC-IMSS-829-18, Detección de Factores de Riesgo y Prevención Primaria del Tétanos Neonatal en el Primer Nivel de Atención Médica, 2018, Sección: Evidencias y Recomendaciones, Página 34." 
    },
    {

        question: "Si una paciente presenta antecedentes de reacciones de hipersensibilidad tipo Arthus posterior a una dosis previa de vacuna con toxoide tetánico, ¿cuál es la conducta recomendada por la GPC?",

    },
    {
        id: 13, 
        question: "Durante emergencias o desastres naturales, ¿cuál es el manejo quirúrgico esencial obligado para heridas abiertas potencialmente contaminadas con Clostridium tetani?", 
        options: ["Desbridamiento y mantener la herida abierta", "Cierre primario quirúrgico inmediato", "Lavado exclusivo con agua estéril", "Antibioticoterapia tópica exclusiva profiláctica"], 
        answer: 0, 
        justification: "Justificación: Clostridium tetani es un anaerobio de tipo obligado; el desbridamiento elimina el tejido necrótico, coagulado y desvitalizado que actúa como un nicho ideal de baja tensión de oxígeno para la germinación de las esporas. De acuerdo GPC de Prevención de Tétanos Neonatal, las heridas contaminadas no deben suturarse primariamente.<br><br>Perla ENARM: \"Primordialmente en las situaciones de emergencias humanitarias, como los desastres naturales, la atención médica y quirúrgica adecuada de las heridas abiertas contaminadas toma relevancia. Toda herida abierta debe considerarse contaminada y por lo tanto no debe ser cerrada, es esensial el desbridamiento y la extirpación de tejido muerto y detritos.\"<br><br>Análisis de Distractores: La opción B crea un ambiente cerrado libre de oxígeno que favorece de manera directa la multiplicación bacteriana. Las opciones C y D son de carácter insuficiente, ya que el desbridamiento mecánico es el único estándar quirúrgico.",

    },
    {
        id: 14, 
        question: "En la fisiopatología del tétanos, ¿cuál es la velocidad de transporte retrógrado axonal descrita por la GPC para la tetanoespasmina hacia el sistema nervioso central?",

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('82918Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('82918LastQId', currentQuestionId);
                else localStorage.removeItem('82918LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('82918Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    document.body.style.opacity = '0';
    document.body.style.transition = 'opacity 0.1s ease';

        if (user) {const userDocRef = doc(db, "usuarios_autorizados", user.email);
            const userDocSnap = await getDoc(userDocRef);
            if(userDocSnap.exists()) {document.body.style.opacity = '1';} else {window.location.href = "index.html";}} else {window.location.href = "index.html";}
