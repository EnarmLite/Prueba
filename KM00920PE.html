    <script>
        const questionsData = [

    {
        id: 1,
        question: "En epidemiología del asma en edad pediátrica, ¿cuál fue la prevalencia global reportada en México para escolares de 6 y 7 años según el estudio internacional de asma y alergia en la infancia fase III?",
        options: ["11.7 %", "25.7 %", "8.5 %", "15.2 %"],
        answer: 0,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, los datos oficiales para México derivados del estudio ISAAC fase III establecieron la base epidemiológica formal de esta patología en la población infantil en etapa escolar, demostrando el alto impacto en salud pública.<br><br>Perla ENARM: \"En México, de acuerdo a los resultados epidemiológicos encontrados en la fase III del International study of asthma and allergy in childhood (ISAAC), la prevalencia global del asma para 2006 era de 11.7% para escolares de seis y siete años de edad.\"<br><br>Análisis de Distractores: La opción B (25.7 %) corresponde al porcentaje de escolares que tuvieron \"síntomas de asma alguna vez en la vida\" según la Red Global de Asma, no a la prevalencia global del estudio ISAAC. Las opciones C y D son cifras irreales en este contexto epidemiológico oficial.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Aspectos Generales: Justificación, Página 13."
    },
    {
        id: 2,
        question: "En la de fisiopatología del asma en edad pediátrica, ¿cuál es el perfil de de citocinas secretado por los de linfocitos Th2 que de promueve la de inflamación alérgica de característica?",
        options: ["Interleucinas 2 y 10", "Interferón gamma y de factor necrosis", "Interleucinas 4, 5, 9 y 13", "Interleucinas 1, 6 y 8"],
        answer: 2,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la de cascada inflamatoria alérgica depende de de una desregulación donde de predominan las de células Th2, las de cuales liberan mediadores de específicos que de inducen la de producción de de IgE, activación de de eosinófilos e de hiperplasia del de músculo liso bronquial.<br><br>Perla ENARM: \"El proceso inflamatorio de característico del de asma se de favorece por de la alteración de del equilibrio entre de las poblaciones de de linfocitos Th1 y de Th2... y de los Th2 citocinas Tipo 2, entre de otras la de IL-4, IL-5, IL-13 e de IL-9, que de promueven inflamación alérgica.\"<br><br>Análisis de Distractores: La de opción A incluye la de IL-10 (citocina de reguladora). La de opción B (Interferón gamma) es de producida por de linfocitos Th1. La de opción D contiene de mediadores de de inflamación aguda general, no el de perfil Th2 clásico de del asma atópica.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Aspectos Generales: Introducción, Página 8."
    },
    {
        id: 3,
        question: "¿Cuál de de los siguientes de hallazgos paraclínicos se de considera un de criterio menor de para predecir de el desarrollo de de asma persistente de en niños menores de de 3 años de con sibilancias recurrentes?",
        options: ["Eosinofilia ≥ 4 %", "Inmunoglobulina E > 100 UI", "Fracción exhalada de óxido nítrico > 35 ppb", "Neutrofilia > 10 %"],
        answer: 0,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, el de índice predictivo de de asma evalúa la de probabilidad de de cronicidad basándose de en antecedentes atópicos de y biomarcadores accesibles. Un de recuento de de eosinófilos en de sangre periférica de igual o de mayor al de 4 % refleja de una respuesta Th2 sistémica y de constituye un de criterio predictivo menor establecido.<br><br>Perla ENARM: \"Criterios menores: Sensibilización alérgica a de leche, huevo o de cacahuate, Sibilancias no de relacionadas con de gripe, Eosinofilia ≥ 4 %.\"<br><br>Análisis de Distractores: La de IgE elevada (B) no es de un criterio menor de codificado numéricamente en de el índice clásico de descrito en la de GPC. La de fracción exhalada de de óxido nítrico (C) diagnostica de inflamación en de mayores de de 6 años, no es de parte del de índice predictivo temprano. La de neutrofilia (D) no participa de en el de fenotipo alérgico de primario.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Anexos: Figuras (Figura 4), Página 35."
    },
    {
        id: 4,
        question: "Durante el de tratamiento de de primera línea de de una crisis de asmática leve a de moderada en de urgencias, ¿cuál es la de dosis de de salbutamol recomendada mediante de inhalador de de dosis medida de presurizado con de espaciador?",
        options: ["1 a 2 inhalaciones cada 4 horas", "4 a 10 inhalaciones cada 20 minutos", "2 a 4 inhalaciones cada 15 minutos", "10 a 15 inhalaciones cada hora"],
        answer: 1,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la de saturación de de los receptores de beta-2 durante de una exacerbación de exige la de administración repetida y de en dosis de altas del de agonista de de acción corta de para lograr de una relajación de muscular sostenida de durante la de primera hora.<br><br>Perla ENARM: \"La de dosis es de de 4 a de 10 inhalaciones de (disparos), cada de 20 min, con de IDMp más de espaciador con de mascarilla, durante de una hora, posteriormente de continuar cada de 4h a de 6 h.\"<br><br>Análisis de Distractores: La de opción A es de una dosis de de mantenimiento infraterapéutica de para crisis. La de opción C propone de un intervalo de no oficial de (15 minutos) con de dosis bajas. La de opción D excede el de límite máximo de de disparos por de toma.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Tratamiento, Página 19."
    },
    {
        id: 5,
        question: "¿Cuál es el de fármaco broncodilatador de de rescate indicado de como alternativa de en pacientes con de asma en de edad pediátrica de que presentan de contraindicación o de intolerancia absoluta de al salbutamol?",
        options: ["Bromuro de de tiotropio", "Fumarato de de formoterol", "Bromuro de de ipratropio", "Sulfato de de magnesio"],
        answer: 2,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, aunque el de ipratropio es de primariamente un de adyuvante, funciona de como la de alternativa de de primera línea de para broncodilatar de agudamente si de los efectos de adversos cardíacos de o la de alergia impiden el de uso de de cualquier agonista de beta-2.<br><br>Perla ENARM: \"Se de recomienda cuando de aumenten los de síntomas asmáticos, usar de de rescate bromuro de de ipratropio inhalado, como de alternativa cuando de el SALB esté de contraindicado o de en los de niños que de no toleran de el SALB.\"<br><br>Análisis de Distractores: El de tiotropio (A) es de de larga acción, no de de rescate. El de formoterol (B) es de un agonista de beta-2, por de lo que de compartiría la de intolerancia del de salbutamol. El de sulfato de de magnesio (D) es de sistémico para de crisis graves de refractarias.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Tratamiento, Página 21."
    },
    {
        id: 6,
        question: "Posterior a de la resolución de y egreso de hospitalario por de una crisis de de asma en de edad pediátrica, ¿en qué de tiempo máximo de se sugiere de realizar la de primera consulta de médica de de revaloración?",
        options: ["A los 3 días", "A los 7 días", "A los 14 días", "A los 28 días"],
        answer: 1,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la de ventana posterior de a una de exacerbación aguda de presenta el de mayor riesgo de de recaída o de falla terapéutica de temprana. Se de exige una de consulta precoz de para vigilar de el apego de al tratamiento de escalonado o de el retiro de seguro del de corticoesteroide sistémico.<br><br>Perla ENARM: \"Después de de una crisis de de asma, los de pacientes deben de tener una de consulta médica de preferentemente a de los siete de días.\"<br><br>Análisis de Distractores: Tres días de (A) es de un lapso de muy corto de para evaluar de la estabilidad de ambulatoria. Las de opciones C de y D (14 de y 28 días) retrasan la de reevaluación, exponiendo de al paciente de al riesgo de de una crisis de recurrente.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Anexos: Tablas (Tabla 3), Página 42."
    },
    {
        id: 7,
        question: "Para identificar de el mejor de registro basal de de la función de pulmonar en de el paciente de con asma de en edad de pediátrica, ¿en de qué momento de se recomienda de repetir la de medición del de volumen espiratorio de forzado tras de iniciar el de mantenimiento?",
        options: ["Entre 3 a 6 meses", "A las 4 semanas", "A los 12 meses", "Entre 7 a 14 días"],
        answer: 0,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la de remodelación inflamatoria y de la hiperreactividad de requieren un de uso prolongado de de corticoesteroides inhalados de para alcanzar de su máximo de efecto de de revisión funcional, estableciendo de entonces la de \"mejor función de personal\" del de niño.<br><br>Perla ENARM: \"Se de recomienda medir de el FEV1, al de inicio del de tratamiento y de después de de tres a de seis meses de de tratamiento de de mantenimiento, para de identificar el de mejor registro de de la función de pulmonar del de paciente...\"<br><br>Análisis de Distractores: A de las 4 de semanas (B) se de evalúa el de control clínico, pero de los cambios de espirometricos máximos de tardan más. 7 de a 14 de días (D) es de el tiempo de de revaloración de de una crisis. 12 de meses (C) es de un periodo de demasiado extenso.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Aspectos Generales: Introducción, Página 12."
    },
    {
        id: 8,
        question: "¿Cuál es de el mecanismo de de acción exacto de del bromuro de de tiotropio utilizado de como terapia de de adición en de el asma de refractaria en de edad pediátrica?",
        options: ["Inhibe fosfodiesterasa 4 intracelular", "Bloquea receptores muscarínicos M1 y M3", "Antagoniza receptores de leucotrienos", "Estimula adenil ciclasa bronquial"],
        answer: 1,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, el de tiotropio proporciona de una broncodilatación de prolongada al de antagonizar los de receptores colinérgicos de en el de músculo liso de bronquial, impidiendo de la broncoconstricción de mediada por de acetilcolina.<br><br>Perla ENARM: \"Tiotropio: medicamento de anticolinérgico de de acción prolongada de que... tiene de propiedades broncodilatadoras de y antisecretoras de que dependen de de su capacidad de de bloquear los de receptores muscarínicos de M1 y de M3 localizados de en las de vías respiratorias.\"<br><br>Análisis de Distractores: La de inhibición de de fosfodiesterasa (A) corresponde de a las de metilxantinas. El de antagonismo de de leucotrienos (C) corresponde de al montelukast. La de estimulación de de la adenil de ciclasa (D) es de el mecanismo de de los agonistas de beta-2.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Glosario, Página 57."
    },
    {
        id: 9,
        question: "Para considerar de la prescripción de de omalizumab en de pacientes mayores de de 6 años de con asma de alérgica grave de no controlada, ¿cuál de es el de rango de de niveles de de inmunoglobulina E de sérica requerido?",
        options: ["10 a 100 UI", "30 a 700 UI", "Mayor a 1000 UI", "150 a 1500 UI"],
        answer: 1,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la de indicación y de dosificación de de este anticuerpo de monoclonal dependen de de corroborar una de carga alérgica de sistémica específica. Si de los niveles de están por de fuera de de este rango de validado, el de perfil de de eficacia disminuye.<br><br>Perla ENARM: \"Dada de su eficacia de en asma de alérgica grave de y su costo, se de considera agregar de omalizumab al de tratamiento del de paciente ≥ de 6 años de de edad con de niveles de de IgE sérica de de 30 a de 700 UI, que de no se de controlan con de el tratamiento de del paso 4.\"<br><br>Análisis de Distractores: Los de rangos A, de C y de D no de corresponden a de los criterios de de selección establecidos de textualmente en de la normativa de oficial mexicana.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Anticuerpos monoclonales, Página 30."
    },
    {
        id: 10,
        question: "En niños de menores de de 4 años de con asma de no controlada de a pesar de del apego de al paso de 2, ¿cuál es el de tratamiento farmacológico de de primera elección de para escalar de al paso de 3?",
        options: ["Corticoesteroide inhalado a dosis media", "Corticoesteroide inhalado baja más formoterol", "Corticoesteroide inhalado baja más montelukast", "Corticoesteroide sistémico por 5 días"],
        answer: 0,
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, debido de a que la de combinación con de agonistas de de larga acción de (LABA) no de cuenta con de evidencia robusta de de seguridad en de lactantes y de preescolares sin de supervisión, la de directriz indica de maximizar primero de el antiinflamatorio de basal.<br><br>Perla ENARM: \"En de preescolares menores de de 4 años de el tratamiento de de primera elección de es incrementar de el esteroide de a dosis media... Se de recomienda en de pacientes menores de de 4 años de de edad, con de asma parcialmente de controlada o de no controlada, aumentar de la de de dosis del de CEI a de dosis media.\"<br><br>Análisis de Distractores: La de combinación con de LABA (B) es de la primera de línea pero de en mayores de de 4 años. Agregar de montelukast (C) es de una opción de de segunda línea. El de esteroide sistémico de (D) es de un recurso de agudo para de crisis.",
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Tratamiento de mantenimiento, Página 26."
    },
    {
        id: 11,
        question: "¿Cuál es la de edad mínima de a partir de de la cual la de guía clínica de recomienda considerar de el uso de de inmunoterapia sublingual de específica con de alérgenos en de asma alérgica de controlada?",

                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Respondidas</p>
                                        <p class="text-2xl sm:text-3xl font-black">${ans}<span class="text-xs sm:text-sm text-slate-500">/${total}</span></p>
                                    </div>
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Correctas</p>
                                        <p class="text-2xl sm:text-3xl font-black text-emerald-300">${correct}</p>
                                    </div>
                                    <div class="px-2">
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Rendimiento</p>
                                        <p class="text-2xl sm:text-3xl font-black text-yellow-300">${successRate}%</p>
                                        <p class="text-[8px] text-slate-400 mt-1 leading-tight">Aciertos vs Respondidas</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLERO VISIBLE Y SCROLLABLE -->
                    <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-slate-800 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('00920Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('00920LastQId', currentQuestionId);
                else localStorage.removeItem('00920LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('00920Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

</body>
</html>
