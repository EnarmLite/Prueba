    <script>
        const questionsData = [

    // BLOQUE 1: Tratamiento del Asma en Edad Pediátrica (1-20)
    {
        id: 1, 
        question: "En epidemiología del asma en edad pediátrica, ¿cuál fue la prevalencia global reportada en México para escolares de 6 y 7 años según el estudio internacional de asma y alergia en la infancia fase III?", 
        options: ["11.7 %", "25.7 %", "8.5 %", "15.2 %"], 
        answer: 0, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, los datos oficiales para México derivados del estudio ISAAC fase III establecieron la base epidemiológica formal de esta patología en la población infantil en etapa escolar, demostrando el alto impacto en salud pública.<br><br>Perla ENARM: \"En México, de acuerdo a los resultados epidemiológicos encontrados en la fase III del International study of asthma and allergy in childhood (ISAAC), la prevalencia global del asma para 2006 era de 11.7% para escolares de seis y siete años de edad.\"<br><br>Análisis de Distractores: La opción B (25.7 %) corresponde al porcentaje de escolares que tuvieron \"síntomas de asma alguna vez en la vida\" según la Red Global de Asma, no a la prevalencia global del estudio ISAAC. Las opciones C y D son cifras irreales en este contexto epidemiológico oficial.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Aspectos Generales: Justificación, Página 13." 
    },
    {
        id: 2, 
        question: "En la fisiopatología del asma en edad pediátrica, ¿cuál es el perfil de citocinas secretado por los linfocitos Th2 que promueve la inflamación alérgica característica?", 
        options: ["Interleucinas 2 y 10", "Interferón gamma y factor necrosis", "Interleucinas 4, 5, 9 y 13", "Interleucinas 1, 6 y 8"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la cascada inflamatoria alérgica depende de una desregulación donde predominan las células Th2, las cuales liberan mediadores específicos que inducen la producción de IgE, activación de eosinófilos e hiperplasia del músculo liso bronquial.<br><br>Perla ENARM: \"El proceso inflamatorio característico del asma se favorece por la alteración del equilibrio entre las poblaciones de linfocitos Th1 y Th2... y los Th2 citocinas Tipo 2, entre otras la IL-4, IL-5, IL-13 e IL-9, que promueven inflamación alérgica.\"<br><br>Análisis de Distractores: La opción A incluye la IL-10 (citocina reguladora). La opción B (Interferón gamma) es producida por linfocitos Th1. La opción D contiene mediadores de inflamación aguda general (macrófagos/neutrófilos), no el perfil Th2 clásico del asma atópica.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Aspectos Generales: Introducción, Página 8." 
    },
    {
        id: 3, 
        question: "¿Cuál de los siguientes hallazgos paraclínicos se considera un criterio menor para predecir el desarrollo de asma persistente en niños menores de 3 años con sibilancias recurrentes?", 
        options: ["Eosinofilia ≥ 4 %", "Inmunoglobulina E > 100 UI", "Fracción exhalada óxido nítrico > 35 ppb", "Neutrofilia > 10 %"], 
        answer: 0, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, el índice predictivo de asma evalúa la probabilidad de cronicidad basándose en antecedentes atópicos y biomarcadores accesibles. Un recuento de eosinófilos en sangre periférica igual o mayor al 4 % refleja una respuesta Th2 sistémica y constituye un criterio predictivo menor establecido.<br><br>Perla ENARM: \"Criterios menores: Sensibilización alérgica a leche, huevo o cacahuate, Sibilancias no relacionadas con gripe, Eosinofilia ≥ 4 %.\"<br><br>Análisis de Distractores: La IgE elevada (B) no es un criterio menor codificado numéricamente en el índice clásico descrito en la GPC. La fracción exhalada de óxido nítrico (C) diagnostica inflamación en mayores de 6 años, no es parte del índice predictivo temprano. La neutrofilia (D) no participa en el fenotipo alérgico primario.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Anexos: Figuras (Figura 4), Página 35." 
    },
    {
        id: 4, 
        question: "Durante el tratamiento de primera línea de una crisis asmática leve a moderada en urgencias, ¿cuál es la dosis de salbutamol recomendada mediante inhalador de dosis medida presurizado con espaciador?", 
        options: ["1 a 2 inhalaciones cada 4 horas", "4 a 10 inhalaciones cada 20 minutos", "2 a 4 inhalaciones cada 15 minutos", "10 a 15 inhalaciones cada hora"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la saturación de los receptores beta-2 durante una exacerbación exige la administración repetida y en dosis altas del agonista de acción corta para lograr una relajación muscular sostenida durante la primera hora (\"hora dorada\" del rescate).<br><br>Perla ENARM: \"La dosis es de 4 a 10 inhalaciones (disparos), cada 20 min, con IDMp más espaciador con mascarilla, durante una hora, posteriormente continuar cada 4h a 6 h.\"<br><br>Análisis de Distractores: La opción A es una dosis de mantenimiento infraterapéutica para crisis. La opción C propone un intervalo no oficial (15 minutos) con dosis bajas. La opción D excede el límite máximo de disparos por toma.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Tratamiento, Página 19." 
    },
    {
        id: 5, 
        question: "¿Cuál es el fármaco broncodilatador de rescate indicado como alternativa en pacientes con asma en edad pediátrica que presentan contraindicación o intolerancia absoluta al salbutamol?", 
        options: ["Bromuro de tiotropio", "Fumarato de formoterol", "Bromuro de ipratropio", "Sulfato de magnesio"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, aunque el ipratropio es primariamente un adyuvante, funciona como la alternativa de primera línea para broncodilatar agudamente si los efectos adversos cardíacos o la alergia impiden el uso de cualquier agonista beta-2.<br><br>Perla ENARM: \"Se recomienda cuando aumenten los síntomas asmáticos, usar de rescate bromuro de ipratropio inhalado, como alternativa cuando el SALB esté contraindicado o en los niños que no toleran el SALB.\"<br><br>Análisis de Distractores: El tiotropio (A) es de larga acción (mantenimiento), no de rescate. El formoterol (B) es un agonista beta-2, por lo que compartiría la intolerancia o contraindicación del salbutamol. El sulfato de magnesio (D) es sistémico para crisis graves refractarias, no un rescate inhalado alternativo general.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Tratamiento, Página 21." 
    },
    {
        id: 6, 
        question: "Posterior a la resolución y egreso hospitalario por una crisis de asma en edad pediátrica, ¿en qué tiempo máximo se sugiere realizar la primera consulta médica de revaloración?", 
        options: ["A los 3 días", "A los 7 días", "A los 14 días", "A los 28 días"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la ventana posterior a una exacerbación aguda presenta el mayor riesgo de recaída o falla terapéutica temprana. Se exige una consulta precoz para vigilar el apego al tratamiento escalonado o el retiro seguro del corticoesteroide sistémico.<br><br>Perla ENARM: \"Después de una crisis de asma, los pacientes deben tener una consulta médica preferentemente a los siete días.\"<br><br>Análisis de Distractores: Tres días (A) es un lapso muy corto para evaluar la estabilidad ambulatoria. Las opciones C y D (14 y 28 días) retrasan la reevaluación, exponiendo al paciente al riesgo de una crisis grave recurrente no detectada a tiempo.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Anexos: Tablas (Tabla 3), Página 42." 
    },
    {
        id: 7, 
        question: "Para identificar el mejor registro basal de la función pulmonar en el paciente con asma en edad pediátrica, ¿en qué momento se recomienda repetir la medición del volumen espiratorio forzado tras iniciar el mantenimiento?", 
        options: ["Entre 3 a 6 meses", "A las 4 semanas", "A los 12 meses", "Entre 7 a 14 días"], 
        answer: 0, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la remodelación inflamatoria y la hiperreactividad requieren un uso prolongado de corticoesteroides inhalados para alcanzar su máximo efecto de reversión funcional, estableciendo entonces la \"mejor función personal\" del niño.<br><br>Perla ENARM: \"Se recomienda medir el FEV1, al inicio del tratamiento y después de tres a seis meses de tratamiento de mantenimiento, para identificar el mejor registro de la función pulmonar del paciente...\"<br><br>Análisis de Distractores: A las 4 semanas (B) se evalúa el control clínico de síntomas, pero los cambios espirométricos máximos tardan más. 7 a 14 días (D) es el tiempo de revaloración de una crisis. 12 meses (C) es un periodo demasiado extenso para establecer la basal óptima sin ajuste.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Aspectos Generales: Introducción, Página 12." 
    },
    {
        id: 8, 
        question: "¿Cuál es el mecanismo de acción exacto del bromuro de tiotropio utilizado como terapia de adición en el asma refractaria en edad pediátrica?", 
        options: ["Inhibe fosfodiesterasa 4 intracelular", "Bloquea receptores muscarínicos M1 y M3", "Antagoniza receptores de leucotrienos", "Estimula adenil ciclasa bronquial"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, el tiotropio proporciona una broncodilatación prolongada al antagonizar los receptores colinérgicos en el músculo liso bronquial, impidiendo la broncoconstricción mediada por acetilcolina.<br><br>Perla ENARM: \"Tiotropio: medicamento anticolinérgico de acción prolongada que... tiene propiedades broncodilatadoras y antisecretoras que dependen de su capacidad de bloquear los receptores muscarínicos M1 y M3 localizados en las vías respiratorias.\"<br><br>Análisis de Distractores: La inhibición de fosfodiesterasa (A) corresponde a las metilxantinas (aminofilina). El antagonismo de leucotrienos (C) corresponde al montelukast. La estimulación de la adenil ciclasa (D) es el mecanismo de los agonistas beta-2.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Glosario, Página 57." 
    },
    {
        id: 9, 
        question: "Para considerar la prescripción de omalizumab en pacientes mayores de 6 años con asma alérgica grave no controlada, ¿cuál es el rango de niveles de inmunoglobulina E sérica requerido?", 
        options: ["10 a 100 UI", "30 a 700 UI", "Mayor a 1000 UI", "150 a 1500 UI"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, la indicación y dosificación de este anticuerpo monoclonal dependen de corroborar una carga alergénica sistémica específica. Si los niveles están por fuera de este rango validado terapéuticamente, el perfil de eficacia disminuye.<br><br>Perla ENARM: \"Dada su eficacia en asma alérgica grave y su costo, se considera agregar omalizumab al tratamiento del paciente ≥ 6 años de edad con niveles de IgE sérica de 30 a 700 UI, que no se controlan con el tratamiento del paso 4.\"<br><br>Análisis de Distractores: Los rangos A, C y D no corresponden a los criterios de selección establecidos textualmente en la normativa oficial mexicana para garantizar la costo-efectividad de este biológico.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Anticuerpos monoclonales, Página 30." 
    },
    {
        id: 10, 
        question: "En niños menores de 4 años con asma no controlada a pesar del apego al paso 2, ¿cuál es el tratamiento farmacológico de primera elección para escalar al paso 3?", 
        options: ["Corticoesteroide inhalado a dosis media", "Corticoesteroide inhalado baja más formoterol", "Corticoesteroide inhalado baja más montelukast", "Corticoesteroide sistémico por 5 días"], 
        answer: 0, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, debido a que la combinación con agonistas de larga acción (LABA) no cuenta con evidencia robusta de seguridad en lactantes y preescolares sin supervisión especializada, la directriz indica maximizar primero el antiinflamatorio basal.<br><br>Perla ENARM: \"En preescolares menores de 4 años el tratamiento de primera elección es incrementar el esteroide a dosis media... Se recomienda en pacientes menores de 4 años de edad, con asma parcialmente controlada o no controlada, aumentar la dosis del CEI a dosis media.\"<br><br>Análisis de Distractores: La combinación con LABA (B) es la primera línea pero en mayores de 4 años. Agregar montelukast (C) es una opción de segunda línea o \"alternativa\". El esteroide sistémico (D) es un recurso agudo para exacerbaciones (crisis), jamás para escalar el mantenimiento a paso 3.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Tratamiento de mantenimiento, Página 26." 
    },
    {
        id: 11, 
        question: "¿Cuál es la edad mínima a partir de la cual la guía clínica recomienda considerar el uso de inmunoterapia sublingual específica con alérgenos en asma alérgica controlada?", 
        options: ["1 año de edad", "3 años de edad", "5 años de edad", "6 años de edad"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Asma Pediátrica, el sistema inmunitario de mucosas debe tener cierta madurez, y el paciente la capacidad mínima de retener el extracto bajo la lengua de manera segura, estableciéndose un corte etario menor que en la vía subcutánea por su perfil de seguridad.<br><br>Perla ENARM: \"Se recomienda referir al alergólogo pediatra, para que sea evaluado y se considere el uso de ITSC o ITSL... y, confirmar la sensibilización mediada por IgE, a partir de los 3 años de edad para ITSL y de los 5 años de edad para ITSC.\"<br><br>Análisis de Distractores: Un año (A) es una edad muy temprana sin validación inmunológica. 5 años (C) corresponde a la inmunoterapia subcutánea. 6 años (D) es el punto de corte para iniciar pruebas como la espirometría o biológicos como Omalizumab.", 
        source: "GPC-SS-009-20, Tratamiento del asma en edad pediátrica, 2020, Evidencias y Recomendaciones: Inmunoterapia, Página 32." 
    },
    {

                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('00920Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('00920LastQId', currentQuestionId);
                else localStorage.removeItem('00920LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('00920Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

</body>
</html>
