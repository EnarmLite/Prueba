<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300 h-[100dvh] overflow-hidden">

            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 mt-2 space-y-3">
                <button id="dark-mode-toggle" class="w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 font-semibold py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content" class="flex-1 h-[100dvh] overflow-y-auto overscroll-y-contain p-4 sm:p-6 lg:p-8 transition-all duration-300 relative bg-slate-50 dark:bg-slate-950">
            
            <button id="dashboard-button" onclick="displayQuestion(null)" class="hidden fixed top-4 left-4 lg:left-[22rem] bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-300" title="Ver Tablero General">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
            </button>

            </div>
            
            <div id="module-display" class="transition-opacity duration-300 pb-12"></div>
        </main>
        
        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-slate-900/40 z-20 backdrop-blur-sm"></div>

    <!-- MODALES -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">

                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>

    </div>

            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Finalizar Simulador</h3>

            <div class="flex gap-3">
                <button id="cancel-finish" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Seguir contestando</button>
                <button id="confirm-finish" class="flex-1 py-2 bg-emerald-500 text-white rounded-lg text-sm font-bold hover:bg-emerald-600 transition-colors">Sí, Calificar</button>
            </div>
        </div>
    </div>

    <script>

        const casesData = [
            {
                id: 1,
                caseText: "Primigesta de 25 años cursa trabajo de parto espontáneo. Embarazo de 40 semanas. Signos vitales: TA 110/70 mmHg, FC 78 lpm, FR 18 rpm, Temp 36.5 °C. Exploración física: FCF 145 lpm. Tacto vaginal: dilatación de 7 cm, borramiento 90%, membranas íntegras. Se rehúsa a la analgesia neuroaxial, solicitando opciones físicas para mitigar el dolor. Evoluciona a periodo expulsivo adoptando de forma libre la posición de cuclillas. Nace producto único vivo, vigoroso, con llanto enérgico inmediato y líquido amniótico claro.",
                source: "GPC IMSS-052-19, Vigilancia y atención amigable en el trabajo de parto en embarazo de bajo riesgo.",
                questions: [
                    {
                        question: "Ante la negativa de analgesia neuroaxial, ¿cuál intervención mecánica tiene eficacia demostrada para reducir la percepción del dolor durante esta fase del parto?",
                        options: [
                            "Masaje fúndico uterino",
                            "Ejercicios con pelota obstétrica",
                            "Decúbito lateral izquierdo continuo",
                            "Presión suprapúbica intermitente"
                        ],
                        answer: 1,
                        justification: "La distensión y el rebote biomecánico al sentarse sobre la pelota facilitan el acomodo pélvico de la presentación cefálica, disminuyendo las aferencias nociceptivas del primer periodo de forma no de carácter invasivo.<br><br><b>Perla ENARM:</b> La implementación del uso de la pelota obstétrica puede ser una estrategia para disminuir el dolor durante el trabajo de parto.<br><br><b>Análisis de Distractores:</b> El masaje fúndico (A) solo se utiliza posparto para revertir atonía uterina. El decúbito lateral (C) optimiza el flujo placentario, pero no tiene impacto analgésico primario fuerte. La presión suprapúbica (D) es una maniobra para distocia de hombros."
                    },
                    {
                        question: "La paciente decidió cursar el periodo expulsivo en posición de cuclillas. ¿Cuál es el beneficio biomecánico de esta postura vertical?",

                            "Prevención de hemorragia posparto",
                            "Disminución de desgarros de segundo grado",
                            "Reducción en la duración del segundo periodo",
                            "Prevención absoluta de distocia de hombros"
                        ],
                        answer: 2,
                        justification: "La postura en cuclillas vertical suma el vector de la gravedad a la presión de la presentación cefálica, lo que acorta el tiempo de expulsión y disminuye la tasa de episiotomías.<br><br><b>Perla ENARM:</b> La posición vertical se asoció con una reducción en la duración del segundo período del trabajo de parto y una reducción en las episiotomías.<br><br><b>Análisis de Distractores:</b> La postura vertical no previene la hemorragia posparto (A). Paradójicamente, la posición vertical aumenta ligeramente el riesgo de desgarros perineales de segundo grado (B). La distocia de hombros (D) no se previene de forma absoluta con la gravedad."
                    },
                    {
                        question: "Dado el estado vigoroso del recién nacido, se retrasa el pinzamiento del cordón umbilical por más de 60 segundos. ¿Qué patología nutricional específica previene esta intervención entre los 3 y 6 meses de edad?",
                        options: [
                            "Deficiencia de hierro",
                            "Hipoglucemia transitoria",
                            "Enterocolitis necrotizante",
                            "Ictericia neonatal grave"
                        ],
                        answer: 0,
                        justification: "El pinzamiento tardío permite la transferencia fisiológica de un volumen extra de sangre placentaria, proveyendo reservas eritrocitarias y férricas que protegen el desarrollo hematológico de la primera infancia.<br><br><b>Perla ENARM:</b> Los bebés con pinzamiento temprano del cordón umbilical tuvieron el doble de probabilidades de tener deficiencia de hierro entre los tres y los seis meses en comparación con el grupo de pinzamiento tardío.<br><br><b>Análisis de Distractores:</b> La hipoglucemia (B) se previene con el inicio de lactancia. La enterocolitis (C) disminuye con el aporte de calostro. La ictericia (D) puede, al contrario, presentar un incremento marginal secundario a la policitemia transitoria."
                    },
                    {
                        question: "Se inicia el contacto piel con piel ininterrumpido en la primera hora de vida para instaurar la lactancia. ¿Cuál es el impacto epidemiológico de esta acción en el neonato?",
                        options: [
                            "Disminuye 50% la ictericia fisiológica",
                            "Previene la aparición de asma infantil",
                            "Evita el síndrome de muerte súbita",
                            "Reduce 33% la mortalidad neonatal"
                        ],
                        answer: 3,
                        justification: "El calostro provee IgA secretora, inicia la colonización de microbiota saludable y estabiliza la glucemia y termorregulación del recién nacido, impactando en la reducción de muertes tempranas.<br><br><b>Perla ENARM:</b> Los neonatos en los que se inició la lactancia en la primer hora de nacidos tuvieron 33% menor riesgo de mortalidad neonatal en comparación con los que iniciaron la lactancia entre las 2 y 23 horas.<br><br><b>Análisis de Distractores:</b> El impacto crítico inmediato de la lactancia en la primera hora es sobre la mortalidad neonatal aguda (D). La ictericia (A) y el síndrome de muerte súbita (C) poseen etiologías multifactoriales independientes del minuto exacto de apego."
                    },
                    {
                        question: "As parte de la atención rutinaria del recién nacido sano en la sala de labor, ¿qué quimioprofilaxis obligatoria debe administrarse para prevenir discrasias sanguíneas?",
                        options: [
                            "Vitamina K un miligramo intramuscular",
                            "Fitomenadiona oral dosis única",
                            "Cloranfenicol oftálmico una gota",
                            "Tocoferol un miligramo intravenoso"
                        ],
                        answer: 0,
                        justification: "Todos los neonatos nacen con un déficit fisiológico de factores de coagulación dependientes de vitamina K por ausencia de microbiota bacteriana intestinal. La aplicación universal revierte el riesgo hemorrágico.<br><br><b>Perla ENARM:</b> Se recomienda que a todos los recién nacidos se les administre 1 mg de vitamina K intramuscular después del nacimiento, como profilaxis para enfermedades hemorrágicas.<br><br><b>Análisis de Distractores:</b> La vía oral (B) no es el estándar recomendado para prevención universal por su absorción variable. El cloranfenicol (C) previene la oftalmía gonocócica, no discrasias hemorrágicas. El tocoferol (D) es la vitamina E."
                    }
                ]

{
    id: 2,
    caseText: "Hombre de 32 años, primogénito, acude por presentar congestión nasal severa, prurito intenso y rinorrea de 8 meses de evolución. Refiere pobre respuesta a monoterapia con esteroide nasal prescrito hace 6 semanas. Exploración Física: TA 120/80 mmHg, FC 78 lpm, FR 14 rpm, Temp 36.6 °C. Se observan ojeras alérgicas marcadas. Rinoscopia anterior bilateral: hipertrofia severa de cornetes inferiores que ocluye el 80% de la luz nasal, mucosa pálida, con escasa retracción tras la aplicación de vasoconstrictor tópico. Orofaringe con descarga retronasal hialina crónica. Otoscopia normal. Campos pulmonares con murmullo vesicular adecuado y sin sibilancias.",
    source: "IMSS-041-08, Diagnóstico y Tratamiento de Rinitis Alérgica.",
    questions: [
        {
            question: "¿Cuál de los siguientes antecedentes epidemiológicos del paciente se establece normativamente como un factor de riesgo para desarrollar esta enfermedad?",
            options: [
                "Ser el primogénito",
                "Sexo femenino en la infancia",
                "Ser el hijo menor",
                "Esquema de vacunación incompleto"
            ],
            answer: 0,
            justification: "El orden de nacimiento afecta la exposición temprana a patógenos maternos y ambientales. Ser el primer hijo limita el contacto cruzado inicial con otros niños, lo que favorece una desviación de la respuesta inmunológica hacia el fenotipo T cooperador 2, incrementando la incidencia de atopia.<br><br><b>Perla ENARM:</b> Los factores de riesgo que se han asociado con rinitis alérgica son: historia familiar de atopia, sexo masculino, ser primogénito, uso temprano de antibióticos, madre fumadora durante el primer año de vida y niveles de Inmunoglobulina E sérica mayores a 100 antes de los 6 años de edad.<br><br><b>Análisis de Distractores:</b> Ser el hijo menor otorga un factor protector por la exposición temprana a infecciones traídas por los hermanos mayores (hipótesis de la higiene). En la etapa infantil, el sexo masculino tiene mayor riesgo, no el femenino. Un esquema de vacunación incompleto no forma parte de la etiología primaria del fenotipo alérgico documentada en la norma clínica."
        },
        {
            question: "Pese a la severidad obstructiva y la cronicidad del cuadro clínico en este paciente, ¿qué intervención diagnóstica no se recomienda solicitar de forma rutinaria para el abordaje primario según la guía?",
            options: [
                "Pruebas cutáneas de alergia",
                "Cuestionario clínico de tamizaje",
                "Tomografía computarizada de cráneo",
                "Inmunoglobulina E sérica específica"
            ],
            answer: 2,
            justification: "La enfermedad alérgica pura es un diagnóstico de mucosas basado en la clínica. Las imágenes estructurales no aportan información al diagnóstico atópico primario, someten al paciente a radiación y aumentan el costo; se reservan exclusivamente ante alta sospecha de tumores o poliposis obstructiva confirmada.<br><br><b>Perla ENARM:</b> No se recomienda el uso rutinario de estudios de imagen u otros estudios como rinometría acústica, las pruebas olfatorias, la determinación de los niveles de óxido nítrico nasal, las pruebas de alergia alimentaria y las pruebas de provocación nasal con alérgenos para el diagnóstico de rinitis alérgica.<br><br><b>Análisis de Distractores:</b> Las pruebas cutáneas y la serología de Inmunoglobulina E son el estándar de oro en pacientes con falla al tratamiento y se requieren para planear inmunoterapia. El cuestionario clínico (Score for Allergic Rhinitis) es la herramienta inicial recomendada por la guía para fundamentar la alta probabilidad de la patología."
        },
        {
            question: "Si se planteara reestructurar el manejo médico basal del paciente, ¿qué grupo farmacológico no se debe recomendar como terapia de primera línea?",
            options: [
                "Antihistamínicos nasales",
                "Antagonistas del receptor de leucotrieno",
                "Corticosteroides nasales",
                "Antihistamínicos orales"
            ],
            answer: 1,
            justification: "Fármacos como el montelukast tienen una eficacia analítica muy inferior para el control de los síntomas nasales frente a los esteroides tópicos o los antihistamínicos. Su uso de primera intención retrasa el control inflamatorio y debe limitarse a casos acompañados de hiperreactividad bronquial documentada.<br><br><b>Perla ENARM:</b> No se deben recomendar antagonistas del receptor de leucotrieno como primera línea en el tratamiento de pacientes con Rinitis Alérgica.<br><br><b>Análisis de Distractores:</b> Los corticosteroides nasales son la piedra angular y la terapia de mayor eficacia para fenotipos persistentes. Los antihistamínicos orales son excelentes fármacos de primera elección para estornudos y prurito. Los antihistamínicos nasales son alternativas locales que han demostrado rápida acción clínica y pueden indicarse de inicio."
        },
        {
            question: "Ante la falla documentada a la monoterapia con esteroide tópico por 6 semanas, ¿cuál es el siguiente escalón farmacológico normado que puedes intentar?",

                "Antibiótico empírico por 14 días",
                "Terapia farmacológica combinada"
            ],
            answer: 3,
            justification: "Cuando el corticoide tópico aislado no logra abatir el remodelamiento inflamatorio de la mucosa tras un mes de uso, el algoritmo exige potenciar el efecto sumando un mecanismo de acción diferente, típicamente añadiendo un antihistamínico intranasal al esteroide nasal para control dual.<br><br><b>Perla ENARM:</b> Los médicos pueden recomendar terapia farmacológica combinada en pacientes con rinitis alérgica que presentaron falla a la monoterapia.<br><br><b>Análisis de Distractores:</b> La inmunoterapia no es un escalón farmacológico agudo y requiere indicación alergológica especializada tras protocolo diagnóstico. Los esteroides sistémicos de depósito generan graves efectos adversos metabólicos y no se norman como abordaje ambulatorio rutinario. El uso de antibióticos carece de sustento en una inflamación atópica mediada por Inmunoglobulina E."
        },
        {
            question: "Si a pesar de agotar los recursos de la farmacoterapia intensiva, este paciente continúa con taponamiento nasal estructural, ¿cuál es la intervención quirúrgica de elección a la que debe referirse?",
            options: [
                "Resección de cornetes superiores",
                "Septoplastia cartilaginosa",
                "Reducción de cornetes inferiores",
                "Polipectomía maxilar endoscópica"
            ],
            answer: 2,
            justification: "El cornete inferior posee el mayor lecho vascular dependiente de histamina en la fosa nasal. Ante un estado crónico, el tejido eréctil y óseo sufre hipertrofia irreversible que ocluye la vía aérea de forma mecánica, haciendo inútil el tratamiento médico y obligando a la resección quirúrgica por otorrinolaringología.<br><br><b>Perla ENARM:</b> Se deben referir a cirugía para una reducción de cornetes inferiores a los pacientes con rinitis alérgica con síntomas nasales persistentes (obstructivos) e hipertrofia de cornetes que hayan presentado falla al tratamiento farmacológico.<br><br><b>Análisis de Distractores:</b> Los cornetes superiores no intervienen en el flujo aerodinámico principal ni son el sitio diana de la enfermedad alérgica. La septoplastia corrige deflexiones óseo-cartilaginosas, no la inflamación mucosa del cornete. La polipectomía aplica exclusivamente para fenotipos asociados a pólipos, que en la rinoscopia de este paciente no se documentaron."
        }
    ]

            justification: "La modalidad diagnóstica óptima en mujeres embarazadas durante el primer y segundo trimestre es la ecografía, ya que carece de radiación ionizante y ofrece una sensibilidad del 86%. Permite además la evaluación directa de la viabilidad y anatomía fetal.<br><br><b>Perla ENARM:</b> La ultrasonografía tiene una sensibilidad de 86% para el diagnóstico de apendicitis aguda, por seguridad es el método ideal a utilizar en la paciente embarazada principalmente durante el primero y segundo trimestre aunque se limita durante el tercer trimestre por el crecimiento uterino.<br><br><b>Análisis de Distractores:</b> La tomografía (opción A) expone al feto a 300 milirads; está reservada estrictamente como segunda línea ante ecografías no concluyentes después de la semana 20 para evitar teratogenicidad innecesaria. La resonancia magnética (opción B) es útil, pero no es la primera línea propuesta en la evaluación inicial de urgencias por esta guía. La radiografía simple (opción D) no tiene especificidad ni utilidad anatómica y expone al feto a radiación sin beneficio comprobado."
        },
        {

                    const cData = casesData[caseIdx];

        function navigateCase(currentCaseId, direction) {
            let targetCaseId = currentCaseId;
            if (direction === 'prev' && currentCaseId > 1) {
                targetCaseId = currentCaseId - 1;
            } else if (direction === 'next' && currentCaseId < casesData.length) {
                targetCaseId = currentCaseId + 1;
            } else {
                displayQuestion(null); 
                return;
            }
            const targetGlobalQId = (targetCaseId - 1) * QUESTIONS_PER_CASE + 1;
            displayQuestion(targetGlobalQId);
        }

        function getQBoxClass(globalId, isActive) {
            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-[10px] sm:text-xs cursor-pointer transition-all select-none border ";
            if (isActive) base += "ring-4 ring-blue-500 shadow-md z-10 border-blue-500 dark:border-blue-400 ";

            const state = userProgress[globalId];
            const caseIdx = Math.floor((globalId - 1) / QUESTIONS_PER_CASE);
            const qIdx = (globalId - 1) % QUESTIONS_PER_CASE;
            const cData = casesData[caseIdx];
            
            if (!cData) return base + "bg-slate-100 text-slate-300";

            if (!examState.isFinished) {
                if (!state || !state.answered) {
                    return base + "bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-200 dark:bg-slate-800/50 dark:text-slate-500 dark:border-slate-700/50 dark:hover:bg-slate-700";
                } else {
                    return base + "bg-slate-600 text-white border-slate-700 dark:bg-slate-700 dark:border-slate-600 shadow-inner";
                }
            } 
            else {
                if (!state || !state.answered) {
                    return base + "bg-slate-100 text-slate-400 border-slate-200 dark:bg-slate-800 dark:text-slate-500 dark:border-slate-700";
                } else {
                    const isCorrect = state.selectedOption === cData.questions[qIdx].answer;
                    if (isCorrect) {
                        return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
                    } else {
                        return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
                    }
                }
            }
        }

            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = globalId ? parseInt(globalId) : null;
                
                if (currentQuestionId) {
                    localStorage.setItem('simuladorEL6LastQId', currentQuestionId);
                } else {
                    localStorage.removeItem('simuladorEL6LastQId');
                }

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                if (window.innerWidth >= 1024) {
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');
                    dashboardBtn.classList.add('lg:left-[22rem]');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const caseIdx = Math.floor((currentQuestionId - 1) / QUESTIONS_PER_CASE);
                const cData = casesData[caseIdx];
                
                if (!cData) return displayQuestion(null);
                
                renderCaseLayout(cData, currentQuestionId);
                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                setTimeout(() => {
                    const targetCard = document.getElementById(`q-card-${currentQuestionId}`);
                    if (targetCard) {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    }
                }, 50);

            }, 150); 
        }

        function renderCaseLayout(cData, activeGlobalId) {
            let html = `
                <div class="flex flex-col gap-6 max-w-5xl mx-auto items-center">
                    
                    <!-- COLUMNA: TEXTO DEL CASO CLÍNICO -->
                    <div class="w-full bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-md border border-slate-200 dark:border-slate-800 transition-all duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-block bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-900/30">
                                Caso Clínico Seriado
                            </span>
                            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                                Bloque #${cData.id}
                            </span>
                        </div>
                        <p class="text-slate-800 dark:text-slate-200 text-sm sm:text-base leading-relaxed font-medium">
                            ${cData.caseText}
                        </p>
                        ${examState.isFinished ? `
                            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                <span class="text-slate-500">Bibliografía:</span> ${cData.source}
                            </div>
                        ` : ''}
                    </div>

                    <!-- COLUMNA: BLOQUE DE LAS 5 PREGUNTAS ASOCIADAS -->
                    <div class="w-full space-y-5">
            `;

            cData.questions.forEach((q, idx) => {
                const globalQId = (cData.id - 1) * QUESTIONS_PER_CASE + idx + 1;
                const qState = userProgress[globalQId];
                const hasAnswered = qState && qState.answered;
                const userAnswer = hasAnswered ? qState.selectedOption : null;
                
                let cardStyle = "border-slate-200 dark:border-slate-800/80";
                if (globalQId === activeGlobalId) {
                    cardStyle = "border-blue-500 dark:border-blue-500 ring-2 ring-blue-500/10";
                }
                if (examState.isFinished && hasAnswered) {
                    cardStyle = (userAnswer === q.answer) ? "border-l-4 border-emerald-500" : "border-l-4 border-rose-500";
                }

                html += `
                    <div id="q-card-${globalQId}" class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-2xl shadow-sm border ${cardStyle} transition-all">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[9px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">
                                PREGUNTA ${globalQId}
                            </span>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 mb-4 leading-snug">${q.question}</h3>
                        <form id="q-form-${globalQId}" class="space-y-2.5">
                `;

                q.options.forEach((opt, i) => {
                    if (examState.isFinished) {
                        let optClasses = "flex items-start p-3 border rounded-xl text-xs sm:text-sm ";
                        let icon = "";
                        
                        if (i === q.answer) {
                            optClasses += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 font-semibold";
                            icon = `<svg class="w-4 h-4 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                        } else if (i === userAnswer) {
                            optClasses += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                            icon = `<svg class="w-4 h-4 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                        } else {
                            optClasses += "bg-slate-50 border-slate-100 dark:bg-slate-800/30 dark:border-slate-800/50 opacity-50 text-slate-400";
                        }

                        html += `
                            <div class="${optClasses}">
                                <span class="leading-snug pr-3">${opt}</span>
                                ${icon}
                            </div>
                        `;
                    } else {
                        const checkedStr = (hasAnswered && userAnswer === i) ? 'checked' : '';
                        html += `
                            <label class="flex items-start p-3 border border-slate-200 dark:border-slate-800 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/40 has-[:checked]:bg-blue-50/80 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/20 text-xs sm:text-sm shadow-sm" onclick="autoSaveAnswer(${globalQId})">
                                <input type="radio" name="option" value="${i}" ${checkedStr} class="mt-0.5 h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-700 cursor-pointer">
                                <span class="ml-2.5 text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `;
                    }
                });

                html += `</form>`;

                if (examState.isFinished) {
                    html += `
                        <div class="bg-blue-50/60 dark:bg-slate-800/50 border border-blue-100/50 dark:border-slate-800 rounded-xl p-4 text-xs sm:text-sm mt-4">
                            <h4 class="font-bold text-blue-800 dark:text-blue-400 mb-1 flex items-center gap-1 uppercase tracking-wider text-[10px]">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Justificación Médica
                            </h4>
                            <p class="text-slate-600 dark:text-slate-300 leading-relaxed">${q.justification}</p>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            const isLastCase = cData.id === casesData.length;

            html += `
                        <!-- CONTROLES DE FLUJO EN CASOS -->
                        <div class="flex justify-between items-center pt-4 mt-6 border-t border-slate-200 dark:border-slate-800">
                            <button onclick="navigateCase(${cData.id}, 'prev')" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                                Caso Anterior
                            </button>
                            
                            ${examState.isFinished ? `
                                ${!isLastCase ? `
                                    <button onclick="navigateCase(${cData.id}, 'next')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
                                        Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                    </button>
                                ` : `
                                    <button onclick="displayQuestion(null)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider shadow-sm">
                                        Ver Calificaciones
                                    </button>
                                `}
                            ` : `
                                <button onclick="navigateCase(${cData.id}, 'next')" class="bg-blue-600 dark:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-md hover:bg-blue-700 dark:hover:bg-blue-400 transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5">
                                    Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('module-display').innerHTML = html;
        }

        function autoSaveAnswer(globalId) {
            if(examState.isFinished) return;
            const form = document.getElementById(`q-form-${globalId}`);
            if (!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (selected) {
                userProgress[globalId] = { answered: true, selectedOption: parseInt(selected.value) };
                saveState();
                updateProgressBar();
                renderSidebarGrid();
            }
        }

        function updateProgressBar() {
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = totalQuestions > 0 ? Math.round((ans / totalQuestions) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; 
            }
        }

        function saveState() {
            try { localStorage.setItem('simuladorEL6Progress', JSON.stringify(userProgress)); } catch(e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('simuladorEL6Progress');
                userProgress = saved ? JSON.parse(saved) : {};
                const savedState = localStorage.getItem('simuladorEL6ExamState');
                if (savedState) examState = JSON.parse(savedState);
            } catch(e) { userProgress = {}; examState = { isFinished: false }; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
