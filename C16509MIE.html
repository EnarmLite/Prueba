    <script>
        const questionsData = [

    {
        id: 1,
        question: "En pacientes masculinos con sospecha de Enfermedad de Fabry, ¿cuál es el estudio de laboratorio inicial de elección?",
        options: [
            "Secuenciación del gen GLA",
            "Actividad de alfa-galactosidasa A",
            "Biopsia de tejido renal",
            "Determinación de globotriaosilceramida en plasma"
        ],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, el primer paso diagnóstico ante la sospecha de esta tesaurismosis en varones consiste en cuantificar la actividad enzimática lisosomal, la cual suele ser nula o menor al 1% en la variante clásica.<br><br>Perla ENARM: \"Recomendamos el uso de medición de la actividad enzimática de AGLA como estudio inicial en hombres; en caso de actividad disminuida (positivo para la enfermedad) se realiza confirmación con el análisis de mutación\".<br><br>Análisis de Distractores: La secuenciación del gen GLA (Opción A) es el estudio confirmatorio genético definitivo pero se reserva de forma secundaria en hombres una vez documentada la deficiencia bioquímica. La biopsia renal (Opción C) evalúa el daño a órgano blanco y no es de primera intención. La determinación de globotriaosilceramida (Opción D) apoya el seguimiento terapéutico pero no define el diagnóstico bioquímico de sospecha.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Diagnóstico de laboratorio, Página 16."
    },
    {
        id: 2,
        question: "En pacientes femeninas con sospecha de Enfermedad de Fabry, ¿cuál es el estudio considerado de elección para confirmar el diagnóstico?",
        options: [
            "Análisis molecular del gen GLA",
            "Medición de alfa-galactosidasa en leucocitos",
            "Determinación de globotriaosilceramida en orina",
            "Ecocardiograma con Doppler tisular"
        ],
        answer: 0,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, las pacientes portadoras (heterocigotas) pueden cursar con manifestaciones clínicas graves a pesar de presentar niveles circulantes de enzima completamente normales, debido a la lyonización aleatoria del cromosoma X.<br><br>Perla ENARM: \"En las mujeres es obligatorio realizar siempre un análisis molecular del gen AGLA para diagnosticar la enfermedad.\"<br><br>Análisis de Distractores: La medición de alfa-galactosidasa en leucocitos (Opción B) carece de valor clínico en mujeres por los falsos negativos inherentes a la lyonización. El análisis de orina (Opción C) y el ecocardiograma (Opción D) identifican secuelas de depósito orgánico pero no confirman la base diagnóstica molecular de certeza.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Diagnóstico de laboratorio, Página 15."
    },
    {
        id: 3,
        question: "En Enfermedad de Fabry, ¿cuál es el patrón de herencia genético característico?",
        options: [
            "Autosómico dominante",
            "Autosómico recesivo",
            "Ligado al cromosoma X recesivo",
            "Herencia mitocondrial"
        ],
        answer: 2,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, esta patología es un error innato del metabolismo que se transmite a través de un gen defectuoso en el cromosoma sexual X, lo que causa la manifestación fenotípica completa en hombres hemidigotos.<br><br>Perla ENARM: \"La EF es una enfermedad hereditaria ligada al cromosoma X recesiva, producida por la deficiencia de la enzima lisosomal AGLA, que afecta de forma predominante a los varones.\"<br><br>Análisis de Distractores: Los patrones autosómicos dominante (Opción A) y recesivo (Opción B) quedan descartados al encontrarse el gen mutado (GLA) en el locus Xq22.1. La herencia mitocondrial (Opción D) asocia transmisión exclusivamente materna.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Fenotipo, genotipo y consejo genético, Página 16."
    },
    {
        id: 4,
        question: "En Enfermedad de Fabry, ¿cuál es el sustrato lipídico neutro que se deposita progresivamente en los lisosomas de células endoteliales vasculares?",
        options: [
            "Glucocerebrósido",
            "Esfingomielina",
            "Globotriaosilceramida",
            "Galactosilceramida"
        ],
        answer: 2,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, la carencia funcional de la enzima alfa-galactosidasa A bloquea la degradación fisiológica de los glicoesfingolípidos, provocando la infiltración tisular multisistémica de globotriaosilceramida (Gb3).<br><br>Perla ENARM: \"Esto determina el depósito de glucoesfingo-lípidos neutros (principalmente globotriaosilceramida [Gb3]) de forma prominente en lisosomas...\".<br><br>Análisis de Distractores: El glucocerebrósido (Opción A) se deposita en la Enfermedad de Gaucher. La esfingomielina (Opción B) se almacena en la Enfermedad de Niemann-Pick. La galactosilceramida (Opción D) se vincula a la Enfermedad de Krabbe.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Definición, Página 11."
    },
    {
        id: 5,
        question: "En Enfermedad de Fabry, ¿cuál es el estudio considerado el estándar de oro para diagnosticar con precisión la nefropatía de Fabry?",
        options: [
            "Proteinuria de 24 horas",
            "Biopsia renal",
            "Resonancia magnética de polo renal",
            "Depuración de creatinina"
        ],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, la demostración histopatológica ultraestructural es el método definitivo para evidenciar la afectación de podocitos y células glomerulares por depósitos lipídicos en estadios tempranos.<br><br>Perla ENARM: \"El diagnóstico de nefropatía de Fabry se realiza mediante biopsia renal, con microscopia óptica y electrónica, de forma ideal utilizando azul de toluidina\".<br><br>Análisis de Distractores: La proteinuria de 24 horas (Opción A) y la depuración de creatinina (Opción D) valoran el grado de daño funcional o insuficiencia instalada, pero carecen de especificidad diagnóstica. La resonancia magnética (Opción C) no permite resolver cambios celulares ultraestructurales.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Manifestaciones renales, Página 20."
    },
    {
        id: 6,
        question: "En la microscopía electrónica de una biopsia de paciente con Enfermedad de Fabry, ¿cuál es el hallazgo patognomónico celular característico?",
        options: [
            "Células de Gaucher espumosas",
            "Inclusiones de cuerpos de cebra",
            "Depósitos de amiloide rojo congo",
            "Nódulos de Kimmelstiel-Wilson"
        ],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, la acumulación laminar de glicoesfingolípidos en el citoplasma celular genera imágenes laminares concéntricas que semejan el rayado de una cebra, visible únicamente bajo alta resolución electrónica.<br><br>Perla ENARM: \"En la microscopia electrónica: se observan las inclusiones citoplasmáticas de GB3, cuerpos lamelares con cuerpo de zebra y borramiento del pedicelos\".<br><br>Análisis de Distractores: Las células de Gaucher (Opción A) corresponden a depósitos de glucosilceramida en macrófagos. El amiloide (Opción C) asocia birrefringencia verde manzana clásica de amiloidosis. Los nódulos de Kimmelstiel-Wilson (Opción D) son lesiones típicas de la nefropatía diabética nodular.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Manifestaciones renales, Página 20."
    },
    {
        id: 7,
        question: "En un paciente con Enfermedad de Fabry que presenta albuminuria mayor a 300 mg/24 horas, ¿cuál es el manejo farmacológico de primera línea recomendado por la GPC?",
        options: [
            "Terapia dual con inhibidor y bloqueador",

            "Espironolactona oral",
            "Hidroclorotiazida diaria"
        ],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, la estabilización de la membrana de filtración y la nefroprotección exige el uso prioritario de fármacos bloqueadores del sistema renina-angiotensina-aldosterona (IECA o ARA II) en monoterapia.<br><br>Perla ENARM: \"Es recomendable que IECA o ARAB sean usados en pacientes diabéticos y no diabéticos con enfermedad renal crónica y excreción de albumina urinaria de >300 mg/ 24 horas ( o equivalente*)\".<br><br>Análisis de Distractores: La terapia dual combinada (Opción A) no se aconseja por sus graves riesgos colaterales. La espironolactona (Opción C) y la tiazida (Opción D) son diuréticos que no ejercen el rol protector de primera línea frente a albuminuria clínica.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Tratamiento renal, Página 39."
    },
    {
        id: 8,
        question: "¿Por qué motivo la GPC de Enfermedad de Fabry contraindica la terapia dual que combina un IECA y un ARA II en pacientes con daño renal?",
        options: [
            "Elevada incidencia de pancreatitis aguda",
            "Riesgo de hiperpotasemia e hipotensión",
            "Inducción de fibrosis miocárdica acelerada",
            "Bloqueo total de la absorción de TRE"
        ],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, la inhibición simultánea de receptores y de la enzima de angiotensina genera inestabilidad hemodinámica y retención crítica de potasio sin aportar un beneficio superior en el pronóstico renal a largo plazo.<br><br>Perla ENARM: \"La combinación de terapia con IECA Y ARA2 comparada con monoterapia también incrementa el riesgo de hiperpotasemia e hipotensión (3.4 y 4.6 %)\".<br><br>Análisis de Distractores: Los riesgos de pancreatitis (Opción A), fibrosis cardíaca (Opción C) o interferencia directa con la infusión enzimática (Opción D) no están asociados biológica o clínicamente con el doble bloqueo farmacológico del eje.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Tratamiento renal, Página 39."
    },
    {
        id: 9,
        question: "En el abordaje clínico de un paciente con sospecha de Enfermedad de Fabry, ¿cuál es el primer paso obligatorio que debe realizar el médico respecto a su entorno familiar?",

        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, la naturaleza hereditaria y ligada al cromosoma X hace imperativo indagar la herencia vertical y colateral para detectar familiares asintomáticos o en riesgo clínico de falla orgánica.<br><br>Perla ENARM: \"En todo paciente con sospecha de EF debe realizarse historia clínica incluyendo el árbol genealógico, el cual preferentemente debe ser realizado por médicos especialistas quienes podrán otorgar consejo genético.\"<br><br>Análisis de Distractores: El tamizaje a vecinos (Opción B) es inviable por falta de nexo biológico. Los tamizajes escolares extensos (Opción C) o las pruebas preimplantacionales (Opción D) representan herramientas de planificación familiar avanzada o investigación masiva, no la conducta inicial ante el caso sospechoso clínico.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Fenotipo, genotipo y consejo genético, Página 16."
    },
    {
        id: 10,
        question: "En Enfermedad de Fabry, ¿cuál es el fármaco de primera línea recomendado para el manejo sintomático del dolor neuropático periférico (acroparestesias)?",
        options: [
            "Carbamazepina",
            "Paracetamol",
            "Prednisona",
            "Amitriptilina"
        ],
        answer: 0,
        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, las crisis neuropáticas severas y el dolor crónico en remolinos responden adecuadamente a moduladores de canales de sodio como anticonvulsivantes estables orales.<br><br>Perla ENARM: \"Para el manejo del dolor neuropático se recomienda: Primera línea: carbamazepina Segunda línea: fenitoina, gabapentina, pregabalina.\"<br><br>Análisis de Distractores: El paracetamol (Opción B) ejerce nulo efecto analgésico a nivel de las fibras nerviosas finas afectadas. La prednisona (Opción C) no es un neuromodulador. La amitriptilina (Opción D) es una alternativa de soporte pero catalogada por la GPC como un adyuvante complementario diario secundario.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Tratamiento neuropático, Página 41."
    },
    {
        id: 11,
        question: "En pacientes pediátricos diagnosticados con Enfermedad de Fabry, ¿a partir de qué edad se recomienda iniciar de manera bianual el ecocardiograma y el electrocardiograma de seguimiento?",
        options: [
            "5 años",
            "10 años",
            "12 años",
            "15 años"
        ],
        answer: 1,

        question: "En niños varones presintomáticos diagnosticados con Enfermedad de Fabry mediante tamizaje familiar, ¿a partir de qué edad se debe considerar el inicio de la Terapia de Reemplazo Enzimático según la GPC?",

        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, el depósito patológico de glicoesfingolípidos se inicia desde la etapa fetal. En niños con variantes moleculares clásicas, iniciar la TRE de manera precoz previene la afección irreversible de los podocitos y disminuye la aparición de acroparestesias severas.<br><br>Perla ENARM: \"Solo en el caso de varones presintomaticos se debe considerar el inicio del TRE a partir de los 7 años\".<br><br>Análisis de Distractores: La edad de 5 años (Opción A) representa la edad límite para considerar el ajuste de proteinuria por peso y superficie corporal en pediatría. Los 10 años (Opción C) marcan el inicio de los tamizajes de ecocardiografía bianuales, y los 12 años (Opción D) no corresponden a una pauta de inicio estándar.",
        source: "IMSS-165-09, Diagnóstico, Tratamiento y Seguimiento multidisciplinario en enfermedad de Fabry, 2017, Terapia de reemplazo enzimático, Página 48."
    },
    {
        id: 30,

            "Evento vascular cerebral isquémico",

        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, el depósito masivo en miocardiocitos provoca disfunción diastólica restrictiva, hipertrofia miocárdica concéntrica, arritmias letales y muerte súbita, superando estadísticamente al daño renal como evento mortal primario.<br><br>Perla ENARM: \"La HVI es el diagnóstico guía en el marco de la miocardiopatía debida a Fabry... Las complicaciones cardiacas representan las principales causas de muerte de estos pacientes\".<br><br>Análisis de Distractores: El infarto cerebral (Opción A) representa una alta tasa de discapacidad y morbilidad neurológica pero no lidera las muertes. La insuficiencia renal terminal (Opción B) era la primera causa histórica de muerte antes de la disponibilidad universal de la diálisis y el trasplante. Las infecciones (Opción D) no guardan nexo fisiopatológico directo.",

    {

            "Mayor a 10 mm",

        justification: "Justificación: De acuerdo a la GPC de Enfermedad de Fabry, las fibras nerviosas delgadas que median la sensibilidad térmica y álgica son muy vulnerables a las variaciones térmicas sistémicas y al estrés metabólico, precipitando descargas paroxísticas desmielinizantes.<br><br>Perla ENARM: \"Estas se desencadenan característicamente durante el ejercicio, la fiebre y los cambios de temperatura en el ambiente\".<br><br>Análisis de Distractores: El reposo prolongado y el ayuno (Opción A) no asocian un estrés térmico capaz de desencadenar descargas en fibras amielínicas. El frío extremo (Opción B) genera hipersensibilidad pero no es el clásico desencadenante de las dolorosas crisis o acroparestesias súbitas. La dieta (Opción C) no se vincula a las crisis dolorosas físicas agudas.",

            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-sm cursor-pointer transition-all select-none border ";
            
            if (isActive) base += "ring-4 ring-purple-500 shadow-md z-10 border-purple-500 dark:border-purple-400 ";

            if (!state || !state.answered) {
                return base + "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700 dark:hover:bg-slate-700";

                return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
            } else {
                return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
            }
        }

                                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4 border ${badgeClass} transition-colors duration-500">
                                    ${badgeText}
                                </span>
                                <h1 class="text-3xl md:text-4xl lg:text-4xl font-extrabold tracking-tight mb-3 transition-colors duration-500 ${isAllCompleted ? 'text-emerald-400 drop-shadow-md' : ''}">${titleText}</h1>
                                <p class="text-slate-300 text-base md:text-lg font-medium max-w-lg mx-auto lg:mx-0 transition-colors duration-500">${descText}</p>
                                
                                <div class="mt-8 flex justify-center lg:justify-start">
                                    ${actionBtn}
                                </div>
                            </div>
                            
                            <!-- Tarjeta de Estadísticas Modificada -->
                            <div class="flex-shrink-0 bg-slate-800/50 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 flex flex-col sm:flex-row items-center shadow-2xl w-full lg:max-w-md">
                                <div class="grid grid-cols-3 gap-2 sm:gap-4 divide-x divide-white/20 w-full text-center">
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Respondidas</p>
                                        <p class="text-2xl sm:text-3xl font-black">${ans}<span class="text-xs sm:text-sm text-slate-500">/${total}</span></p>
                                    </div>
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Correctas</p>
                                        <p class="text-2xl sm:text-3xl font-black text-emerald-300">${correct}</p>
                                    </div>
                                    <div class="px-2">
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Rendimiento</p>
                                        <p class="text-2xl sm:text-3xl font-black text-yellow-300">${successRate}%</p>
                                        <p class="text-[8px] text-slate-400 mt-1 leading-tight">Aciertos vs Respondidas</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLERO VISIBLE Y SCROLLABLE -->
                    <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-slate-800 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <svg class="w-5 h-5 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-purple-100 dark:border-purple-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-purple-50 has-[:checked]:border-purple-400 dark:has-[:checked]:bg-purple-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-purple-600 focus:ring-purple-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-purple-600 dark:hover:bg-purple-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-fuchsia-600 hover:to-purple-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('16509Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('16509LastQId', currentQuestionId);
                else localStorage.removeItem('16509LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('16509Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    const firebaseConfig = {apiKey: "AIzaSyB26PT8kuB-0fxyUYgGk51yC1rAsW0dYj0", authDomain: "enarm-lite.firebaseapp.com", projectId: "enarm-lite", storageBucket: "enarm-lite.firebasestorage.app", messagingSenderId: "767032952477", appId: "1:767032952477:web:84347320ed3d376f7e7674", measurementId: "G-PVR3RBVNSV"};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.body.style.transition = 'opacity 0.1s ease';

            if(userDocSnap.exists()) {document.body.style.opacity = '1';} else {window.location.href = "index.html";}} else {window.location.href = "index.html";}
