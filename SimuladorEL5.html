<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300 h-[100dvh] overflow-hidden">

    <div id="app-container" class="relative h-full lg:flex">
        
        <!-- SIDEBAR: MAPA DE PREGUNTAS -->

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute right-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>

                <!-- Rejilla de 280 preguntas continuas -->
                <div id="sidebar-q-grid" class="grid grid-cols-[repeat(auto-fill,minmax(38px,1fr))] gap-1.5 p-1"></div>
            </div>
            
            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 mt-2 space-y-3">
                <button id="dark-mode-toggle" class="w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 font-semibold py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg id="sun-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="moon-icon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                    Alternar Tema
                </button>

                <button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full bg-white dark:bg-slate-800 text-red-500 border border-red-200 dark:border-red-900/50 font-semibold py-2.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reiniciar Simulador

            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content" class="flex-1 h-[100dvh] overflow-y-auto overscroll-y-contain p-4 sm:p-6 lg:p-8 transition-all duration-300 relative bg-slate-50 dark:bg-slate-950">
            
            <button id="dashboard-button" onclick="displayQuestion(null)" class="hidden fixed top-4 left-4 lg:left-[22rem] bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-300" title="Ver Tablero General">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
            </button>

            <button id="menu-toggle" class="hidden fixed top-4 right-4 lg:right-8 bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
            </button>

            <!-- Barra de Progreso General -->

            </div>
            
            <div id="module-display" class="transition-opacity duration-300 pb-12"></div>

        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-slate-900/40 z-20 backdrop-blur-sm"></div>

    <!-- MODALES -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Reiniciar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">Se borrará todo tu progreso y respuestas de los casos. ¿Deseas empezar desde cero?</p>
            <div class="flex gap-3">
                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>
        </div>
    </div>

    <div id="finish-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Finalizar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">¿Estás seguro de que deseas terminar? Se evaluarán todas tus respuestas y se liberará la justificación médica.</p>
            <div class="flex gap-3">
                <button id="cancel-finish" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Seguir contestando</button>
                <button id="confirm-finish" class="flex-1 py-2 bg-emerald-500 text-white rounded-lg text-sm font-bold hover:bg-emerald-600 transition-colors">Sí, Calificar</button>
            </div>
        </div>
    </div>

    <script>

        const casesData = [

            {
                id: 1,
                caseText: "Primigesta de 28 años en trabajo de parto activo. Embarazo de 40 semanas. Cuenta con analgesia neuroaxial epidural instalada hace 3 horas. Signos vitales: TA 120/80 mmHg, FC 85 lpm, FR 20 rpm, Temp 36.6 °C. Exploración física: FCF 145 lpm. Tacto vaginal: cérvix central con dilatación de 10 cm y borramiento del 100%, presentación cefálica en estación +1. Variedad de posición occipitoanterior. Distancia anovulvar de 2 cm (periné corto). Dinámica uterina con 4 contracciones en 10 minutos. La paciente refiere ausencia total de reflejo y sensación de pujo.",
                source: "GPC IMSS-052-19, Vigilancia y atención amigable en el trabajo de parto en embarazo de bajo riesgo.",
                questions: [
                    {
                        question: "Ante la dilatación completa y la ausencia de reflejo de pujo por el bloqueo epidural, ¿cuál es la conducta inicial indicada para el manejo del segundo periodo?",
                        options: [
                            "Iniciar pujo dirigido inmediato",
                            "Retrasar el pujo 1 a 2 horas",
                            "Suspender la analgesia epidural",
                            "Realizar episiotomía profiláctica inmediata"
                        ],
                        answer: 1,
                        justification: "El bloqueo del nervio pudendo por la anestesia retrasa el reflejo de Ferguson. Esperar permite que la contracción uterina guíe el descenso pasivo, previniendo la fatiga materna y reduciendo la tasa de partos instrumentados.<br><br><b>Perla ENARM:</b> Se recomienda retrasar, en una o dos horas, el momento de inicio del pujo materno durante el segundo periodo del trabajo de parto en mujeres con analgesia epidural.<br><br><b>Análisis de Distractores:</b> El pujo dirigido inmediato (A) es ineficaz sin sensibilidad pélvica y agota a la paciente. Suspender la analgesia (C) somete a dolor innecesario. La episiotomía (D) no sustituye la mecánica del descenso cefálico pasivo."
                    },
                    {
                        question: "Durante esta fase clínica (periodo expulsivo), ¿cuál es el intervalo de tiempo normado para evaluar la frecuencia cardiaca fetal?",
                        options: [
                            "Cada 5 minutos",
                            "Cada 15 minutos",
                            "Cada 30 minutos",
                            "Registro cardiotocográfico continuo"
                        ],
                        answer: 0,
                        justification: "El periodo expulsivo implica la máxima compresión cefálica y reducción del flujo placentario, elevando el riesgo de hipoxia. Por tanto, la periodicidad de la auscultación clínica se intensifica a cada 5 minutos al finalizar la contracción.<br><br><b>Perla ENARM:</b> Se recomienda escuchar intermitentemente la frecuencia cardiaca fetal al término de una contracción, cada 5 minutos.<br><br><b>Análisis de Distractores:</b> Los intervalos de 15 o 30 minutos (B, C) están normados exclusivamente para el primer periodo del trabajo de parto (fase latente o activa). El registro continuo (D) no se recomienda de rutina en bajo riesgo."
                    },
                    {
                        question: "En el momento del coronamiento cefálico, ¿cuál intervención física previene de forma específica la aparición de desgarros perineales de primer grado?",
                        options: [
                            "Presión fúndica sostenida",
                            "Episiotomía mediolateral",
                            "Maniobra de Ritgen",
                            "Masaje perineal continuo"
                        ],
                        answer: 2,
                        justification: "La maniobra de Ritgen modificada controla la velocidad de deflexión de la cabeza fetal y modula la tensión sobre el anillo vulvar, abatiendo significativamente las laceraciones superficiales de piel y mucosa.<br><br><b>Perla ENARM:</b> El uso de la maniobra de Ritgen se asoció a menor probabilidad de desgarros de primer grado.<br><br><b>Análisis de Distractores:</b> La presión fúndica (A) precipita el nacimiento e incrementa desgarros. La episiotomía (B) es un trauma quirúrgico de segundo grado. El masaje perineal continuo (D) otorga elasticidad, pero no contención mecánica en el coronamiento."
                    },
                    {
                        question: "Dado el hallazgo a la exploración de un periné corto, existe indicación selectiva para ampliar el canal. ¿Cuál es el abordaje de elección?",
                        options: [
                            "Episiotomía media",
                            "Incisión lateral paralela",
                            "Episiotomía mediolateral",
                            "Desgarro central fisiológico"
                        ],
                        answer: 2,
                        justification: "La episiotomía rutinaria está proscrita, pero un periné corto es indicación selectiva. El abordaje mediolateral desplaza el vector de fuerza hacia la fosa isquiorrectal, evitando una prolongación lineal hacia el esfínter anal.<br><br><b>Perla ENARM:</b> Puede valorarse la práctica de la episiotomía en casos de periné corto; presentación de cara, compuesta o de nalgas; así como ante la presencia de distocia de hombros o necesidad de parto instrumentado. Siempre deberá realizarse bajo analgesia adecuada, y la técnica recomendada es la mediolateral.<br><br><b>Análisis de Distractores:</b> La incisión media (A) o el dejar un desgarro libre (D) poseen alto riesgo de extensión hacia esfínter rectal (grados 3 y 4). Las incisiones puramente laterales (B) lesionan plexos vasculares."
                    },
                    {
                        question: "Si un miembro del equipo sugiere aplicar compresión manual intensa en el fondo uterino para acelerar la expulsión, ¿cuál es la lesión anatómica severa asociada?",
                        options: [
                            "Desgarro cervical",
                            "Inversión uterina aguda",
                            "Desgarro perineal superficial",
                            "Hematoma vulvar externo"
                        ],
                        answer: 0,
                        justification: "La maniobra de Kristeller impacta abruptamente el polo cefálico contra un cérvix que puede no estar retraído por completo, causando fuerzas de cizallamiento que desgarran el tejido cervical. Se considera violencia obstétrica.<br><br><b>Perla ENARM:</b> Se observó mayor número de desgarros cervicales en el grupo de pacientes a las que se les realizó presión fúndica; para facilitar el nacimiento, no se recomienda aplicar presión en el fondo del útero durante el periodo expulsivo (maniobra de Kristeller).<br><br><b>Análisis de Distractores:</b> La inversión uterina (B) se debe a tracción excesiva del cordón en el alumbramiento. Los desgarros perineales superficiales (C) o hematomas (D) dependen del periné y del coronamiento terminal."
                    }
                ]
            },






            {
                id: 2,
                caseText: "Hombre de 68 años, acude para revisión anual. Niega síntomas cardiovasculares o neurológicos. Antecedente de diabetes mellitus tipo 2 de 5 años de diagnóstico en tratamiento oral. Exploración física: TA brazo derecho 165/90 mmHg, TA brazo izquierdo 145/88 mmHg. Frecuencia cardíaca 78 lpm, frecuencia respiratoria 16 lpm. Índice de masa corporal 24 kg/m². Fondo de ojo sin exudados ni hemorragias. Ruidos cardíacos rítmicos, sin soplos cervicales ni abdominales. Resto de la exploración sin alteraciones. Exámenes recientes: glucosa en ayuno 110 mg/dl, creatinina sérica 1.0 mg/dl, tasa de filtrado glomerular 75 ml/min/1.73m².",
                source: "GPC-IMSS-076-21, Promoción, Prevención, Diagnóstico y Tratamiento de la Hipertensión Arterial en el Primer Nivel de Atención.",
                questions: [
                    {
                        question: "Durante la evaluación inicial de este paciente, ¿qué entidad clínica sugiere la asimetría tensional encontrada entre ambos brazos?",
                        options: [
                            "Coartación aórtica",
                            "Enfermedad ateromatosa",
                            "Disección aórtica aguda",
                            "Insuficiencia cardíaca"
                        ],
                        answer: 1,
                        justification: "La medición bilateral de la presión arterial es obligatoria en la valoración inicial. Una asimetría marcada se correlaciona con estenosis arterial por placas de ateroma en las arterias subclavia o braquial.<br><br><b>Perla ENARM:</b> \"Se recomienda una evaluación vascular a profundidad, de encontrar una diferencia de presión entre ambos brazos de más de 10 o de más de 15 mmHg. El presentar una diferencia de más de 15 mmHg entre ambos brazos indica un riesgo alto de enfermedad vascular y muerte.\"<br><br><b>Análisis de Distractores:</b> La coartación aórtica causa asimetría tensional entre miembros superiores e inferiores, no habitualmente entre ambos brazos, y es patología de adultos jóvenes o niños. La disección aórtica aguda causa asimetría tensional, pero se presenta como una urgencia hipertensiva con dolor torácico desgarrador, no en un paciente asintomático en revisión de rutina. La insuficiencia cardíaca reduce el gasto cardíaco general, pero no genera gradientes asimétricos entre extremidades."
                    },
                    {
                        question: "Calculando la presión de pulso en el brazo dominante de este paciente, ¿qué tipo de daño a órgano blanco confirma este hallazgo hemodinámico?",
                        options: [
                            "Nefropatía incipiente",
                            "Hipertrofia ventricular izquierda",
                            "Rigidez arterial",
                            "Enfermedad arterial periférica"
                        ],
                        answer: 2,
                        justification: "La presión de pulso (diferencia entre la presión sistólica y diastólica, en este caso 165 - 90 = 75 mmHg) es un marcador clínico directo de la pérdida de distensibilidad de los grandes vasos por envejecimiento y aterosclerosis.<br><br><b>Perla ENARM:</b> \"El médico familiar debe buscar de manera intencionada daño a órgano blanco: Rigidez arterial (presión pulso en personas mayores de 60 años, ≥ 60 mmHg y velocidad de onda de pulso carotideo-femoral > 10 m/s).\"<br><br><b>Análisis de Distractores:</b> La hipertrofia ventricular izquierda requiere un electrocardiograma o ecocardiograma para su diagnóstico, no se define por la presión de pulso. La enfermedad arterial periférica se diagnostica hemodinámicamente mediante un índice tobillo-brazo < 0.9. La nefropatía incipiente se sospecharía ante la presencia de microalbuminuria o elevación del cociente albúmina/creatinina, no por las presiones periféricas."
                    },
                    {
                        question: "Para asegurar el éxito terapéutico en este paciente, ¿cuál es la estrategia de prescripción recomendada por la guía para evitar el abandono del tratamiento?",
                        options: [
                            "Monoterapia a dosis máxima",
                            "Combinación en una sola píldora",
                            "Fármacos en tabletas separadas",
                            "Terapia triple de inicio"
                        ],
                        answer: 1,
                        justification: "La polifarmacia es la principal causa de inercia terapéutica y falta de apego en el paciente crónico. La terapia dual de inicio siempre debe buscar simplificarse.<br><br><b>Perla ENARM:</b> \"Se sugiere el uso de combinaciones de fármacos en una sola píldora en la mayoría de los pacientes hipertensos para mejorar la adherencia y persistencia en el tratamiento.\"<br><br><b>Análisis de Distractores:</b> La monoterapia está reservada únicamente para pacientes con hipertensión grado 1 de muy bajo riesgo o adultos mayores con fragilidad documentada. El uso de tabletas separadas incrementa estadísticamente las tasas de abandono a los 6 meses. La terapia triple de inicio no está indicada en el \"Paso 1\" del algoritmo; se reserva para el \"Paso 2\" tras fallo de la terapia dual a dosis plenas."
                    },
                    {
                        question: "Dado el antecedente metabólico de este paciente, ¿cuál es la meta estricta de presión arterial que debe alcanzarse para reducir la morbilidad cardiovascular?",
                        options: [
                            "Menor de 150/90 mmHg",
                            "Menor de 140/90 mmHg",
                            "Menor de 130/80 mmHg",
                            "Menor de 120/80 mmHg"
                        ],
                        answer: 2,
                        justification: "El diagnóstico concomitante de Diabetes Mellitus tipo 2 reclasifica al paciente en un estrato de alto riesgo cardiovascular de forma automática, obligando a ser más agresivos con las metas hemodinámicas.<br><br><b>Perla ENARM:</b> \"Se recomienda en adultos con DM e hipertensión, recibir tratamiento y vigilancia para alcanzar una meta < 130/80 mmHg.\"<br><br><b>Análisis de Distractores:</b> La meta menor de 140/90 mmHg es el objetivo general a corto plazo para pacientes menores de 80 años sin comorbilidades (riesgo SCORE bajo). Las metas más laxas como 150/90 mmHg se toleran únicamente en adultos mayores frágiles, >80 años o con ateroesclerosis carotídea severa para evitar hipoperfusión cerebral. La meta menor a 120/80 mmHg no ha demostrado beneficio adicional y eleva el riesgo de eventos adversos renales."
                    },
                    {
                        question: "Si en su evolución este paciente ingresa a urgencias con cifras de 190/115 mmHg acompañadas de confusión de nueva aparición, ¿cómo se clasifica esta complicación aguda?",
                        options: [
                            "Urgencia hipertensiva mayor",
                            "Hipertensión resistente",
                            "Hipertensión maligna",
                            "Efecto de bata blanca"
                        ],
                        answer: 0,
                        justification: "Las elevaciones extremas de presión arterial (>180/110 mmHg) solo son emergencias reales si existe evidencia clínica de daño isquémico, hemorrágico o edematoso en tejido blanco crítico (encefalopatía hipertensiva).<br><br><b>Perla ENARM:</b> \"Se recomienda enviar al servicio de urgencias a pacientes con: Urgencia hipertensiva mayor... con síntomas mortales como confusión de nueva aparición, dolor en el pecho, signos de insuficiencia cardíaca o enfermedad renal aguda.\"<br><br><b>Análisis de Distractores:</b> La hipertensión resistente se define ambulatoriamente como el fracaso a 3 fármacos a dosis máximas (incluyendo un diurético) y no por un pico aislado. El efecto de bata blanca no produce alteraciones neurológicas estructurales. La hipertensión maligna es un término que históricamente acompaña a papiledema y microangiopatía trombótica, pero la guía estandariza el manejo agudo grave neurológico bajo el concepto de Urgencia hipertensiva mayor u emergencia."
                    }
                ]
            },




            {
                id: 3,

            {

                caseText: "Mujer de 38 años, cursando 28 semanas de gestación. Antecedente de Hipertensión Arterial Sistémica Crónica de 5 años de diagnóstico y Diabetes Mellitus tipo 2. Acude a consulta de seguimiento. Refiere discreto edema de miembros inferiores, negando cefalea, acúfenos o epigastralgia. Signos Vitales: TA 155/95 mmHg, FC 82 lpm, FR 18 rpm. Exploración: Fondo uterino acorde a la edad gestacional, frecuencia cardíaca fetal 140 lpm. Miembros pélvicos con edema +. Reflejos osteotendinosos normales, sin clonus. Laboratorio inicial: Tira reactiva en orina con 2+ de proteínas (reporte previo en primer trimestre negativo a proteínas). Creatinina sérica 0.8 mg/dL.",
                source: "IMSS-058-08, Detección, Diagnóstico y Tratamiento de las Enfermedades Hipertensivas del Embarazo.",
                questions: [
                    {
                        question: "Para que esta paciente haya sido catalogada inicialmente con Hipertensión Crónica de acuerdo con la norma, la elevación tensional original debió documentarse obligatoriamente:",

                        justification: "El origen fisiopatológico dicta la clasificación de los trastornos hipertensivos. Una presión arterial elevada que se manifiesta en la primera mitad del embarazo indica que el sistema cardiovascular materno ya presentaba disfunción endotelial previa, independientemente del desarrollo de la placenta.<br><br><b>Perla ENARM:</b> Hipertensión Preexistente (Hipertensión arterial Crónica): Es definida como la hipertensión presente antes del embarazo o que se desarrolla antes de las 20 semanas de gestación.<br><br><b>Análisis de Distractores:</b> Las 16 semanas (A) corresponden al límite de tiempo ideal para iniciar profilaxis con ácido acetilsalicílico. Las 24 semanas (C) no representan un hito diagnóstico en esta patología. Documentar la elevación después de las 20 semanas (D) es el criterio definitorio para Hipertensión Gestacional o Preeclampsia de novo."

                    {
                        question: "Ante el hallazgo de nueva aparición de 2+ de proteínas en orina en esta gestante hipertensa conocida, el diagnóstico de acuerdo con la GPC se reclasifica a:",

                    },
                    {
                        question: "En el tratamiento antihipertensivo de esta paciente, ¿qué grupo farmacológico está absolutamente contraindicado durante todo el embarazo por causar falla renal fetal y oligohidramnios?",
                        options: [

                            "Antagonistas de los receptores de angiotensina",

                            "Agonistas alfa centrales"

                        answer: 1,
                        justification: "El eje renina-angiotensina-aldosterona fetal es fundamental para la organogénesis y perfusión de los riñones en el feto. El bloqueo de este sistema mediante inhibidores de la enzima convertidora (IECA) o antagonistas de receptores (ARA II) provoca anuria intrauterina, llevando a oligohidramnios letal, hipoplasia pulmonar y falla renal neonatal irreversible.<br><br><b>Perla ENARM:</b> Los Inhibidores de la enzima convertidora de angiotensina y los antagonistas de receptores de angiotensina NO se deben de usar durante el embarazo.<br><br><b>Análisis de Distractores:</b> Los bloqueadores de canales de calcio (A) como el nifedipino y los agonistas alfa centrales (D) como la alfametildopa son de primera y segunda línea respectivamente. Los beta bloqueadores (C) pueden asociarse a bajo peso al nacer, pero no están absolutamente contraindicados como los moduladores de angiotensina."
                    },
                    {
                        question: "Considerando que la paciente padece Hipertensión Crónica y Diabetes Mellitus tipo 2 (condición comórbida), ¿cuál es la meta terapéutica estricta de presión arterial indicada por la GPC?",

                            "Menor a 130/80 mmHg",
                            "Menor a 135/85 mmHg",
                            "Menor a 150/100 mmHg"
                        ],
                        answer: 1,
                        justification: "En una gestante con enfermedad crónica subyacente que ya compromete el endotelio, los vasos sanguíneos son mucho más lábiles al daño por cizallamiento y estrés oxidativo. Por ello, la norma exige un régimen de perfusión mucho más bajo para evitar la progresión de la lesión hacia ceguera o falla renal terminal.<br><br><b>Perla ENARM:</b> En la paciente con hipertensión crónica el objetivo es mantener la presión arterial ≤140/90 mmHg. Cuando existen condiciones comórbidas el objetivo debe ser mantener la presión arterial ≤130/80 mmHg.<br><br><b>Análisis de Distractores:</b> Una meta menor a 140/90 mmHg (A) aplica para hipertensión gestacional pura o crónica sin comorbilidades. Cifras menores a 135/85 mmHg (C) se utilizan para definir normalidad en el monitoreo ambulatorio de bata blanca. Valores de 150/100 mmHg (D) son límites de descontrol subóptimo que anteceden al vasoespasmo severo."
                    },
                    {
                        question: "Durante el seguimiento ecográfico de esta paciente, el médico debe buscar restricción del crecimiento intrauterino (RCIU). Según la GPC, en pacientes con hipertensión sistémica crónica que evoluciona a un estado severo, ¿hasta qué porcentaje incrementa la incidencia de RCIU?",

                            "15 por ciento",
                            "25 por ciento",

                        justification: "La esclerosis vascular crónica limita la capacidad de adaptación hemodinámica del útero al embarazo. Al instaurarse un grado severo de la enfermedad, la perfusión a la unidad feto-placentaria cae drásticamente, asfixiando nutricionalmente al feto y provocando que casi la mitad de estos embarazos no alcancen su potencial genético de crecimiento.<br><br><b>Perla ENARM:</b> El riesgo de restricción del crecimiento intrauterino es de 8 a 15% en pacientes con hipertensión sistémica crónica moderada, sin embargo la incidencia incrementa a 40% en pacientes con hipertensión arterial sistémica crónica severa.<br><br><b>Análisis de Distractores:</b> El 15 por ciento (A) es el límite superior de riesgo esperado para hipertensas crónicas con enfermedad moderada y buen control. El 25 por ciento (B) no es la cifra epidemiológica de corte señalada por el documento. El 60 por ciento (D) sobrestima estadísticamente el desarrollo aislado de restricción, confundiendo el número con la mortalidad dictada por un perfil biofísico de cero."

            {

                questions: [

                    {

                    {

                    {
                        question: "Con base en su edad de 45 años y el alto riesgo de desenlaces isquémicos por hipertensión y obesidad, ¿qué medida farmacológica adicional debe prescribirse de forma obligatoria?",

                        justification: "La enfermedad renal crónica es considerada un equivalente de alto riesgo aterosclerótico primario. Los pacientes jóvenes (18-50 años) con factores concomitantes (como hipertensión) y una reducción del filtrado glomerular se benefician directamente del efecto pleiotrópico y lipídico de las estatinas, disminuyendo drásticamente la mortalidad cardiovascular y microvascular.<br><br><b>Perla ENARM:</b> \"Se sugiere tratamiento con estatinas en pacientes con enfermedad renal crónica y una tasa de filtración glomerular mayor a 60 ml/min/1.73 m2 si tienen 50 años o más o factores de riesgo cardiovascular (hipertensión, diabetes, tabaquismo, bajos niveles de HDL-C).\"<br><br><b>Análisis de Distractores:</b> Los fibratos (B) están restringidos o contraindicados debido al riesgo inminente de toxicidad muscular cruzada (rabdomiólisis) en insuficiencia renal y no reducen la mortalidad global de forma aislada en estos estadios. Las resinas fijadoras (C) e inhibidores de absorción como ezetimiba (D) nunca son manejos de primera línea individual."

                    {

    caseText: "Mujer de 28 años, G2 P1, cursando embarazo de 20 semanas de gestación. Acude por disuria, urgencia y polaquiuria de 48 horas de evolución, acompañado de molestia suprapúbica. Niega fiebre, náusea o dolor lumbar. Signos vitales: TA 110/70 mmHg, FC 82 lpm, FR 18 rpm, Temp 36.6 °C. A la exploración física: abdomen con útero gestante acorde a edad, dolor a la palpación media en hipogastrio. Puntos ureterales superiores y medios indoloros. Maniobra de Giordano negativa bilateral. Se integra diagnóstico clínico inicial de cistitis aguda.",

    questions: [
        {
            question: "Al interrogar a la paciente, refiere haber recibido antibióticos para una infección faríngea semanas antes. ¿Qué antecedente farmacológico en los últimos 3 meses incrementa el riesgo de presentar una infección por bacterias productoras de betalactamasas de espectro extendido (BLEE)?",
            options: [
                "Consumo de probióticos",

                "Uso previo de cefalosporinas",
                "Toma de fosfomicina trometamol"
            ],
            answer: 2,
            justification: "La presión selectiva generada por el uso previo de antibióticos de amplio espectro, fundamentalmente betalactámicos, induce mutaciones enzimáticas en enterobacterias (como E. coli), dificultando el éxito del tratamiento empírico de primera línea.<br><br><b>Perla ENARM:</b> Se sugiere considerar como factores de riesgo para presentar ITU por bacterias BLEE durante el embarazo, los antecedentes de ITU, uso de cefalosporinas, antimicrobianos combinados y catéter urinario.<br><br><b>Análisis de Distractores:</b> La nitrofurantoína y la fosfomicina mantienen altos perfiles de susceptibilidad y no se asocian a la inducción primaria de mecanismos enzimáticos BLEE. El consumo de probióticos carece de impacto en la mutación bacteriana y no está comprobada su eficacia ni riesgo epidemiológico."

        {
            question: "De acuerdo con la GPC, si en su clínica de primer nivel no se cuenta con urocultivo ni tinción de Gram para el escrutinio de esta patología, ¿cuál es el estudio considerado como \"última opción\" diagnóstica?",
            options: [
                "Examen microscópico de sedimento",
                "Tira reactiva de orina",
                "Urocultivo automatizado",
                "Biometría hemática completa"
            ],
            answer: 1,
            justification: "En el embarazo, los cambios inflamatorios, el aumento de leucocitos y la dilución urinaria provocan que las pruebas bioquímicas presuntivas fallen rutinariamente, relegándolas al último escalón del abordaje.<br><br><b>Perla ENARM:</b> Se sugiere considerar como última opción el tamizaje con tiras reactivas cuando no se cuente con urocultivo o tinción de Gram debido a que tiene una mayor probabilidad de falsos positivos y negativos.<br><br><b>Análisis de Distractores:</b> El examen microscópico o tinción de Gram es la segunda mejor opción (Sensibilidad 86%). El urocultivo (automatizado o tradicional) es el estándar de oro primario, no la última alternativa. La biometría hemática no tiene ninguna utilidad diagnóstica de escrutinio para infección urinaria baja."
        },
        {
            question: "Tomando en cuenta que la paciente cursa el segundo trimestre y presenta clínica de cistitis, ¿cuál es el tratamiento antimicrobiano empírico recomendado como alternativa a la fosfomicina en este periodo gestacional?",
            options: [
                "Amoxicilina 500 mg cada 8 horas",
                "Nitrofurantoína 100 mg cada 12 horas",

                "Ciprofloxacino 500 mg cada 12 horas"
            ],
            answer: 1,
            justification: "La nitrofurantoína es un excelente antiséptico urinario. Aunque está restringida en el primer trimestre (malformaciones) y en el término (anemia hemolítica neonatal), su prescripción durante el segundo trimestre es catalogada como segura y efectiva de manera empírica.<br><br><b>Perla ENARM:</b> En el caso de no contar con urocultivo y antibiograma, se recomienda tratamiento antimicrobiano empírico de la cistitis con fosfomicina... o nitrofurantoína (posible prescribirlo con mínimo riesgo en segundo trimestre del embarazo) en espera de urocultivo.<br><br><b>Análisis de Distractores:</b> La amoxicilina está contraindicada para inicio empírico en México por tasas de resistencia por E. coli superiores al 80%. Trimetoprim/Sulfametoxazol se evita empíricamente. Ciprofloxacino altera el desarrollo del cartílago fetal y está contraindicado en todo el embarazo."
        },
        {
            question: "Al prescribir el manejo antimicrobiano de primera línea elegido, ¿cuál es la indicación de la guía respecto a la duración de los días de tratamiento para favorecer el éxito terapéutico y reducir la toxicidad?",
            options: [
                "Indicar ciclos acortados siempre que sea posible",
                "Mantener tratamiento hasta la resolución del embarazo",

                "Administrar dosis intravenosa y seguir vía oral"
            ],
            answer: 0,
            justification: "Para evitar la alteración de la flora comensal (vaginal/intestinal), reducir el riesgo de selección de cepas multidrogorresistentes e incrementar drásticamente el apego a la toma del medicamento, la evidencia soporta minimizar los días de exposición.<br><br><b>Perla ENARM:</b> Se sugiere indicar ciclos acortados de antimicrobiano, siempre que sea posible.<br><br><b>Análisis de Distractores:</b> Los esquemas largos (14 a 21 días) o el manejo intravenoso están reservados estrictamente para cuadros de pielonefritis aguda o invasión sistémica. Mantener profilaxis continua hasta el parto solo se justifica ante infecciones comprobadas recurrentes (3 en un año) o alteraciones anatómicas."

        {
            question: "Tras finalizar su esquema antibiótico, la paciente acude indicando que la disuria y la urgencia miccional no han mejorado en lo absoluto. Según la norma oficial, ¿cuál es el paso a seguir específico para el seguimiento de la cistitis en este contexto clínico?",
            options: [
                "Repetir el mismo esquema antibiótico",

            justification: "A diferencia de la bacteriuria asintomática (donde el urocultivo de control es obligatorio siempre), en el caso de la cistitis aguda (infección sintomática), el cultivo post-tratamiento se reserva y exige cuando falla la remisión clínica, sospechando de un patógeno resistente.<br><br><b>Perla ENARM:</b> Se sugiere realizar urocultivo posterior al tratamiento de cistitis durante el embarazo en caso de persistencia o recurrencia de la sintomatología.<br><br><b>Análisis de Distractores:</b> Repetir ciegamente el esquema perpetúa el fracaso terapéutico si hay resistencia adquirida. Referir a Urgencias (segundo nivel) es conducta de cuadros superiores severos (fiebre, dolor lumbar), no de cistitis no erradicada ambulatoriamente. Iniciar profilaxis con macrólidos carece de sustento al no tener acción comprobada contra bacterias urinarias."
        }
    ]

            {
                id: 32,
                caseText: "Niño de 4 años es llevado al servicio de Urgencias Pediátricas por presentar dificultad respiratoria de inicio súbito y progresión rápida. Como antecedentes de importancia, la madre refiere un cuadro de rinofaringitis hace 3 días y diagnóstico previo de asma bronquial, actualmente sin tratamiento de mantenimiento. A la exploración física, el paciente se encuentra francamente agitado, prefiere permanecer sentado todo el tiempo y presenta habla entrecortada. Signos vitales: FC 130 lpm, FR 45 rpm, TA 90/60 mmHg, y SpO2 del 88% al aire ambiente. A la auscultación pulmonar destacan sibilancias inspiratorias y espiratorias audibles a distancia, acompañadas de uso evidente de músculos accesorios con tiraje intercostal y supraesternal profundo.",

                    {
                        question: "Con base en los hallazgos clínicos y la oximetría de pulso, ¿cómo se clasifica la severidad de la exacerbación en este paciente?",
                        options: [
                            "Asma parcialmente controlada",
                            "Crisis asmática leve",

                        justification: "La presencia de hipoxemia franca (saturación menor al 90%), la imposibilidad de hablar en frases completas (palabras sueltas) y la adopción de una postura ortopneica rígida obligan a catalogar la crisis en la máxima categoría de urgencia.<br><br><b>Perla ENARM:</b> Crisis grave: Saturación de oxígeno (SpO2) <90%, Flujo Espiratorio Pico (FEP) o VEF1 25% a 50%, Habla entrecortada en palabras, Prefiere sentarse, no acostarse, usa músculos accesorios, FC 120 a 140 lpm.<br><br><b>Análisis de Distractores:</b> Las crisis leves o moderadas (B y C) conservan saturaciones por arriba del 90% y toleran mejor el decúbito sin fatiga del habla. El asma parcialmente controlada (A) es una clasificación de control crónico ambulatorio basada en las últimas 4 semanas, no un estatus de crisis de urgencia."
                    },
                    {
                        question: "¿Cuál es el esquema de primera línea indicado para el rescate inmediato de este paciente en la sala de reanimación?",
                        options: [

                    {
                        question: "Si el paciente no presenta respuesta clínica y permanece refractario a pesar de la administración correcta de broncodilatadores nebulizados y corticoesteroides sistémicos, ¿qué fármaco recomienda la guía clínica como terapia intravenosa adicional?",

                    },
                    {
                        question: "Durante su evolución inicial, el paciente presenta deterioro agudo del estado de alerta y bradicardia. ¿Qué hallazgo a la exploración física pulmonar confirmaría que el paciente se encuentra en paro respiratorio inminente?",

                    }

            {

{

        {
            question: "Aunque la paciente no presenta síntomas periféricos agudos,fisiopatológicamente el 90 al 95% de los émbolos pulmonares en el embarazo provienen de un coágulo formado en las piernas. ¿En qué sitio anatómico ocurre el evento primario con mayor frecuencia debido a la estasis por cruce arterial?",

        {
            question: "Si la paciente evolucionara de forma tórpida presentando hipotensión arterial sostenida (80/50 mmHg), hipoxemia refractaria y datos de choque (colapso cardiovascular), ¿cuál es el tratamiento farmacológico anticoagulante inicial de elección?",

        {
            question: "Durante el pase de visita médico, un residente de primer año sugiere iniciar antagonistas de la vitamina K de manera ambulatoria tras estabilizar a la paciente. ¿Cuál es el motivo clínico definitivo por el que esta clase de fármaco está proscrita?",

            justification: "A diferencia de las heparinas (moléculas grandes que no cruzan la barrera placentaria), los antagonistas de la vitamina K (warfarina) cruzan libremente y son potentes teratógenos que causan hipoplasia del puente nasal, condrodisplasia punteada y defectos del sistema nervioso central, además de incrementar el riesgo de hemorragia fetal.<br><br><b>Perla ENARM:</b> No se recomienda usar antagonistas de la vitamina K para tratamiento de pacientes obstétricas con TVP.<br><br><b>Análisis de Distractores:</b> El riesgo de trombocitopenia autoinmune letal es propio de las heparinas (Trombocitopenia Inducida por Heparina), no de los cumarínicos. No asocian aumento de falla hepática materna intrínseca ni son un gatillo fisiopatológico para el desarrollo de preeclampsia con criterios de severidad."

        {

{

        {
            question: "Si al prescribir el tratamiento de primera línea la paciente presentara intolerancia gastrointestinal severa que impida la vía oral, ¿cuál es el fármaco de elección a considerar?",

                    const cData = casesData[caseIdx];

        function navigateCase(currentCaseId, direction) {
            let targetCaseId = currentCaseId;
            if (direction === 'prev' && currentCaseId > 1) {
                targetCaseId = currentCaseId - 1;
            } else if (direction === 'next' && currentCaseId < casesData.length) {
                targetCaseId = currentCaseId + 1;
            } else {
                displayQuestion(null); 
                return;
            }
            const targetGlobalQId = (targetCaseId - 1) * QUESTIONS_PER_CASE + 1;
            displayQuestion(targetGlobalQId);
        }

            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-[10px] sm:text-xs cursor-pointer transition-all select-none border ";
            if (isActive) base += "ring-4 ring-blue-500 shadow-md z-10 border-blue-500 dark:border-blue-400 ";

            const state = userProgress[globalId];
            const caseIdx = Math.floor((globalId - 1) / QUESTIONS_PER_CASE);
            const qIdx = (globalId - 1) % QUESTIONS_PER_CASE;
            const cData = casesData[caseIdx];
            
            if (!cData) return base + "bg-slate-100 text-slate-300";

            if (!examState.isFinished) {
                if (!state || !state.answered) {
                    return base + "bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-200 dark:bg-slate-800/50 dark:text-slate-500 dark:border-slate-700/50 dark:hover:bg-slate-700";
                } else {
                    return base + "bg-slate-600 text-white border-slate-700 dark:bg-slate-700 dark:border-slate-600 shadow-inner";
                }
            } 
            else {
                if (!state || !state.answered) {
                    return base + "bg-slate-100 text-slate-400 border-slate-200 dark:bg-slate-800 dark:text-slate-500 dark:border-slate-700";
                } else {
                    const isCorrect = state.selectedOption === cData.questions[qIdx].answer;
                    if (isCorrect) {
                        return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
                    } else {
                        return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
                    }
                }
            }
        }

            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = globalId ? parseInt(globalId) : null;
                
                if (currentQuestionId) {
                    localStorage.setItem('simuladorEL5LastQId', currentQuestionId);
                } else {
                    localStorage.removeItem('simuladorEL5LastQId');
                }

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                if (window.innerWidth >= 1024) {
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');
                    dashboardBtn.classList.add('lg:left-[22rem]');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const caseIdx = Math.floor((currentQuestionId - 1) / QUESTIONS_PER_CASE);
                const cData = casesData[caseIdx];
                
                if (!cData) return displayQuestion(null);
                
                renderCaseLayout(cData, currentQuestionId);
                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                setTimeout(() => {
                    const targetCard = document.getElementById(`q-card-${currentQuestionId}`);
                    if (targetCard) {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    }
                }, 50);

            }, 150); 
        }

        function renderCaseLayout(cData, activeGlobalId) {
            let html = `
                <div class="flex flex-col gap-6 max-w-5xl mx-auto items-center">
                    
                    <!-- COLUMNA: TEXTO DEL CASO CLÍNICO -->
                    <div class="w-full bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-md border border-slate-200 dark:border-slate-800 transition-all duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-block bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-900/30">
                                Caso Clínico Seriado
                            </span>
                            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                                Bloque #${cData.id}
                            </span>
                        </div>
                        <p class="text-slate-800 dark:text-slate-200 text-sm sm:text-base leading-relaxed font-medium">
                            ${cData.caseText}
                        </p>
                        ${examState.isFinished ? `
                            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                <span class="text-slate-500">Bibliografía:</span> ${cData.source}
                            </div>
                        ` : ''}
                    </div>

                    <!-- COLUMNA: BLOQUE DE LAS 5 PREGUNTAS ASOCIADAS -->
                    <div class="w-full space-y-5">
            `;

            cData.questions.forEach((q, idx) => {
                const globalQId = (cData.id - 1) * QUESTIONS_PER_CASE + idx + 1;
                const qState = userProgress[globalQId];
                const hasAnswered = qState && qState.answered;
                const userAnswer = hasAnswered ? qState.selectedOption : null;
                
                let cardStyle = "border-slate-200 dark:border-slate-800/80";
                if (globalQId === activeGlobalId) {
                    cardStyle = "border-blue-500 dark:border-blue-500 ring-2 ring-blue-500/10";
                }
                if (examState.isFinished && hasAnswered) {
                    cardStyle = (userAnswer === q.answer) ? "border-l-4 border-emerald-500" : "border-l-4 border-rose-500";
                }

                html += `
                    <div id="q-card-${globalQId}" class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-2xl shadow-sm border ${cardStyle} transition-all">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[9px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">
                                PREGUNTA ${globalQId}
                            </span>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 mb-4 leading-snug">${q.question}</h3>
                        <form id="q-form-${globalQId}" class="space-y-2.5">
                `;

                q.options.forEach((opt, i) => {
                    if (examState.isFinished) {
                        let optClasses = "flex items-start p-3 border rounded-xl text-xs sm:text-sm ";
                        let icon = "";
                        
                        if (i === q.answer) {
                            optClasses += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 font-semibold";
                            icon = `<svg class="w-4 h-4 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                        } else if (i === userAnswer) {
                            optClasses += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                            icon = `<svg class="w-4 h-4 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                        } else {
                            optClasses += "bg-slate-50 border-slate-100 dark:bg-slate-800/30 dark:border-slate-800/50 opacity-50 text-slate-400";
                        }

                        html += `
                            <div class="${optClasses}">
                                <span class="leading-snug pr-3">${opt}</span>
                                ${icon}
                            </div>
                        `;
                    } else {
                        const checkedStr = (hasAnswered && userAnswer === i) ? 'checked' : '';
                        html += `
                            <label class="flex items-start p-3 border border-slate-200 dark:border-slate-800 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/40 has-[:checked]:bg-blue-50/80 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/20 text-xs sm:text-sm shadow-sm" onclick="autoSaveAnswer(${globalQId})">
                                <input type="radio" name="option" value="${i}" ${checkedStr} class="mt-0.5 h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-700 cursor-pointer">
                                <span class="ml-2.5 text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `;
                    }
                });

                html += `</form>`;

                if (examState.isFinished) {
                    html += `
                        <div class="bg-blue-50/60 dark:bg-slate-800/50 border border-blue-100/50 dark:border-slate-800 rounded-xl p-4 text-xs sm:text-sm mt-4">
                            <h4 class="font-bold text-blue-800 dark:text-blue-400 mb-1 flex items-center gap-1 uppercase tracking-wider text-[10px]">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Justificación Médica
                            </h4>
                            <p class="text-slate-600 dark:text-slate-300 leading-relaxed">${q.justification}</p>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            const isLastCase = cData.id === casesData.length;

            html += `
                        <!-- CONTROLES DE FLUJO EN CASOS -->
                        <div class="flex justify-between items-center pt-4 mt-6 border-t border-slate-200 dark:border-slate-800">
                            <button onclick="navigateCase(${cData.id}, 'prev')" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                                Caso Anterior
                            </button>
                            
                            ${examState.isFinished ? `
                                ${!isLastCase ? `
                                    <button onclick="navigateCase(${cData.id}, 'next')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
                                        Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                    </button>
                                ` : `
                                    <button onclick="displayQuestion(null)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider shadow-sm">
                                        Ver Calificaciones
                                    </button>
                                `}
                            ` : `
                                <button onclick="navigateCase(${cData.id}, 'next')" class="bg-blue-600 dark:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-md hover:bg-blue-700 dark:hover:bg-blue-400 transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5">
                                    Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('module-display').innerHTML = html;
        }

        function autoSaveAnswer(globalId) {
            if(examState.isFinished) return;
            const form = document.getElementById(`q-form-${globalId}`);
            if (!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (selected) {
                userProgress[globalId] = { answered: true, selectedOption: parseInt(selected.value) };
                saveState();
                updateProgressBar();
                renderSidebarGrid();
            }
        }

        function updateProgressBar() {
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = totalQuestions > 0 ? Math.round((ans / totalQuestions) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; 
            }
        }

        function saveState() {
            try { localStorage.setItem('simuladorEL5Progress', JSON.stringify(userProgress)); } catch(e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('simuladorEL5Progress');
                userProgress = saved ? JSON.parse(saved) : {};
                const savedState = localStorage.getItem('simuladorEL5ExamState');
                if (savedState) examState = JSON.parse(savedState);
            } catch(e) { userProgress = {}; examState = { isFinished: false }; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
