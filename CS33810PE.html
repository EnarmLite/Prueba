    <script>
        const questionsData = [

    {
        id: 1, 
        question: "En la Mucopolisacaridosis Tipo I, ¿cuál es el gen cuya mutación patológica causa la deficiencia enzimática multisistémica?", 
        options: ["Gen IDUA", "Gen I2S", "Gen ARSA", "Gen GNPTA"], 
        answer: 0, 
        justification: "Justificación: El gen afectado en esta patología codifica para la alfa-L-iduronidasa y se localiza en el brazo corto del cromosoma 4. De acuerdo GPC de Mucopolisacaridosis Tipo I, las mutaciones nonsense en este gen inducen una ausencia total de proteína funcional, condicionando el fenotipo severo o síndrome de Hurler.<br><br>Perla ENARM: \"La Mucopolisacaridosis Tipo I es una enfermedad autosómica recesiva, causada por mutaciones en el gen que codifica la α-L-iduronidasa (IDUA) localizada en el cromosoma 4p16.3.\"<br><br>Análisis de Distractores: La opción B (gen I2S) causa la Mucopolisacaridosis Tipo II o síndrome de Hunter. La opción C (gen ARSA) codifica para la arilsulfatasa A, alterada en la leucodistrofia metacromática. La opción D (gen GNPTA) se asocia con mucolipidosis tipo II.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Estudio Genético, Página 17." 
    },
    {
        id: 2, 
        question: "En un paciente con sospecha de Mucopolisacaridosis Tipo I, ¿cuál es el rango exacto de actividad de la enzima alfa-L-iduronidasa que otorga la certeza diagnóstica según la GPC?", 
        options: ["Menor al 10%", "Entre 5% y 8%", "Entre 1% y 2%", "Menor al 5%"], 
        answer: 2, 
        justification: "Justificación: Si bien una actividad enzimática inferior al 10% es altamente sugestiva, la certeza bioquímica definitiva requiere valores críticos específicos. De acuerdo GPC de Mucopolisacaridosis Tipo I, un rango enzimático residual extremadamente bajo es indispensable para confirmar el diagnóstico.<br><br>Perla ENARM: \"De acuerdo al porcentaje de actividad de la enzima α-L-iduronidasa se puede sospechar o tener la certeza que se trata de MPS I: Actividad enzimática <10% (Sugestiva), entre 1 y 2% (Certeza).\"<br><br>Análisis de Distractores: La opción A indica sospecha o criterio sugestivo. Las opciones B y D no corresponden a los puntos de corte establecidos en las tablas de gradación diagnóstica de la GPC.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Actividad Enzimática, Página 15." 
    },
    {
        id: 3, 
        question: "En la determinación de glucosaminoglucanos urinarios para Mucopolisacaridosis Tipo I, ¿cuál es el valor límite de densidad urinaria para evitar resultados falsos negativos por dilución según la GPC?", 
        options: ["1.005 g/ml", "1.015 g/ml", "1.020 g/ml", "1.010 g/ml"], 
        answer: 1, 
        justification: "Justificación: La orina diluida subestima la concentración de metabolitos acumulados, por lo que se requiere una concentración urinaria basal mínima para validar la prueba. De acuerdo GPC de Mucopolisacaridosis Tipo I, densidades por debajo del valor de corte invalidan la sensibilidad diagnóstica de la prueba de glucosaminoglucanos.<br><br>Perla ENARM: \"La determinación de glucosaminoglucanos (heparán y dermatán sulfato) en orina es una prueba útil pero inespecífica para el diagnóstico de la MPS I por presentar resultados falsos negativos, especialmente si la orina está diluida (densidad urinaria < 1.015 g/ml).\"<br><br>Análisis de Distractores: Las opciones A y D son densidades urinarias bajas que propician resultados falsos negativos. La opción C representa una densidad normal-alta pero no corresponde al valor límite de seguridad de la GPC.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Determinación de Glucosaminoglucanos, Página 16." 
    },
    {
        id: 4, 
        question: "¿Cuáles son los dos glucosaminoglucanos específicos que se acumulan progresivamente en los lisosomas en pacientes con Mucopolisacaridosis Tipo I?", 
        options: ["Queratán sulfato y condroitín sulfato", "Dermatán sulfato y heparán sulfato", "Ácido hialurónico y heparán sulfato", "Dermatán sulfato y queratán sulfato"], 
        answer: 1, 
        justification: "Justificación: El déficit de la hidrolasa iduronidasa bloquea la degradación específica de estos dos polímeros de carbohidratos, acumulándolos en múltiples tejidos. De acuerdo GPC de Mucopolisacaridosis Tipo I, la excreción de dermatán sulfato y heparán sulfato es el sello bioquímico del defecto lisosomal.<br><br>Perla ENARM: \"La reducción o ausencia de la actividad de α-L-iduronidasa produce acumulación de glucosaminoglucanos dermatán sulfato y heparán sulfato, en varios órganos y tejidos.\"<br><br>Análisis de Distractores: Las opciones A, C y D corresponden a glucosaminoglucanos acumulados en otros tipos de mucopolisacaridosis (como queratán sulfato en la MPS IV o condroitín sulfato).", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Actividad Enzimática, Página 15." 
    },
    {
        id: 5, 
        question: "¿Cuál es la recomendación que establece la GPC respecto al tamiz neonatal universal (escrutinio) para Mucopolisacaridosis Tipo I en recién nacidos?", 
        options: ["No realizar de forma rutinaria", "Realizar de forma obligatoria", "Realizar únicamente en prematuros", "Realizar bajo sospecha genética"], 
        answer: 0, 
        justification: "Justificación: El escrutinio poblacional masivo sin factores de riesgo no tiene justificación epidemiológica debido a la baja incidencia de la enfermedad. De acuerdo GPC de Mucopolisacaridosis Tipo I, la prueba de tamiz universal para esta patología lisosomal no es recomendada de rutina.<br><br>Perla ENARM: \"No se recomienda realizar pruebas de escrutinio para MPS I en los recién nacidos, porque es una enfermedad de muy baja incidencia.\"<br><br>Análisis de Distractores: Las opciones B, C y D recomiendan la realización del tamiz de forma selectiva o universal, lo cual contradice el punto de buena práctica de la GPC.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Estudio Genético, Página 19." 
    },
    {
        id: 6, 
        question: "Para realizar el diagnóstico de portador en familiares de un paciente con Mucopolisacaridosis Tipo I, ¿cuál es el abordaje indicado según la GPC?", 
        options: ["Determinación de actividad enzimática", "Genotipificación familiar", "Serie ósea radiológica", "Cuantificación de glucosaminoglucanos urinarios"], 
        answer: 1, 
        justification: "Justificación: La identificación de heterocigotos asintomáticos requiere de análisis molecular para detectar variantes patológicas específicas en el gen IDUA. De acuerdo GPC de Mucopolisacaridosis Tipo I, el estudio genético familiar define el estatus de portador.<br><br>Perla ENARM: \"Para hacer diagnóstico de portador, debe hacerse genotipificación familiar. Sin embargo, no se recomienda realizar la genotificación en forma rutinaria.\"<br><br>Análisis de Distractores: Las opciones A, C y D son útiles en pacientes sintomáticos con sospecha clínica de padecer la enfermedad, pero carecen de sensibilidad o especificidad para detectar portadores heterocigotos sanos.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Estudio Genético, Página 19." 
    },
    {
        id: 7, 
        question: "En el diagnóstico diferencial de las Mucopolisacaridosis, ¿cuál es el signo clínico característico de la Mucopolisacaridosis Tipo I que permite distinguirla del Síndrome de Hunter (Mucopolisacaridosis Tipo II)?", 
        options: ["Presencia de disostosis múltiple", "Retraso del desarrollo motor", "Presencia de opacidades corneales", "Hernia umbilical recidivante"], 
        answer: 2, 
        justification: "Justificación: Aunque la MPS I y la MPS II comparten fenotipos somáticos idénticos y la misma excreción de glucosaminoglucanos, el depósito a nivel ocular es el factor diferenciador crucial en el examen clínico. De acuerdo GPC de Mucopolisacaridosis Tipo I, la afectación corneal severa orienta de inmediato al diagnóstico de tipo I.<br><br>Perla ENARM: \"MPS II o síndrome de Hunter. Presenta la misma composición de GAG en la orina. La presencia en la MPS I de opacidades corneales es un signo importante en el diagnóstico diferencial de MPS I y II\"<br><br>Análisis de Distractores: Las opciones A, B y D son manifestaciones clínicas comunes que se presentan en ambas patologías de depósito, por lo que no sirven como diagnóstico diferencial clínico.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Diagnóstico Diferencial, Página 22." 
    },
    {
        id: 8, 
        question: "¿Cuál es el principio activo de elección indicado para la Terapia de Reemplazo Enzimático en pacientes con Mucopolisacaridosis Tipo I?", 
        options: ["Idursulfasa", "Laronidasa", "Galsulfasa", "Alglucosidasa alfa"], 
        answer: 1, 
        justification: "Justificación: La sustitución exógena de la hidrolasa deficiente se realiza con una enzima obtenida mediante tecnología de ADN recombinante. De acuerdo GPC de Mucopolisacaridosis Tipo I, el fármaco específico para esta patología es la laronidasa.<br><br>Perla ENARM: \"La Terapia de Reemplazo Enzimático se realiza con la administración de Laronidasa que es una variante polimórfica de la α-L-iduronidasa humana la cual se obtiene por medio de tecnología de ADN recombinante.\"<br><br>Análisis de Distractores: La opción A (Idursulfasa) es el tratamiento de la MPS II. La opción C (Galsulfasa) se utiliza en la MPS VI. La opción D (Alglucosidasa alfa) está indicada en la enfermedad de Pompe.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Terapia de Reemplazo Enzimático, Página 24." 
    },
    {
        id: 9, 
        question: "¿Cuál es la dosis semanal de Laronidasa recomendada por la GPC para la Terapia de Reemplazo Enzimático en la Mucopolisacaridosis Tipo I?", 
        options: ["100 UI/kg", "200 UI/kg", "50 UI/kg", "300 UI/kg"], 
        answer: 0, 
        justification: "Justificación: El régimen de infusión semanal ha demostrado optimizar la reducción de glucosaminoglucanos tisulares y urinarios con la menor tasa de reacciones adversas secundarias. De acuerdo GPC de Mucopolisacaridosis Tipo I, la dosis estándar calculada por peso corporal es de 100 UI/kg semanales (equivalente a 0.58 mg/kg).<br><br>Perla ENARM: \"La dosis aprobada de laronidasa y que se usa actualmente es de 0.58 mg/kg/cada semana o 100 UI/kg/cada semana, Esta dosis es la que ofrece la máxima reducción de glucosaminoglicanos urinarios...\"<br><br>Análisis de Distractores: Las opciones B, C y D representan regímenes de dosificación que fueron evaluados en estudios de fase cuatro pero que mostraron mayor tasa de efectos secundarios o efectividad subóptima a largo plazo.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Dosis y Frecuencia de Administración de la TRE, Página 28." 
    },
    {
        id: 10, 
        question: "Según los estudios in vitro citados en la GPC para Mucopolisacaridosis Tipo I, ¿cuál es la vida media celular de la laronidasa que justifica su esquema de dosificación?", 
        options: ["24 horas", "7 días", "12 horas", "5 días"], 
        answer: 3, 
        justification: "Justificación: El intervalo de dosificación semanal de la terapia de reemplazo se basa en la persistencia de la enzima dentro de los lisosomas celulares antes de su degradación metabólica. De acuerdo GPC de Mucopolisacaridosis Tipo I, modelos celulares estimaron que la laronidasa permanece activa por un periodo de cinco días.<br><br>Perla ENARM: \"La frecuencia de la administración de la laronidasa se determinó a partir de de estudios in vitro en cultivo de fibroblastos en modelos en los se usaron perros con Mucopolisacaridosis tipo I, a partir de los cuales se observó que la vida media celular de la laronidasa es de 5 días.\"<br><br>Análisis de Distractores: Las opciones A, B y C no corresponden con la vida media celular de la laronidasa exógena reportada en los estudios de cinética enzimática de la GPC.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Dosis y Frecuencia de Administración de la TRE, Página 28." 
    },
    {
        id: 11, 
        question: "En un paciente con Mucopolisacaridosis Tipo I con peso mayor a 20 kg, ¿en qué volumen de solución salina al 0.9% se debe diluir la dosis reconstituida de Laronidasa?", 
        options: ["100 ml", "500 ml", "250 ml", "50 ml"], 
        answer: 2, 
        justification: "Justificación: La infusión de laronidasa requiere una dilución estandarizada según el peso corporal del paciente pediátrico para asegurar la estabilidad física y osmolar del medicamento. De acuerdo GPC de Mucopolisacaridosis Tipo I, los pacientes que superan el umbral de los 20 kg deben recibir su dosis en un volumen mayor.<br><br>Perla ENARM: \"...llevar la dosis reconstituida a un volumen de 100 ml sí el peso del paciente es ≤ 20 kg o 250 ml sí El peso del paciente es > 20 kg.\"<br><br>Análisis de Distractores: La opción A (100 ml) es el volumen de dilución exclusivo para pacientes con peso igual o menor a 20 kg. Las opciones B y D no son volúmenes recomendados por la GPC.", 
        source: "IMSS-338-10, Diagnóstico y Tratamiento de la Mucopolisacaridosis Tipo I en Edad Pediátrica, 2017, Sección: Tabla de Medicamentos, Página 70." 
    },
    {
        id: 12, 
        question: "En un paciente con Mucopolisacaridosis Tipo I fenotipo Hurler (grave) menor de dos años y sin deterioro neurológico, ¿cuál es el tratamiento definitivo de elección según la GPC?",

                                <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="DS36218PE.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('33810Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('33810LastQId', currentQuestionId);
                else localStorage.removeItem('33810LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('33810Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
