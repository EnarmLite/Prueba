    <script>
        const questionsData = [
    {
        id: 1, 
        question: "En Colelitiasis, ¿cuál es la prevalencia aproximada documentada para el desarrollo de cálculos en pacientes mayores de 70 años?", 
        options: ["10%", "20%", "30%", "40%"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, la prevalencia de esta patología se incrementa drásticamente con la edad avanzada, llegando a afectar a casi un tercio de la población que supera la séptima década de la vida debido a factores como el aumento en la secreción de colesterol y la hipomotilidad biliar multifactorial.<br><br>Perla ENARM: \"Edad: más frecuente a partir de los 40 años, cerca del 20% de los adultos a partir de esta edad y del 30% en los mayores de 70 años.\"<br><br>Análisis de Distractores: El 10% (A) corresponde a la prevalencia mínima estimada en la población general de los Estados Unidos de América. El 20% (B) representa la tasa de prevalencia estimada para la población general a partir de los 40 años de edad. El 40% (D) es un valor que excede los reportes estadísticos validados en el interrogatorio preventivo de la GPC.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Prevención secundaria: Detección, Página 12." 
    },
    {
        id: 2, 
        question: "En el Instituto Mexicano del Seguro Social, ¿cuál fue la relación mujer/hombre documentada en las colecistectomías realizadas durante el año 2007?", 
        options: ["2:1", "3:1", "4:1", "5:1"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, aunque a nivel general se describe que las mujeres tienen el doble de riesgo respecto a los hombres de presentar la enfermedad, los datos institucionales del IMSS correspondientes a los egresos por colecistectomía en el año 2007 evidenciaron una disparidad de género mucho más pronunciada.<br><br>Perla ENARM: \"De acuerdo a estadísticas del IMSS durante el año 2007, del total de colecistectomía realizadas la relación mujer/ hombre fue de 4:1\"<br><br>Análisis de Distractores: La relación 2:1 (A) corresponde a la proporción general mujer/hombre reportada en la literatura médica internacional para la frecuencia de presentación de la patología. Las relaciones 3:1 (B) y 5:1 (D) son clínicamente plausibles pero no coinciden con los registros nacionales del sistema de motivos de egreso institucional de ese periodo.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Prevención secundaria: Detección, Página 12." 
    },
    {
        id: 3, 
        question: "En mujeres menores de 40 años con sospecha de Colelitiasis, ¿a partir de qué dosis de estrógenos en anticonceptivos orales o terapia de reemplazo hormonal se asocia un mayor riesgo para el desarrollo de cálculos de colesterol?", 
        options: ["Mayor de 20 microgramos", "Mayor de 30 microgramos", "Mayor de 40 microgramos", "Mayor de 50 microgramos"], 
        answer: 3, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, el uso de anticonceptivos orales combinados promueve la supersaturación de colesterol en la bilis y reduce la contractilidad vesicular, elevando significativamente el riesgo litogénico cuando se administran dosis elevadas de estrógenos.<br><br>Perla ENARM: \"Anticonceptivos orales y terapia hormonal sustitutiva con estrógenos, en este caso con mayor riesgo en mujeres menores de 40 años y las que reciben una dosis mayor de 50 microgramos de estrógenos.\"<br><br>Análisis de Distractores: Las dosis menores de 50 microgramos (A, B y C) corresponden a formulaciones anticonceptivas de baja dosis o microdosis que, si bien alteran la composición biliar, no representan el umbral de riesgo de corte establecido en las recomendaciones farmacológicas de la GPC.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Prevención secundaria: Detección, Página 13." 
    },
    {
        id: 4, 
        question: "Ante la sospecha clínica de Colecistitis Aguda o Colelitiasis, ¿cuál es el estudio de imagenología no invasivo indicado como primera elección?", 
        options: ["Tomografía axial computarizada", "Ecografía abdominal (ultrasonido)", "Gammagrafía biliar", "Resonancia magnética nuclear"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, la evaluación diagnóstica inicial requiere de un método con alta sensibilidad, bajo costo y nula radiación ionizante, lo que posiciona al ultrasonido abdominal como el estándar de oro en el abordaje primario de urgencias.<br><br>Perla ENARM: \"Ante la sospecha de Colecistitis o Colelitiasis aguda, la ecografía abdominal (ultrasonido) es la prueba no invasiva de primera elección.\"<br><br>Análisis de Distractores: La tomografía axial computarizada (A) se reserva para sospecha de complicaciones graves o cuando el ultrasonido inicial no sea concluyente. La gammagrafía biliar (C) es un estudio secundario de tipo funcional indicado si el ultrasonido no muestra datos definitivos. La resonancia magnética nuclear (D) es un estudio de alta definición útil en casos complejos, pero no representa el abordaje inicial no invasivo de elección.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Diagnóstico: Pruebas diagnósticas, Página 15." 
    },
    {
        id: 5, 
        question: "Para el diagnóstico definitivo de Colelitiasis, ¿cuál es el porcentaje de sensibilidad diagnóstica reportado para el ultrasonido abdominal convencional?", 
        options: ["85%", "90%", "95%", "98%"], 
        answer: 3, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, la capacidad del ultrasonido abdominal para demostrar cálculos libres en la luz vesicular es extremadamente alta gracias a la interfaz acústica generada por los litos, lo que permite observar la clásica sombra acústica posterior en la gran mayoría de los pacientes evaluados.<br><br>Perla ENARM: \"El ultrasonido abdominal es positivo en el 98% (sensibilidad) de los casos de colelitiasis.\"<br><br>Análisis de Distractores: El 85% (A) subestima significativamente el rendimiento del ultrasonido abdominal en manos de personal experimentado. El 90% (B) es un valor de corte estándar para otras modalidades de imagen pero es inferior a la sensibilidad real del ultrasonido biliar. El 95% (C) es un porcentaje aproximado que no corresponde a la cifra de sensibilidad exacta documentada en la GPC.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Diagnóstico: Pruebas diagnósticas, Página 16." 
    },
    {
        id: 6, 
        question: "En la evaluación ecográfica de la Colecistitis Aguda, ¿cuál es el punto de corte para el engrosamiento de la pared vesicular que se considera un hallazgo ultrasonográfico positivo?", 
        options: ["Mayor de 2 mm", "Mayor de 3 mm", "Mayor de 4 mm", "Mayor de 5 mm"], 
        answer: 3, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, el proceso inflamatorio agudo genera edema celular y congestión venosa en la pared vesicular, lo que se traduce ecográficamente como un engrosamiento significativo de las capas musculares y serosas por encima de este valor de corte.<br><br>Perla ENARM: \"Los hallazgos que reporta el ultrasonido ante la presencia de Colecistitis y/o Colelitiasis son: Engrosamiento de la pared vesicular mayor de 5 mm\"<br><br>Análisis de Distractores: El grosor de 2 mm (A) representa un valor fisiológico normal en ayuno. El valor de 3 mm (B) representa el límite superior normal en condiciones basales pero no es diagnóstico para colecistitis. El valor de 4 mm (C) se asocia frecuentemente a otras patologías sistémicas (ej. hepatopatías o insuficiencia cardíaca) y no define el criterio agudo biliar de la GPC.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Diagnóstico: Pruebas diagnósticas, Página 16." 
    },
    {
        id: 7, 
        question: "En el abordaje por ultrasonido abdominal de la Colecistitis Aguda, ¿cuáles son las dimensiones que definen un alargamiento vesicular de significancia diagnóstica?", 
        options: ["6 cm axial y 3 cm diametral", "7 cm axial y 3 cm diametral", "8 cm axial y 4 cm diametral", "9 cm axial y 4 cm diametral"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, la obstrucción del conducto cístico por un lito condiciona un aumento progresivo en la tensión intraluminal por la acumulación de moco vesicular, lo que clínicamente se correlaciona con distensión vesical aguda y dolor localizado que se documenta ecográficamente bajo estas dimensiones.<br><br>Perla ENARM: \"Los hallazgos que reporta el ultrasonido ante la presencia de Colecistitis y/o Colelitiasis son: ... Alargamiento vesicular 8 cm axial and 4 cm diametral\"<br><br>Análisis de Distractores: Las dimensiones menores (A y B) corresponden a vesículas en rangos normales de distensión o con cambios inflamatorios incipientes no concluyentes. Las dimensiones de 9 cm y 4 cm (D) exceden los valores de referencia precisos de la GPC para el diagnóstico ecográfico agudo estandarizado.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Diagnóstico: Pruebas diagnósticas, Página 16." 
    },
    {
        id: 8, 
        question: "Cuando las manifestaciones clínicas sugieren Colecistitis Aguda pero los hallazgos del ultrasonido abdominal no son concluyentes, ¿cuál es el estudio de elección indicado para confirmar el diagnóstico?", 
        options: ["Colangiopancreatografía retrógrada endoscópica", "Tomografía axial computarizada", "Gammagrafía biliar (escintografía)", "Colangiorresonancia magnética"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, en casos de duda ecográfica la gammagrafía biliar con radioisótopos derivados del ácido iminodiacético es una prueba funcional altamente sensible que demuestra con certeza la obstrucción biliar.<br><br>Perla ENARM: \"Gammagrafía biliar (escintografia) tienen sensibilidad del 97%, se solicitar cuando la clínica y la ecografía no fueron concluyentes.\"<br><br>Análisis de Distractores: La colangiopancreatografía retrógrada endoscópica (A) es un procedimiento invasivo no indicado para la resolución de dudas ecográficas en colecistitis simple. La tomografía axial computarizada (B) proporciona excelente detalle anatómico pero es menos sensible para evaluar la función y permeabilidad biliar del conducto cístico. La colangiorresonancia magnética (D) aporta un mapa biliar anatómico pero no se establece como el estudio inmediato de elección tras ecografía no concluyente según la GPC.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Diagnóstico: Pruebas diagnósticas, Página 16." 
    },
    {
        id: 9, 
        question: "En la evaluación por Resonancia Magnética Nuclear de la Colecistitis Aguda, ¿cuál es el hallazgo característico para documentar signos de pericolecistitis?", 
        options: ["Áreas de alta densidad en el tejido graso", "Imágenes de alta densidad pericolecística", "Exclusión completa de la vesícula biliar", "Sombra acústica posterior hiperecogénica"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, la resonancia magnética nuclear permite caracterizar los cambios inflamatorios tisulares y la presencia de colecciones líquidas milimétricas adyacentes a la pared de la vesícula con base en la intensidad de señal de sus secuencias.<br><br>Perla ENARM: \"La Resonancia Magnética Nuclear (RMN) reporta: Signos de pericolecistitis con imágenes de alta densidad.\"<br><br>Análisis de Distractores: Las áreas de alta densidad en el tejido graso perivesicular (A) son hallazgos reportados de forma típica en la tomografía axial computada, no en la resonancia magnética. La exclusión vesicular (C) es el reporte clásico de la gammagrafía de vías biliares con Tc-HIDA. La sombra acústica posterior (D) es un artefacto físico puramente ultrasonográfico y no corresponde al estudio de resonancia magnética.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Diagnóstico: Pruebas diagnósticas, Página 17." 
    },
    {
        id: 10, 
        question: "En el diagnóstico de Colecistitis Aguda mediante gammagrafía de vías biliares con Tc-HIDA, ¿cuál es la descripción paraclínica del hallazgo conocido como Signo de RIM?", 
        options: ["Presencia de ecos intramurales vesiculares", "Exclusión de la vía biliar intrahepática", "Sombra acústica en el conducto cístico", "Aumento de radioactividad alrededor de fosa"], 
        answer: 3, 
        justification: "Justificación: De acuerdo GPC de Colecistitis y Colelitiasis, el signo de RIM refleja la hiperemia hepática reactiva y el incremento del flujo sanguíneo local en el tejido hepático adyacente a la vesícula biliar intensamente inflamada.<br><br>Perla ENARM: \"La Gammagrafía de vías biliares con Tc-HIDA reporta: Exclusión vesicular, Signo de RIM (Aumento de la radioactividad alrededor de la fosa vesicular)\"<br><br>Análisis de Distractores: La presencia de ecos intramurales (A) representa una alteración de la pared de carácter ecográfico. La exclusión funcional de la vesícula (B) se debe a la obstrucción del conducto cístico y es un criterio gammagráfico independiente del signo de RIM. La sombra acústica (C) es un artefacto físico derivado de las propiedades del ultrasonido y no tiene relación con estudios de medicina nuclear.", 
        source: "IMSS-237-09, Guía de Práctica Clínica Diagnóstico y Tratamiento de Colecistitis y Colelitiasis, 2010, Diagnóstico: Pruebas diagnósticas, Página 17." 
    },
    {
        id: 11, 
        question: "En pacientes con cólico biliar agudo, ¿cuál es la dosis recomendada de diclofenaco intramuscular para evitar la progresión de la inflamación hacia Colecistitis Aguda?", 
        options: ["50 mg", "75 mg", "100 mg", "150 mg"], 
        answer: 1,

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-teal-50 dark:bg-teal-900/20 text-teal-600 dark:text-teal-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-teal-100 dark:border-teal-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-teal-50 has-[:checked]:border-teal-400 dark:has-[:checked]:bg-teal-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-teal-600 focus:ring-teal-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-teal-600 dark:hover:bg-teal-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('23709Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('23709LastQId', currentQuestionId);
                else localStorage.removeItem('23709LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('23709Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    document.body.style.opacity = '0';
    document.body.style.transition = 'opacity 0.1s ease';
    onAuthStateChanged(auth, async (user) => {
        if (user) {const userDocRef = doc(db, "usuarios_autorizados", user.email);
            const userDocSnap = await getDoc(userDocRef);
            if(userDocSnap.exists()) {document.body.style.opacity = '1';} else {window.location.href = "index.html";}} else {window.location.href = "index.html";}

</script>
