    <script>
        const questionsData = [

    {
        id: 1, 
        question: "De acuerdo a la GPC, en Otitis Media Aguda de carácter recurrente, ¿cuál es el criterio de temporalidad y frecuencia alternativo para definir esta condición en un lapso de 12 meses?", 
        options: ["Dos o más episodios", "Tres o más episodios", "Cuatro o más episodios", "Cinco o más episodios"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, la recurrencia representa un estado de disfunción tubárica persistente definido clínicamente por la presencia de 3 o más episodios en 6 meses o bien 4 o más episodios en un año.<br><br>Perla ENARM: \"Algunos niños experimentarán episodios recurrentes de OMA, esta se define por tres o más episodios en seis meses o cuatro o más episodios en 12 meses.\"<br><br>Análisis de Distractores: Las opciones A y B son frecuencias inferiores a la norma para el periodo de 12 meses. La opción D supera la frecuencia mínima exigida por la GPC para establecer el diagnóstico de recurrencia.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Introducción, Página 8." 
    },
    {
        id: 2, 
        question: "En la Otitis Media Aguda pediátrica, ¿cuál es el patógeno bacteriano causante documentado en menos de 5% de los episodios clínicos?", 
        options: ["Streptococcus pneumoniae", "Haemophilus influenzae no tipificable", "Moraxella catarrhalis", "Streptococcus pyogenes"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, la etiología de la enfermedad está dominada por bacterias capsuladas y productoras de betalactamasas, siendo los estreptococos betahemolíticos del grupo A una causa sumamente rara.<br><br>Perla ENARM: \"El Streptococcus pyogenes (estreptococo B-hemolítico del grupo A) se presenta en menos del 5% de los casos.\"<br><br>Análisis de Distractores: Las opciones A, B y C representan la triada clásica de otopatógenos responsables de más de 90% de los cultivos timpánicos positivos en la infancia.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Introducción, Página 8." 
    },
    {
        id: 3, 
        question: "En Otitis Media Aguda, ¿cuál es el factor de riesgo modificable de mayor impacto epidemiológico que incrementa hasta 5 veces el riesgo de desarrollar la enfermedad?", 
        options: ["Asistencia a guardería", "Tabaquismo pasivo intradomiciliario", "Uso de chupones", "Obesidad infantil"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, el hacinamiento y el contacto directo con múltiples portadores nasofaringeos de otopatógenos en estancias infantiles representa la asociación epidemiológica más fuerte con una razón de momios de 5.0.<br><br>Perla ENARM: \"Los estudios sobre asistencia a guardería fueron concordantes acerca de la presencia de una fuerte asociación con un incremento de riesgo para OMA, ej. Prins-van Ginkel et al, en un estudio observacional prospectivo de 1,056 niños mostró (OR: 5.0; 95% IC: 2.6-9.6) el riesgo para OMA...\"<br><br>Análisis de Distractores: Las opciones B, C y D son factores de riesgo modificables reales, pero con una fuerza de asociación significativamente menor en comparación con la asistencia a guarderías de tiempo completo.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Promoción, Página 17." 
    },
    {
        id: 4, 
        question: "En Otitis Media Aguda, ¿cuál es el mecanismo fisiopatológico directo por el cual el uso de chupones y biberones favorece el desarrollo de la infección?", 
        options: ["Disminución del aclaramiento ciliar", "Reducción en la presión nasofaringea", "Hipertrofia linfoide del rodete tubárico", "Obstrucción mecánica del conducto externo"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, la fuerza de succión no fisiológica genera un vacío relativo nasofaríngeo que promueve el reflujo retrógrado de moco y bacterias hacia la trompa de Eustaquio y la caja timpánica.<br><br>Perla ENARM: \"El uso de pacificadores (chupones y biberones) pueden causar una reducción en la presión nasofarongea, capaz de aumentar el reflujo de secreciones en la trompa de Eustaquio, con incremento en el riesgo de OMA.\"<br><br>Análisis de Distractores: La opción A es causada por irritantes físicos como el humo del tabaco. La opción C es un proceos inflamatorio inmunológico crónico. La opción D se asocia con estenosis o cerumen, no con el uso de pacificadores.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Promoción, Página 17." 
    },
    {
        id: 5, 
        question: "En Otitis Media Aguda, ¿cuál es el porcentaje de reducción en la incidencia de esta patología que otorga la alimentación exclusiva al seno materno durante los primeros 6 meses de vida?", 
        options: ["Alrededor de 13%", "Alrededor de 25%", "Alrededor de 43%", "Alrededor de 51%"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, el aporte continuo de inmunoglobulinas y la menor succión forzada en comparación con el biberón confieren una reducción máxima y comprobada de la tasa de infección.<br><br>Perla ENARM: \"El efecto mayor se logra con lactancia materna exclusiva en los primeros 6 meses de vida (OR 0.57 IC 95% 0.44 - 0.75), reportando disminución de hasta 43% en la incidencia de OMA comparado contra los que nunca fueron lactados...\"<br><br>Análisis de Distractores: La opción A es el riesgo reducido si la lactancia no es exclusiva y dura un mínimo de 3 meses. Las opciones B y D no representan el porcentaje de eficacia preventiva asignado a la lactancia exclusiva en la GPC.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Prevención, Página 18." 
    },
    {
        id: 6, 
        question: "En la prevención de Otitis Media Aguda, ¿cuál es el porcentaje de reducción de la incidencia asociado a la vacunación anual contra influenza en el paciente pediátrico?", 
        options: ["Alrededor de 13%", "Alrededor de 34%", "Alrededor de 40%", "Alrededor de 51%"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, evitar la infección viral previene la disfunción tubárica aguda y el cese de motilidad mucociliar, reduciendo a la mitad los eventos supurativos bacterianos secundarios.<br><br>Perla ENARM: \"Una revisión sistemática de Manzoli et al... en 8 de 11 estudios se reportó una incidencia menor de OMA 51% (95% IC: 21%-71%) de reducción.\"<br><br>Análisis de Distractores: La opción A es la reducción por lactancia materna corta no exclusiva. La opción B no representa un porcentaje de vacuna. La opción C es el porcentaje de reducción pero en hospitalizaciones totales por OMA tras vacunación universal.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Prevención, Página 19." 
    },
    {
        id: 7, 
        question: "En Otitis Media Aguda, ¿cuál es el serotipo de Streptococcus pneumoniae cubierto exclusivamente por la vacuna conjugada de 13 valencias y catalogado como causa principal de mastoiditis?", 
        options: ["Serotipo 14", "Serotipo 19A", "Serotipo 19F", "Serotipo 23F"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, tras la introducción de vacunas previas se produjo un reemplazo de serotipos invasivos, destacando este serotipo particular por su agresividad e inflamación destructiva temporal.<br><br>Perla ENARM: \"La VCN 13 contiene 6 serotipos adicionales a la VCN7, es la única que incluye serotipo 19A, identificado como la causa más importante de enfermedad invasiva por neumococo, incluyendo mastoiditis.\"<br><br>Análisis de Distractores: Las opciones A, C y D corresponden a serotipos capsulares clásicos que ya se encontraban cubiertos desde la formulación heptavalente original (VCN7), por lo que no son exclusivos de la de 13 valencias.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Prevención, Página 20." 
    },
    {
        id: 8, 
        question: "Para establecer el diagnóstico de certeza de Otitis Media Aguda, ¿cuál es la tríada de hallazgos clínicos que deben presentarse de forma simultánea según la GPC?", 
        options: ["Otalgia, fiebre e hiperemia timpánica", "Otorrea, perforación y dolor intenso", "Inicio agudo, inflamación y líquido medio", "Hipoacusia, opacidad e hipomovilidad"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, no se debe diagnosticar esta enfermedad únicamente con un tímpano rojo (que puede ser reactivo al llanto o fiebre), se requiere obligadamente asociar temporalidad aguda con signos inflamatorios y derrame retrotimpánico.<br><br>Perla ENARM: \"OMA debe ser diagnosticada solamente en presencia de hallazgos simultáneos de: 1. Inicio agudo de síntomas 2. Signos de inflamación de la membrana timpánica; y 3. Presencia de líquido en el oído medio\"<br><br>Análisis de Distractores: Las opciones A, B y D contienen signos individuales (como fiebre, otalgia o hipomovilidad) que de forma aislada o incompleta no cumplen con la definición diagnóstica simultánea estricta dictada por el consenso de la GPC.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Diagnóstico Clínico, Página 21." 
    },
    {
        id: 9, 
        question: "En el diagnóstico de Otitis Media Aguda, ¿cuál hallazgo clínico aislado se considera por sí mismo como un signo objetivo confirmatorio de la enfermedad si no hay otitis externa?", 
        options: ["Hiperemia intensa del mango del martillo", "Pérdida total del reflejo luminoso timpánico", "Presencia de otorrea con perforación espontánea", "Temperatura corporal mayor a 38.5 °C"], 
        answer: 2, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, la salida de líquido purulento a través de una fístula timpánica de reciente aparición evidencia directamente la fase supurativa y la evacuación del empiema de la caja media.<br><br>Perla ENARM: \"La sola presencia de otorrea, no secundaria a otitis externa, asociada con perforación espontánea de la membrana timpánica puede también ser considerada por sí misma como un signo objetivo de OMA.\"<br><br>Análisis de Distractores: Las opciones A y B son datos inflamatorios de deparación otoscópica, pero no confirman derrame por sí solos. La opción D es un parámetro general sistémico de severidad, no de localización ótica.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Diagnóstico Clínico, Página 21." 
    },
    {
        id: 10, 
        question: "Para la Otitis Media Aguda, ¿cuáles son los valores específicos de sensibilidad y especificidad diagnóstica que otorga la otoscopía neumática?", 
        options: ["Sensibilidad 70% y especificidad 60%", "Sensibilidad 80% y especificidad 94%", "Sensibilidad 90% y especificidad 75%", "Sensibilidad 94% y especificidad 80%"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, evaluar de forma dinámica la complianza de la membrana timpánica mediante cambios de presión neumática brinda la mayor exactitud diagnóstica en el consultorio.<br><br>Perla ENARM: \"La otoscopia neumática es el recurso más apropiado para el diagnóstico de OMA. Dada la posibilidad de realizar una exploración dinámica, usándola se puede identificar la presencia de líquido en el oído medio con 94% de sensibilidad (95% IC: 92%-96%) y 80% de especificidad (95% IC: 75%-86%).\"<br><br>Análisis de Distractores: Las opciones A, B y C contienen porcentajes alterados o invertidos que no representan la validez de la prueba de exploración recomendada por la GPC.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Diagnóstico Clínico, Página 21." 
    },
    {
        id: 11, 
        question: "Durante la exploración armada para Otitis Media Aguda, ¿cuál es el número exacto de características de la membrana timpánica que deben valorarse para un diagnóstico adecuado?", 
        options: ["Tres características", "Cuatro características", "Cinco características", "Seis características"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, la inspección sistemática y por cuadrantes del tímpano disminuye la variabilidad interobservador y los falsos positivos.<br><br>Perla ENARM: \"El examen de la MT debe incluir la valoración de 6 características: integridad, posición, color, translucidez, iluminación y movilidad e indicar si es bilateral o unilateral.\"<br><br>Análisis de Distractores: Las opciones A, B y C representan un número incompleto de parámetros semiológicos otológicos, lo cual arriesga pasar por alto datos sutiles de inflamación o derrame subagudo.", 
        source: "GPC-IMSS-496-21, Prevención, Diagnóstico y Tratamiento de la Otitis Media Aguda en la Edad Pediátrica, 2021, Sección: Diagnóstico Clínico, Página 22." 
    },
    {
        id: 12, 
        question: "En lactantes menores de 6 meses en quienes se deba investigar Otitis Media con Derrame tras una valoración clínica no concluyente, ¿cuál es el estímulo de timpanometría de elección?",

                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('49621Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('49621LastQId', currentQuestionId);
                else localStorage.removeItem('49621LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('49621Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
