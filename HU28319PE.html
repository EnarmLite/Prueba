    <script>
        const questionsData = [
    {
        id: 1, 
        question: "En la evaluación paraclínica de Sepsis Neonatal, ¿cuál es el punto de corte de la relación de neutrófilos inmaduros/totales (I/T) útil para descartar el diagnóstico?", 
        options: ["Mayor a 0.2", "Menor a 0.5", "Mayor a 0.8", "Menor a 0.1"], 
        answer: 0, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, la biometría hemática por sí sola carece de precisión absoluta, pero el índice de neutrófilos inmaduros sobre totales posee un alto valor predictivo negativo. Encontrar una relación I/T mayor a 0.2 ayuda sustancialmente a descartar la patología temprana cuando se asocia a un cuadro clínico de baja sospecha, aunque no es confirmatoria por sí sola debido a múltiples causas no infecciosas que alteran los neutrófilos.<br><br>Perla ENARM: \"La relación I/T > 0.2 puede ser útil para descartar sepsis neonatal temprana, sin embargo, no sirve para el diagnóstico. Además de la relación I/T, deben considerarse otros parámetros de la biometría hemática.\"<br><br>Análisis de Distractores: Las opciones B, C y D presentan valores matemáticos incorrectos. Un índice I/T menor a 0.2 es el valor normal de referencia, mientras que cortes como 0.5 o 0.8 representarían desviaciones a la izquierda masivas, pero el estándar validado de descarte se sitúa estadísticamente en > 0.2.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 1. Diagnóstico, Página 22." 
    },
    {
        id: 2, 
        question: "En el abordaje de Sepsis Neonatal, ¿en qué intervalo de tiempo se considera que el conteo celular leucocitario posee su mayor valor predictivo?", 
        options: ["Primeras 2 horas", "Entre 6 y 12 horas", "A las 24 horas", "Después de 72 horas"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, la dinámica de la respuesta hematopoyética fetal y neonatal sufre variaciones abruptas al momento del pinzamiento del cordón y las primeras horas de adaptación. La leucocitosis reactiva inicial disminuye la especificidad diagnóstica de la biometría hemática extraída inmediatamente al nacer, por lo que esperar a la ventana de 6 a 12 horas de vida extrauterina otorga mayor fidelidad en la detección de leucopenia o desviación a la izquierda.<br><br>Perla ENARM: \"Considerar el conteo celular leucocitario obtenido entre las 6 h y 12 h de nacido como más predictivo de sepsis temprana que el obtenido inmediatamente después del nacimiento.\"<br><br>Análisis de Distractores: Muestras en las primeras 2 horas se asocian a falsos positivos por estrés obstétrico. A las 24 horas o después de las 72 horas, la utilidad pronóstica inicial se pierde y el paciente podría presentar deterioro severo sin haber recibido manejo.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 1. Diagnóstico, Página 18." 
    },
    {
        id: 3, 
        question: "Durante el seguimiento de Sepsis Neonatal temprana, ¿en qué ventana temporal se debe medir la Proteína C Reactiva para evaluar el retiro seguro del manejo antibiótico empírico?", 
        options: ["12 a 24 horas", "72 a 96 horas", "5 a 7 días", "36 a 48 horas"], 
        answer: 3, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, la Proteína C Reactiva (PCR) tiene un pico de elevación retardado respecto al inicio del estímulo inflamatorio. Su medición entre el día 1.5 y 2 permite establecer un valor predictivo negativo cercano al 98%, lo cual, aunado a hemocultivos negativos y estabilidad clínica, proporciona la seguridad biomédica necesaria para suspender el tratamiento antimicrobiano y evitar disbiosis.<br><br>Perla ENARM: \"La PCR puede usarse durante el seguimiento para evaluar el retiro del manejo antibiótico, dentro de las 36 h a 48 h.\"<br><br>Análisis de Distractores: Antes de las 24 horas, la PCR aún no alcanza niveles discriminatorios. Mantener empíricos por 72 horas o 5 días sin cultivos positivos promueve resistencia bacteriana y riesgo de enterocolitis necrosante.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 1. Diagnóstico, Página 19." 
    },
    {
        id: 4, 
        question: "En el estudio integral de Sepsis Neonatal temprana, ¿cuál es la recomendación sobre la toma de urocultivo de rutina?", 
        options: ["No tomar de rutina", "Toma mediante punción suprapúbica", "Toma por cateterismo vesical", "Toma en bolsa recolectora"], 
        answer: 0, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, las infecciones de vías urinarias en las primeras 72 horas de vida extrauterina son extremadamente infrecuentes porque la patogenia de la infección vertical es ascendente intrauterina o hematógena y respiratoria aguda. Por lo tanto, el urocultivo carece de rendimiento diagnóstico costo-efectivo y somete al neonato a procedimientos invasivos injustificados.<br><br>Perla ENARM: \"No tomar urocultivo de rutina como parte del estudio del RN con sospecha de sepsis neonatal temprana.\"<br><br>Análisis de Distractores: La punción suprapúbica o el cateterismo vesical son los estándares para obtener orina estéril cuando hay sospecha fundamentada en lactantes o sepsis tardía, pero están proscritos como \"rutina\" en el abordaje de sepsis temprana.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 1. Diagnóstico, Página 21." 
    },
    {
        id: 5, 
        question: "En el contexto de Sepsis Neonatal, ¿cuáles interleucinas se recomiendan como apoyo junto con los datos clínicos para el diagnóstico temprano?", 
        options: ["Interleucinas 1 y 2", "Interleucinas 4 y 10", "Interleucinas 6 y 8", "Interleucinas 12 y 17"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, las citoquinas proinflamatorias de respuesta ultrarrápida, específicamente IL-6 e IL-8, se elevan horas antes que los marcadores tradicionales como la PCR. Su determinación ayuda de forma temprana a incrementar la sensibilidad del escrutinio inicial, funcionando como herramientas adyuvantes predictivas de bacteriemia o inflamación sistémica profunda.<br><br>Perla ENARM: \"Determinar las interleucinas (IL) 6 y 8 (en caso de tenerlas disponibles), como apoyo junto con los datos clínicos para el diagnóstico de sepsis.\"<br><br>Análisis de Distractores: Las IL-4 e IL-10 son mediadores antiinflamatorios. IL-1 e IL-2 son parte de la respuesta inmune, pero no están estandarizadas ni evaluadas por la guía para este fin profiláctico/diagnóstico. IL-12 e IL-17 participan en inmunidad celular específica o autoinmune, no en escrutinio agudo de sepsis.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 1. Diagnóstico, Página 20." 
    },
    {
        id: 6, 
        question: "Según los criterios clínicos para Sepsis Neonatal de inicio tardío, ¿cuál de las siguientes patologías se considera un factor de riesgo para su desarrollo?", 
        options: ["Hipertrofia pilórica infantil", "Conducto arterioso permeable", "Comunicación interventricular apical", "Atresia esofágica aislada"], 
        answer: 1, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, el conducto arterioso permeable persistente favorece la falla hemodinámica pulmonar y prolonga la dependencia de ventilación mecánica invasiva y catéteres centrales en prematuros. Esta invasión médica crónica altera las barreras naturales, exponiendo directamente al torrente sanguíneo a la flora nosocomial y elevando la incidencia de bacteriemia de inicio tardío.<br><br>Perla ENARM: \"Considerar como factores de riesgo para sepsis tardía alguno de los siguientes: [...] Conducto arterioso permeable.\"<br><br>Análisis de Distractores: La atresia esofágica, la comunicación interventricular y la hipertrofia pilórica infantil son condiciones quirúrgicas o estructurales que no se listan directamente en la guía como factores pivotales de riesgo para sepsis tardía comparados con la disrupción hemodinámica e invasiva que genera un conducto arterioso sintomático en la UCIN.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 2. Tratamiento, Página 24." 
    },
    {
        id: 7, 
        question: "En Sepsis Neonatal complicada con infección nosocomial asociada a cuidados de la salud y aislamiento de Candida spp, ¿cuál es el antifúngico de primera elección?", 
        options: ["Fluconazol profiláctico", "Caspofungina intravenosa", "Anfotericina B liposomal", "Ketoconazol vía oral"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, la invasión fúngica sistémica es una complicación grave del uso de catéteres y antibióticos de amplio espectro. La anfotericina B liposomal es fungicida de amplio espectro para levaduras y cuenta con una formulación lipídica que reduce dramáticamente la nefrotoxicidad en el riñón inmaduro neonatal, consolidándose como la opción terapéutica primaria definitiva.<br><br>Perla ENARM: \"En caso de identificarse Candida spp, debe usarse anfotericina B, de preferencia liposomal o de dispersión coloidal.\"<br><br>Análisis de Distractores: El fluconazol se utiliza frecuentemente de manera profiláctica en prematuros extremos, pero no es la terapia empírica de rescate ante candidemia franca. Caspofungina pertenece a otra familia y se usa de segunda línea. El ketoconazol oral carece de absorción y perfil de seguridad sistémica en cuidados intensivos neonatales.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 2. Tratamiento, Página 28." 
    },
    {
        id: 8, 
        question: "En pacientes con Sepsis Neonatal y resistencia confirmada que impida usar aminoglucósidos o cefalosporinas, ¿qué fármaco se recomienda como monoterapia de rescate?", 
        options: ["Eritromicina intravenosa", "Clindamicina dosis alta", "Linezolid infusión continua", "Piperacilina con tazobactam"], 
        answer: 3, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, frente a la colonización nosocomial con bacterias gramnegativas productoras de betalactamasas de espectro extendido (BLEE) o resistencia cruzada, la piperacilina combinada con el inhibidor tazobactam (o el uso aislado de amikacina si el antibiograma lo permite) ofrece una amplia cobertura antipseudomónica y entérica, estableciéndose como un régimen superior y seguro en escalamiento.<br><br>Perla ENARM: \"Considerar el uso de amikacina o de piperacilina con tazobactam como monoterapia en los casos de resistencia conocida al tratamiento estándar.\"<br><br>Análisis de Distractores: Linezolid y clindamicina son activos exclusivamente contra bacterias grampositivas (estafilococo o estreptococo), por lo que dejarían desprotegido el espectro de gramnegativos, principales culpables de resistencia entérica grave. La eritromicina no tiene utilidad en sepsis sistémica general por flora fecal.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 2. Tratamiento, Página 27." 
    },
    {
        id: 9, 
        question: "En recién nacidos prematuros con Sepsis Neonatal, ¿cuál terapia adyuvante cuenta con evidencia de recomendación fuerte en caso de disponer del recurso?", 
        options: ["Inmunoglobulina G humana", "Factores estimulantes granulocíticos", "Pentoxifilina intravenosa", "Transfusión de plasma fresco"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, la pentoxifilina ejerce un efecto reológico y de inhibición específica del factor de necrosis tumoral alfa (TNF-a) y de la cascada proinflamatoria. En metaanálisis, este fármaco disminuyó la tasa de mortalidad en neonatos prematuros sépticos sin incrementar los efectos adversos, considerándose una terapia adyuvante viable si la unidad médica dispone de ella.<br><br>Perla ENARM: \"La pentoxifilina puede considerarse, en caso de contar con el recurso, como terapia adyuvante en el RN prematuro con sepsis neonatal.\"<br><br>Análisis de Distractores: La GPC desaconseja expresamente el uso de Inmunoglobulina G intravenosa o factores estimulantes de colonias granulocíticas (G-CSF) de manera rutinaria por no impactar en la mortalidad o presentar resultados inconclusos en neonatos. El plasma fresco se reserva para coagulopatías documentadas.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 2. Tratamiento, Página 31." 
    },
    {
        id: 10, 
        question: "En pacientes con Choque Séptico Neonatal en fase de reanimación aguda, ¿cuál es la solución de elección inicial para la expansión de volumen?", 
        options: ["Solución glucosada 10%", "Albúmina humana 5%", "Gelatinas polimerizadas", "Solución salina 0.9%"], 
        answer: 3, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, el pilar inicial para revertir la hipovolemia distributiva son los cristaloides isotónicos, como la solución salina al 0.9%. Estos logran expandir el volumen intravascular de manera rápida, segura y accesible, mejorando la precarga del ventrículo y el gasto cardíaco sin los riesgos alergénicos o costos asociados a otras terapias.<br><br>Perla ENARM: \"Se recomienda el uso de cristaloides (solución salina al 0.9%, entre otros) en bolos de 10 ml/kg, máximo 40 a 60 ml/kg en la primera hora. El cristaloide es generalmente preferido sobre la albúmina, ya que se asocia con menor riesgo de retención de líquidos.\"<br><br>Análisis de Distractores: La albúmina o los coloides artificiales (gelatinas) no demostraron superioridad en la reducción de mortalidad respecto a cristaloides y pueden fugar al intersticio generando mayor edema pulmonar capilar. La solución glucosada se usa para mantenimiento calórico, pero es inefectiva y peligrosa para reanimación de volumen (riesgo de hiperglucemia e hiponatremia celular).", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 4. Choque Séptico, Página 36." 
    },
    {
        id: 11, 
        question: "En Sepsis Neonatal, ¿qué parámetro de gasometría arterial se considera básico ante la sospecha de estado de choque para evaluar el metabolismo anaerobio?", 
        options: ["Presión parcial de dióxido", "Saturación de hemoglobina", "Lactato sérico elevado", "Exceso de base positivo"], 
        answer: 2, 
        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, la hipoperfusión hística aguda agota la vía aeróbica mitocondrial, desviando el piruvato hacia la producción de ácido láctico. La cuantificación del lactato sérico es el biomarcador gasométrico por excelencia para identificar de forma temprana la hipoxia tisular oculta, graduar la severidad del choque y monitorizar el éxito de la reanimación con líquidos.<br><br>Perla ENARM: \"Deben considerarse los siguientes estudios como básicos ante la sospecha de choque séptico: Gases sanguíneos arteriales (gasometría), Lactato sérico, Conteo sanguíneo completo...\"<br><br>Análisis de Distractores: Un exceso de base positivo indicaría alcalosis metabólica, mientras que el choque produce déficit de base. La saturación de oxígeno y la presión de dióxido de carbono evalúan la ventilación y la hematosis pulmonar, pero no dictaminan obligadamente la perfusión periférica celular de la misma forma en que lo hace el aclaramiento de lactato.",

        question: "En un cuadro de Choque Séptico Neonatal, ¿qué dato clínico indica la necesidad de suspender las cargas hídricas e iniciar soporte inotrópico?", 
        options: ["Gasto urinario mayor a 1 ml/kg/h", "Hepatomegalia de nueva aparición", "Frecuencia cardiaca de 140 lpm", "Llenado capilar de 2 segundos"],

        justification: "Justificación: De acuerdo GPC de Sepsis Neonatal, el miocardio ventricular derecho neonatal es poco distensible. Ante la infusión de fluidos por encima de su capacidad contráctil, sobreviene una falla cardiaca aguda manifestada clínicamente por el aumento abrupto del tamaño hepático (congestión venosa sistémica) y crepitantes pulmonares. Este signo clínico obliga a detener el líquido e iniciar soporte vasomotor (aminas) para incrementar el inotropismo.<br><br>Perla ENARM: \"Datos de sobrecarga hídrica: Disfunción cardiaca (Taquicardia, hepatomegalia, cardiomegalia). Insuficiencia respiratoria... Suspender cargas e iniciar inotrópicos y revalorar la necesidad de volumen.\"<br><br>Análisis de Distractores: Un gasto urinario >1 ml/kg/h, una frecuencia cardíaca normal (140 lpm en neonatos) y un llenado capilar normal de 2 segundos son metas cumplidas de perfusión, no signos de sobrecarga ventricular derecha aguda.",

        id: 17, 
        question: "Durante el manejo del Choque Séptico Neonatal refractario, ¿qué criterio gasométrico justifica referir al paciente para Oxigenación por Membrana Extracorpórea (ECMO)?",

        question: "En la morbimortalidad por Sepsis Neonatal, ¿cuál de las siguientes se clasifica estrictamente como una complicación a corto plazo?",

    {

        question: "A nivel epidemiológico mundial, ¿cuál es el porcentaje estimado de mortalidad que presenta la Sepsis Neonatal?",

        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, las estimaciones para la patología indican una altísima incidencia de 2202 casos por cada 100,000 nacidos vivos a nivel mundial, con una letalidad alarmante que fluctúa entre el 11% y el 19%. Esta tasa de mortalidad es la razón por la cual se considera una enfermedad de alto riesgo que justifica el uso empírico inmediato de antimicrobianos.<br><br>Perla ENARM: \"Las estimaciones para la sepsis neonatal son de 2202 casos por cada 100 000 nacidos vivos, con una mortalidad de entre el 11% y el 19%.\"<br><br>Análisis de Distractores: Porcentajes de 1% a 5% subestiman drásticamente la letalidad del choque séptico en este grupo etario. Valores por encima del 30% o 50% son cifras de mortalidad observadas históricamente en la era pre-antibiótica o en entornos de recursos nulos sin acceso a cuidados intensivos, pero el promedio global actual establecido es del 11 al 19%.",

    {

        question: "Cuando se indica dobutamina en la terapia combinada inicial del Choque Séptico Neonatal, ¿cuál es la dosis máxima recomendada por la GPC?", 
        options: ["20 microgramos/kg/min", "10 microgramos/kg/min", "5 microgramos/kg/min", "50 microgramos/kg/min"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, el miocardio del recién nacido tiene un umbral de tolerancia a los receptores beta-1 diferente al adulto. Superar la dosis de 10 microgramos/kg/min de dobutamina incrementa desproporcionadamente el consumo miocárdico de oxígeno y predispone a arritmias letales y vasodilatación periférica excesiva sin aportar beneficio extra al gasto cardíaco.<br><br>Perla ENARM: \"La combinación de dopamina en dosis bajas (<8 microgramos/kg/min) y dobutamina (hasta 10 microgramos/kg/min), se recomienda de manera inicial.\"<br><br>Análisis de Distractores: Las dosis de 20 o 50 microgramos/kg/min generarían taquicardia severa y falla de llenado diastólico. La dosis de 5 microgramos/kg/min es el rango de inicio o dosis baja, pero el tope máximo explícito para la recomendación combinada inicial estricta es 10 microgramos/kg/min.",

        question: "Según la GPC de Sepsis Neonatal, ¿cuál es la recomendación actual sobre el uso de probióticos como terapia preventiva?",

        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, aunque existen estudios que indican una reducción en la mortalidad y enterocolitis necrosante con el uso de probióticos, la enorme falta de consenso internacional sobre qué cepa específica utilizar, la posología exacta y la duración del tratamiento impiden que se emita una recomendación formal para su uso estandarizado en las terapias intensivas.<br><br>Perla ENARM: \"El uso de probióticos reduce la incidencia de enterocolitis necrosante y la mortalidad por sepsis, sin embargo, debido a la falta de consenso sobre la posología, tipo de probiótico y duración del tratamiento en la sepsis neonatal, no se puede recomendar como una terapia estándar.\"<br><br>Análisis de Distractores: Recomendarlos por rutina (opción A, B, D) contradice el punto de buena práctica de la guía, ya que el riesgo de bacteriemia o fungemia por el propio probiótico (translocación de la cepa viva) en prematuros extremos aún genera debate sin posologías estandarizadas.",

    {
        id: 28, 
        question: "En recién nacidos prematuros, ¿cuál es la recomendación respecto al uso profiláctico de inmunoglobulina intravenosa para evitar Sepsis Neonatal?", 
        options: ["Administrar en las primeras 24 horas", "No administrar como estándar profiláctico", "Dosis semanal hasta alcanzar el término", "Usar solo combinada con lactoferrina"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, la evidencia basada en grandes metaanálisis y ensayos clínicos multicéntricos demostró rotundamente que la administración rutinaria de inmunoglobulina intravenosa no previene el desarrollo de infecciones intrahospitalarias, ni mejora las tasas de supervivencia ni disminuye las secuelas neurológicas a los dos años, por lo que su uso implica altos costos y riesgos sin beneficio clínico.<br><br>Perla ENARM: \"En RN prematuros, se recomienda no administrar profilácticamente inmunoglobulina estándar para disminuir la aparición de sepsis o la mortalidad.\"<br><br>Análisis de Distractores: Las opciones que sugieren administrar dosis únicas, semanales o combinadas carecen de fundamento científico y van en contra de las pautas de ahorro de recursos ineficaces descritas en la normativa internacional y nacional para neonatología.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 2. Tratamiento, Página 30." 
    },
    {
        id: 29, 
        question: "En la evaluación del Choque Séptico Neonatal refractario, ¿qué concluye la GPC sobre el uso de pruebas dinámicas (como elevación de piernas o variación de presión de pulso) para predecir respuesta a fluidos?", 
        options: ["Son el estándar de oro en todo neonato", "No existen pruebas dinámicas validadas", "Reemplazan la necesidad de medir lactato", "Tienen sensibilidad superior al 95%"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, las pruebas hemodinámicas dinámicas son pilares en pacientes pediátricos mayores o adultos. Sin embargo, en neonatos (especialmente prematuros), la mecánica respiratoria, los cortocircuitos fetales persistentes y la distensibilidad miocárdica impiden la estandarización anatómica. Por ello, a diferencia de otras edades, no hay validación para usar estos test y la reposición hídrica se basa en parámetros clínicos y ecocardiografía funcional.<br><br>Perla ENARM: \"Al contrario del uso de pruebas dinámicas en pacientes de más de un mes de edad, en los RN el uso de estas pruebas para determinar la respuesta a fluidos en choque séptico refractario no se han estudiado, por lo que no las recomendamos.\"<br><br>Análisis de Distractores: Afirmar que son el estándar de oro o que tienen alta sensibilidad es falso en el nicho neonatal. La reanimación hídrica neonatal sigue dependiendo de datos clínicos de perfusión, gasto urinario, gasometría (lactato) y ecocardiografía, no de la variabilidad de la presión de pulso.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 4. Choque Séptico, Página 40." 
    },
    {
        id: 30, 
        question: "En el monitoreo invasivo de un Choque Séptico Neonatal refractario a volumen, ¿cuál es la meta de saturación venosa central de oxígeno (SvO2) que debe mantenerse?", 
        options: ["Mayor o igual a 90%", "Mayor o igual a 70%", "Menor o igual a 50%", "Menor o igual a 60%"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, la saturación venosa central de oxígeno (SvO2) refleja el balance global entre el aporte de oxígeno sistémico (gasto cardíaco) y el consumo celular. Una SvO2 inferior al 70% denota una extracción excesiva de oxígeno por los tejidos secundaria a hipoperfusión o falla de bomba, constituyendo el punto de corte fisiológico para intervenir agresivamente con inotrópicos o hemotransfusión.<br><br>Perla ENARM: \"La exploración física puede no ser suficientemente sensible... considerar las siguientes herramientas adicionales para su monitoreo: [...] Saturación venosa central de oxígeno (SvCO2) $\\ge$ 70%.\"<br><br>Análisis de Distractores: Una SvO2 menor a 50% o 60% indica choque severo refractario y metabolismo anaerobio franco (metas no cumplidas). Una SvO2 >90% (metabolismo hiperdinámico o incapacidad de extracción tisular por daño mitocondrial grave) tampoco es el objetivo hemodinámico; el umbral exacto de protección tisular validado es $\\ge$ 70%.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 4. Choque Séptico, Página 41." 
    },
    {
        id: 31, 
        question: "En la gasometría de un recién nacido con sospecha de Sepsis, ¿a partir de qué valor del déficit de base se integra un criterio analítico predictor de bacteriemia grave?", 
        options: ["Mayor o igual a 5 mmol/L", "Mayor o igual a 15 mmol/L", "Mayor o igual a 20 mmol/L", "Mayor o igual a 10 mmol/L"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, un déficit de base persistente indica consumo exhaustivo de bicarbonato para tamponar la acidosis láctica derivada de la hipoperfusión. Los modelos internacionales de predicción clínica asocian firmemente un déficit de base igual o superior a 10 mmol/L como un signo bioquímico de disfunción microvascular avanzada, orientando el diagnóstico hacia sepsis neonatal inminente.<br><br>Perla ENARM: \"Acidosis metabólica o déficit de base $\\ge$ 10 mmol/L (como signo asociado en modelos predictivos).\"<br><br>Análisis de Distractores: Cortes de 5 mmol/L son inespecíficos y pueden verse en deshidratación leve. Valores de 15 o 20 mmol/L representan acidosis premórtem o choque en fase terminal, pero el punto de corte formal estipulado para establecer sospecha fuerte desde el inicio del abordaje es $\\ge$ 10 mmol/L.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 1. Diagnóstico, Página 16." 
    },
    {
        id: 32, 
        question: "Durante el manejo del Choque Séptico Neonatal, ¿en qué escenario fisiopatológico específico se considera el uso de vasopresina como terapia de rescate?", 
        options: ["Como inotrópico de primera línea", "Choque refractario a catecolaminas", "Falla miocárdica derecha pura", "Vasodilatación transitoria leve"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, el estado inflamatorio grave agota las reservas endógenas de vasopresina y desensibiliza los receptores alfa adrenérgicos en el endotelio, provocando vasoplejia profunda (hipotensión intratable). El uso de vasopresina o terlipresina actúa directamente sobre los receptores V1, restableciendo el tono vascular solo como última línea cuando dosis altas de adrenalina o noradrenalina han fracasado.<br><br>Perla ENARM: \"Tanto la vasopresina como la terlipresina se pueden considerar como terapia de rescate en pacientes con choque séptico vasodilatador que no responde a dosis altas de noradrenalina ni a otros simpaticomiméticos.\"<br><br>Análisis de Distractores: Usarla como primera línea o en estados leves causa vasoconstricción mesentérica y periférica letal (isquemia tisular iatrogénica). En falla derecha pura, el inotropismo (milrinona o dobutamina) y vasodilatadores pulmonares (óxido nítrico) son requeridos, no vasoconstrictores sistémicos potentes.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 4. Choque Séptico, Página 41." 
    },
    {
        id: 33, 
        question: "Cuando existe indicación documentada de insuficiencia suprarrenal en un neonato con Choque Séptico, ¿cuál es la dosis de carga inicial recomendada de hidrocortisona intravenosa?", 
        options: ["2 mg/kg/día", "10 mg/kg/día", "5 mg/kg/día", "0.5 mg/kg/día"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, la reposición de glucocorticoides para restaurar el tono vascular dependiente de catecolaminas requiere dosis precisas (dosis de estrés) para no inducir inmunosupresión ni hiperglucemia severa. La administración recomendada para suplir el eje hipotálamo-hipófisis-adrenal deficiente en el neonato crítico es de 2 mg/kg/día, vigilando la restitución paulatina de la tensión arterial.<br><br>Perla ENARM: \"Iniciar Hidrocortisona 2 mg/kg/día de carga seguido de 2mg/kg/día cada 12 hrs (* Sospecha de insuficiencia suprarrenal primaria).\"<br><br>Análisis de Distractores: Dosis de 10 mg o 5 mg/kg causan perforación intestinal y catabolismo proteico masivo en recién nacidos. Una dosis de 0.5 mg/kg/día es subóptima (dosis fisiológica basal, no dosis de rescate frente a choque).", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 7. Anexos (Algoritmo 3), Página 47." 
    },
    {
        id: 34, 
        question: "En un paciente con diagnóstico comprobado de Sepsis Neonatal (hemocultivos positivos) y exclusión documentada de afección meníngea, ¿cuántos días de duración debe tener el tratamiento antimicrobiano?", 
        options: ["3 a 5 días", "7 a 10 días", "14 a 21 días", "28 días"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, la bacteriemia primaria sin diseminación al sistema nervioso central requiere un curso antibiótico suficiente para erradicar la infección tisular, pero sin prolongarse innecesariamente. El estándar terapéutico internacional estipula un esquema curativo completo de 7 a 10 días; tiempos más prolongados aumentan el riesgo de toxicidad, disrupción del microbioma y resistencia.<br><br>Perla ENARM: \"Se recomienda continuar el tratamiento por 7 a 10 días, en caso de ser el resultado de los hemocultivos positivos o en cultivos negativos, pero con sospecha de sepsis neonatal temprana sin meningitis.\"<br><br>Análisis de Distractores: Tratar 3 a 5 días predispone a recaídas bacterémicas. Prolongar el esquema a 14 o 21 días es estrictamente obligatorio solo si se confirma meningitis neonatal o abscesos profundos. Esquemas de 28 días se reservan para osteomielitis o endocarditis compleja.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 2. Tratamiento, Página 29." 
    },
    {
        id: 35, 
        question: "¿En qué situación microbiológica específica la GPC recomienda agregar cefotaxima como terapia de segunda línea para Sepsis Neonatal?", 
        options: ["Sepsis bacteriana por gramnegativos", "Bacteriemia por Staphylococcus aureus", "Sospecha de Enterococcus faecalis", "Infección sistémica de origen viral"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, el uso de cefalosporinas de tercera generación es potente contra bacilos gramnegativos, pero fomenta la selección de cepas resistentes y carece de actividad contra Enterococcus. Por ende, la cefotaxima se reserva casi exclusivamente para escalar el tratamiento ante infecciones documentadas o sospecha focal severa de bacterias gramnegativas (como meningitis por bacilos entéricos).<br><br>Perla ENARM: \"Agregar en sepsis bacteriana por gramnegativos, another antibiótico activo contra este tipo de bacterias (cefepima, cefotaxima o carbapenémico, entre otros).\"<br><br>Análisis de Distractores: Staphylococcus aureus requiere dicloxacilina o vancomicina. Enterococcus faecalis es intrínsecamente resistente a TODAS las cefalosporinas, por lo que su uso resultaría en falla terapéutica directa. Evidentemente, los antivirales cubren infecciones virales.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 2. Tratamiento, Página 26." 
    },
    {
        id: 36, 
        question: "¿Qué conducta terapéutica estipula la guía acerca del uso de factores estimulantes de colonias de granulocitos (G-FEC) en el tratamiento de la Sepsis Neonatal?", 
        options: ["Indicado en toda neutropenia severa", "No debe considerarse tratamiento de rutina", "Aplicar dosis única profiláctica al nacer", "Asociar siempre a transfusión plaquetaria"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, a pesar de que los neonatos con sepsis grave frecuentemente desarrollan neutropenia por agotamiento medular, los ensayos clínicos no han demostrado un beneficio tangible en la supervivencia o resolución de la infección al inyectar factores estimulantes. Dado su costo y dudosa eficacia en prematuros, su indicación rutinaria o estándar ha sido retirada de los protocolos actuales.<br><br>Perla ENARM: \"El uso de factores estimulantes de colonias de granulocitos (G-FEC) no debe considerarse como tratamiento de rutina.\"<br><br>Análisis de Distractores: Administrar G-FEC profilácticamente al nacer, por neutropenia de manera sistemática, o con plaquetas no está avalado por evidencia de calidad y genera un gasto injustificado con posibles efectos mieloproliferativos descontrolados en una médula inmadura.",

    {
        id: 37, 
        question: "En el abordaje del Choque Séptico Neonatal, ¿cuál hallazgo en la exploración vascular orienta al diagnóstico diferencial de cardiopatía dependiente de conducto (obligando al uso de Prostaglandina E1)?", 
        options: ["Diferencia en la tensión arterial y pulsos superiores e inferiores", "Llenado capilar sistémico generalizado menor a 2 segundos", "Hepatomegalia aguda con estertores pulmonares bilaterales", "Frecuencia cardíaca persistente de 135 latidos por minuto"], 
        answer: 0, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, anomalías como la coartación de aorta o interrupción del arco aórtico causan un choque obstructivo severo al momento del cierre del ductus arterioso. El signo pivote es la asimetría circulatoria: pulsos amplios y normotensión en miembros superiores (flujo preductal conservado) con pulsos débiles/ausentes e hipotensión en miembros inferiores (flujo posductal bloqueado).<br><br>Perla ENARM: \"Se debe iniciar prostaglandina E1, en infusión, hasta que se descarte cardiopatía congénita compleja dependiente de conducto en cualquier RN con choque que presente: Hepatomegalia, Cianosis, Soplo cardíaco, Diferencia en la tensión arterial y en la intensidad de los pulsos entre las extremidades superiores e inferiores.\"<br><br>Análisis de Distractores: El llenado capilar rápido (2 seg) y la FC de 135 lpm denotan buena perfusión y normalidad neonatal. La hepatomegalia aislada indica sobrecarga hídrica ventricular, pero la asimetría de pulsos es el signo patognomónico estricto de una cardiopatía obstructiva del arco aórtico.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 4. Choque Séptico, Página 35."

    {
        id: 38, 
        question: "¿Cuáles son los bacilos gramnegativos que la epidemiología neonatal asocia predominantemente al desarrollo de Sepsis de inicio tardío (nosocomial)?", 
        options: ["Escherichia coli y Salmonella typhi", "Klebsiella species y Acinetobacter", "Listeria monocytogenes y Haemophilus", "Neisseria meningitidis y Proteus mirabilis"], 
        answer: 1, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, a diferencia de la sepsis temprana mediada por patógenos vaginales (E. coli), la colonización posterior a los 7 días (tardía) es propiciada por el ambiente de la terapia intensiva, los catéteres y las manos del personal. Las enterobacterias multirresistentes como Klebsiella spp. y bacterias oportunistas ambientales como Acinetobacter spp. son los principales invasores nosocomiales.<br><br>Perla ENARM: \"Agentes patógenos más comunes en sepsis neonatal: Tardía (Entre 8-28 días) -> Klebsiella species, Acinetobacter, Enterobacter species, Pseudomonas.\"<br><br>Análisis de Distractores: Escherichia coli es dominante en sepsis temprana (intrauterina). Listeria monocytogenes es temprana. Neisseria y Salmonella no forman parte integral del perfil nosocomial en las unidades de cuidados intensivos neonatales, siendo diagnósticos anecdóticos en este grupo.", 
        source: "GPC-SS-283-19, Diagnóstico, tratamiento y pronóstico de la sepsis neonatal, 2019, 7. Anexos (Figura 2), Página 48."

    {
        id: 39, 
        question: "Durante la evolución de la Sepsis Neonatal temprana, ¿cuál es la utilidad clínica de la medición de procalcitonina sérica en entornos de escrutinio?", 
        options: ["Identificar específicamente infecciones por hongos", "Determinar alteraciones de la barrera hematoencefálica", "Medir el impacto directo sobre el neurodesarrollo", "Descartar la patología y definir uso de antibióticos"], 
        answer: 3, 
        justification: "Justificación: De acuerdo a la GPC de Sepsis Neonatal, aunque la procalcitonina no posee la especificidad suficiente para usarse como herramienta de diagnóstico único en la primera evaluación, su alto valor predictivo negativo tras 24 horas de vida permite, en conjunto con la clínica y hemocultivos estériles, descartar firmemente el estado infeccioso sistémico para así justificar la suspensión segura de la antibioticoterapia.<br><br>Perla ENARM: \"Determinar la PCT (en caso de tenerla disponible), para descartar sepsis neonatal, no para diagnóstico, así como, para definir la conducta del uso de antibiótico.\"<br><br>Análisis de Distractores: La procalcitonina no especifica el microorganismo (hongo o bacteria), no cruza la barrera hematoencefálica para diagnosticar meningitis, y no tiene valor predictivo respecto a la regeneración neuronal o pronóstico del neurodesarrollo a largo plazo.",

                    box.style.display = (term === '' || matchText || id.toString() === term) ? 'flex' : 'none';
                });

            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-sm cursor-pointer transition-all select-none border ";
            
            if (isActive) base += "ring-4 ring-blue-500 shadow-md z-10 border-blue-500 dark:border-blue-400 ";

            const state = userProgress[qId];
            if (!state || !state.answered) {
                return base + "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700 dark:hover:bg-slate-700";
            } else if (state.isCorrect) {
                return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
            } else {
                return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
            }
        }

                            <!-- Tarjeta de Estadísticas Modificada -->

                    </div>

                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">

        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('28319Progress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('28319LastQId', currentQuestionId);
                else localStorage.removeItem('28319LastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('28319Progress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
